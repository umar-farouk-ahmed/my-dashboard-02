<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0D0F14">
  <title>Umar's Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            graphite: '#0D0F14',
            panel: '#151822',
            panelAlt: '#1B1F2A',
            panelHi: '#20242F',
            hairline: '#262B38',
            ink: '#ECEAE4',
            inkMuted: '#8B90A3',
            linkA: '#7C9EFF',
            taskA: '#FFB454',
            planA: '#5FD9A4',
            ytA: '#FF6F91',
            fbA: '#1877F2', /* Facebook blue accent */
            noteA: '#A78BFA',
            urgent: '#FF5C7A',
            steady: '#63C8FF',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color .3s ease, color .3s ease; }
    body.modal-open { overflow: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #2E3444; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #3B4255; }

    /* Height-animated collapse using the grid-template-rows trick (no JS height math) */
    .panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .35s ease, opacity .3s ease;
      opacity: 1;
    }
    .panel-body > div { overflow: hidden; min-height: 0; }
    .panel.collapsed .panel-body { grid-template-rows: 0fr; opacity: 0; }

    .scroll-area { overflow-y: auto; scrollbar-gutter: stable; }
    /* Changed from max-height to fixed height for strict box sizing */
    .list-short { height: 320px; }
    .list-tall  { height: 460px; }

    /* Clamp long text in the lists — the full text opens in the editor */
    .clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { -webkit-line-clamp: 2; }
    .clamp-3 { -webkit-line-clamp: 3; }

    .openable { cursor: pointer; }
    .openable:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .entrance { animation: fadeInUp .45s ease both; }

    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-card { animation: modalIn .2s ease both; }

    :focus-visible { outline: 2px solid #7C9EFF; outline-offset: 2px; border-radius: 4px; }

    textarea { resize: vertical; }

    .seg { border: 1px solid transparent; }
    .done-text { text-decoration: line-through; }
    .media-preview { aspect-ratio: 16 / 9; }
    .media-preview button { touch-action: manipulation; }
    .media-player { width: 100%; height: 100%; border: 0; }
    /* Let the page scroll naturally on phones, without nested scroll traps. */
    @media (max-width: 767px) {
      .list-short, .list-tall { height: auto; max-height: none; }
      .scroll-area { overflow-y: visible; }
    }
    /* Touchscreen tablets have no hover; never hide edit/delete there. */
    @media (hover: none) { .edit-btn, .delete-btn { opacity: 1 !important; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-[#F7F6F2] dark:bg-graphite text-slate-800 dark:text-ink min-h-screen">

  <!-- Command bar -->
  <header class="sticky top-0 z-30 bg-[#F7F6F2]/85 dark:bg-graphite/85 backdrop-blur-md border-b border-slate-200 dark:border-hairline">
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 py-3 flex flex-wrap items-center gap-x-4 gap-y-3">

      <div class="flex items-center gap-3 mr-auto min-w-0">
        <div class="w-9 h-9 rounded-lg bg-slate-900 dark:bg-panelAlt border border-slate-800 dark:border-hairline flex items-center justify-center font-display font-bold text-xs text-white dark:text-inkMuted shrink-0">
          UD
        </div>
        <div class="min-w-0">
          <h1 id="greeting" class="font-display text-lg md:text-xl font-semibold tracking-tight text-slate-900 dark:text-white leading-tight truncate">Umar's Dashboard</h1>
          <p id="clockLine" class="text-[11px] font-mono text-inkMuted truncate"></p>
        </div>
      </div>

      <div class="order-last w-full lg:order-none lg:w-auto lg:flex-1 lg:max-w-md">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-inkMuted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"></path></svg>
          <input type="search" id="searchInput" placeholder="Search everything" aria-label="Search all panels"
            class="w-full pl-9 pr-16 py-2.5 text-sm bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA/40 transition-colors">
          <kbd class="hidden sm:block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono text-inkMuted border border-slate-200 dark:border-hairline rounded px-1.5 py-0.5">/</kbd>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="collapseAllBtn" class="hidden md:inline-flex items-center gap-2 px-3 py-2.5 text-xs font-medium rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          <span id="collapseAllLabel">Collapse all</span>
        </button>
        <button id="themeToggle" class="p-2.5 rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors" title="Toggle theme" aria-label="Toggle color theme">
          <span id="themeIcon">🌓</span>
        </button>
      </div>
    </div>

    <!-- Live counters -->
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 pb-3">
      <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 text-xs font-mono text-inkMuted">
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-taskA"></span><span id="statOpen">0</span> open</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-urgent"></span><span id="statHigh">0</span> high priority</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-planA"></span><span id="statDone">0</span> done</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span id="statTotal">0 items tracked</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span id="statMedia">0/0 watched</span>
        <span class="ml-auto inline-flex items-center gap-1.5" id="syncIndicator" title="Firestore synchronization status" role="status" aria-live="polite">
          <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
          <span id="syncText">Connecting…</span>
        </span>
        <span id="searchNotice" class="hidden items-center gap-1.5 text-linkA"></span>
      </div>
    </div>
  </header>

  <main class="max-w-[1500px] mx-auto px-4 md:px-8 py-6 entrance">
    <div class="flex flex-col gap-6">

      <!-- What To Do Next -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="tasks">
        <div class="h-1 bg-taskA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-taskA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span class="font-display font-semibold text-lg truncate">What To Do Next</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="taskCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex gap-2">
                <input type="text" id="taskInput" placeholder="What needs doing?" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-taskA/50 focus:border-taskA/40 transition-colors">
                <button id="addTaskBtn" class="bg-taskA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Add task">+</button>
              </div>

              <div class="flex items-center gap-2 mt-2.5">
                <span class="text-[11px] font-mono text-inkMuted shrink-0">priority</span>
                <div id="prioritySelect" class="flex gap-1.5 flex-wrap" role="group" aria-label="Priority for new task"></div>
              </div>

              <div class="flex items-center gap-1.5 mt-4 overflow-x-auto pb-1 -mx-1 px-1" id="taskFilters" role="group" aria-label="Filter tasks"></div>

              <ul id="taskList" class="scroll-area list-tall space-y-2 pr-1 mt-3"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="notes">
        <div class="h-1 bg-noteA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-noteA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Notes</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="noteCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5 grid grid-cols-1 lg:grid-cols-[minmax(0,320px)_minmax(0,1fr)] gap-5">

              <div class="flex flex-col gap-2.5 lg:border-r lg:border-slate-200 lg:dark:border-hairline lg:pr-5">
                <input type="text" id="noteTitleInput" placeholder="Note title" class="w-full px-3.5 py-2.5 text-sm font-medium bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                <textarea id="noteBodyInput" rows="4" placeholder="Write the note here..." class="w-full px-3.5 py-2.5 text-sm leading-relaxed bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors"></textarea>

                <div class="flex gap-2">
                  <input type="text" id="noteLinkLabelInput" placeholder="Link name" class="w-[38%] min-w-0 px-3 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                  <input type="text" id="noteLinkInput" placeholder="Paste a link" class="flex-1 min-w-0 px-3 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                  <button id="addNoteLinkBtn" class="bg-slate-100 dark:bg-panelAlt text-slate-600 dark:text-ink border border-slate-200 dark:border-hairline w-11 shrink-0 rounded-lg hover:border-noteA hover:text-noteA active:scale-95 transition-all font-bold" aria-label="Attach link">+</button>
                </div>

                <div id="noteLinkChips" class="hidden flex-wrap gap-2"></div>

                <button id="addNoteBtn" class="mt-1 w-full bg-noteA text-white py-2.5 rounded-lg font-semibold text-sm hover:brightness-110 active:scale-[.98] transition-all">Save note</button>
                <p class="text-[11px] font-mono text-inkMuted">Ctrl + Enter saves · YouTube links embed</p>
              </div>

              <ul id="noteList" class="scroll-area list-tall grid grid-cols-1 xl:grid-cols-2 gap-4 pr-1 content-start"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Quick Links -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="links">
        <div class="h-1 bg-linkA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-linkA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Quick Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="linkCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col gap-2.5 mb-4">
                <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA/40 transition-colors">
                <div class="flex gap-2">
                  <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA/40 transition-colors">
                  <button id="addLinkBtn" class="bg-linkA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Save link">+</button>
                </div>
              </div>
              <ul id="linkList" class="scroll-area list-short space-y-2 pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Long Term Plans -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="plans">
        <div class="h-1 bg-planA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-planA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 18L9 11.25l4.306 4.306a11.95 11.95 0 015.814-5.518l2.74-1.22M21.75 12.75V7.5h-5.25"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Long Term Plans</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="planCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex gap-2 mb-4">
                <input type="text" id="planInput" placeholder="Add a future plan..." class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-planA/50 focus:border-planA/40 transition-colors">
                <button id="addPlanBtn" class="bg-planA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Add plan">+</button>
              </div>
              <ul id="planList" class="scroll-area list-short space-y-2 pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- YouTube -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="yt">
        <div class="h-1 bg-ytA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-ytA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="font-display font-semibold text-lg truncate">YouTube Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="ytCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col sm:flex-row gap-2.5 mb-4">
                <input type="text" id="ytTitleInput" placeholder="Video title (e.g. Learn Python)" class="sm:w-[40%] min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-ytA/50 focus:border-ytA/40 transition-colors">
                <div class="flex gap-2 flex-1">
                  <input type="text" id="ytInput" placeholder="Paste YT link here..." class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-ytA/50 focus:border-ytA/40 transition-colors">
