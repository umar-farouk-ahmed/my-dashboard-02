<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-slate-800">My Dashboard</h1>
      <p class="text-slate-500">Live Syncing without Authentication</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- What To Do Next -->
      <div class="glass p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4">What To Do Next</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="taskInput" placeholder="New task..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button id="addTaskBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+</button>
        </div>
        <ul id="taskList" class="space-y-2"></ul>
      </div>

      <!-- Long Term Plans -->
      <div class="glass p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4">Plans</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="planInput" placeholder="New plan..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
          <button id="addPlanBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">+</button>
        </div>
        <ul id="planList" class="space-y-2"></ul>
      </div>

      <!-- YT Videos -->
      <div class="glass p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-4">YouTube Links</h2>
        <div class="flex gap-2 mb-4">
          <input type="text" id="ytInput" placeholder="Paste YT Link..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
          <button id="addYtBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">+</button>
        </div>
        <ul id="ytList" class="space-y-4"></ul>
      </div>

    </div>
  </div>

  <script type="module">
    // 1. Import Firebase Core and Firestore
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // 2. Your specific Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4. Define UI Elements
    const lists = {
      tasks: document.getElementById('taskList'),
      plans: document.getElementById('planList'),
      yt: document.getElementById('ytList')
    };

    // 5. Helper function to extract YouTube ID
    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 6. Generic function to add items to Firestore
    async function addItem(collectionName, inputElement, isYT = false) {
      const text = inputElement.value.trim();
      if (!text) return;

      let dataToSave = { text, createdAt: serverTimestamp() };
      
      if (isYT) {
        const vidId = getYTVideoId(text);
        if (!vidId) {
          alert('Invalid YouTube Link');
          return;
        }
        dataToSave.videoId = vidId;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    // 7. Generic function to listen and render items from Firestore
    function listenToCollection(collectionName, listElement, isYT = false) {
      const q = query(collection(db, collectionName), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        listElement.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement('li');
          li.className = 'flex flex-col gap-2 p-3 bg-white rounded-lg border shadow-sm';
          
          if (isYT && data.videoId) {
            li.innerHTML = `
              <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-md bg-black">
                <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${data.videoId}" frameborder="0" allowfullscreen></iframe>
              </div>
              <button class="delete-btn text-sm text-red-500 hover:text-red-700 text-left mt-1">Delete Video</button>
            `;
          } else {
            li.innerHTML = `
              <div class="flex justify-between items-center w-full">
                <span class="text-slate-700">${data.text}</span>
                <button class="delete-btn text-slate-400 hover:text-red-500">✕</button>
              </div>
            `;
          }

          // Delete logic
          li.querySelector('.delete-btn').addEventListener('click', async () => {
            await deleteDoc(doc(db, collectionName, docSnap.id));
          });

          listElement.appendChild(li);
        });
      });
    }

    // 8. Wire up buttons
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput')));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput')));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), true));

    // Allow pressing "Enter" to add items
    ['taskInput', 'planInput', 'ytInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById(id.replace('Input', 'Btn')).click();
      });
    });

    // 9. Start listening to databases
    listenToCollection('tasks', lists.tasks);
    listenToCollection('plans', lists.plans);
    listenToCollection('ytLinks', lists.yt, true);

  </script>
</body>
</html>
