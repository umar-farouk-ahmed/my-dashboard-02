<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Organizer</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Modal and Toast animations */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
        .modal-active { display: flex !important; }
        
        /* Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-sm">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Cloud Organizer</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="user-display" class="hidden text-slate-500 font-medium items-center gap-2">
                    <i class="fa-regular fa-user"></i> <span id="user-email"></span>
                </span>
                <button id="btn-logout" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md font-medium transition-colors border border-slate-300 items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- COLUMN 1: To-Dos -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-slate-800">
                        <i class="fa-solid fa-list-check text-blue-500"></i> What to do next
                    </h2>
                    <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded-full" id="todo-count">0</span>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-todo" class="p-4 border-b border-slate-100 flex gap-2 bg-slate-50">
                        <input type="text" id="input-todo" required placeholder="Add a new task..." class="flex-grow px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium shadow-sm">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-2" id="list-todo">
                        <div class="flex justify-center p-8"><div class="loader"></div></div>
                    </div>
                </div>
            </section>

            <!-- COLUMN 2: Long-term Plans -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-slate-800">
                        <i class="fa-solid fa-compass text-purple-500"></i> Long-Term Plans
                    </h2>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-plan" class="p-4 border-b border-slate-100 flex flex-col gap-2 bg-slate-50">
                        <input type="text" id="input-plan-title" required placeholder="Goal / Plan title" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-shadow">
                        <textarea id="input-plan-desc" rows="2" placeholder="Describe your plan..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-shadow resize-none"></textarea>
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium mt-1 w-full flex justify-center items-center gap-2 shadow-sm">
                            <i class="fa-solid fa-paper-plane"></i> Add Plan
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-4 space-y-3" id="list-plan">
                        <div class="flex justify-center p-8"><div class="loader"></div></div>
                    </div>
                </div>
            </section>

            <!-- COLUMN 3: YouTube Links -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-slate-800">
                        <i class="fa-brands fa-youtube text-red-500"></i> Saved Videos
                    </h2>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-youtube" class="p-4 border-b border-slate-100 flex flex-col gap-2 bg-slate-50">
                        <input type="url" id="input-youtube-url" required placeholder="https://youtube.com/watch?v=..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow">
                        <input type="text" id="input-youtube-title" placeholder="Custom Title (Optional)" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium mt-1 w-full flex justify-center items-center gap-2 shadow-sm">
                            <i class="fa-solid fa-bookmark"></i> Save Video
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-4 space-y-4" id="list-youtube">
                        <div class="flex justify-center p-8"><div class="loader"></div></div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-6 text-center border-b border-slate-100 bg-slate-50">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h3 class="font-bold text-xl text-slate-800">Welcome to Cloud Organizer</h3>
                <p class="text-sm text-slate-500 mt-2">Sign in to sync your data across all your devices.</p>
            </div>
            
            <div class="p-6">
                <form id="form-auth" class="space-y-4">
                    <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200"></div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                        <input type="email" id="auth-email" required class="w-full px-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white transition-colors" placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" id="auth-password" required class="w-full px-4 py-2.5 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white transition-colors" placeholder="••••••••">
                    </div>
                    
                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="btn-login" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg transition-colors text-sm font-semibold shadow-sm">
                            Log In
                        </button>
                        <button type="button" id="btn-signup" class="flex-1 bg-white hover:bg-slate-50 text-blue-600 border border-blue-600 px-4 py-2.5 rounded-lg transition-colors text-sm font-semibold">
                            Sign Up
                        </button>
                    </div>
                    
                    <div class="relative flex py-4 items-center">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase font-medium">Or</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>
                    
                    <button type="button" id="btn-guest" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-lg transition-colors text-sm font-medium">
                        Continue as Guest (No Sync)
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
