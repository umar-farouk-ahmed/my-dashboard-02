<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Umar's Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            graphite: '#0D0F14',
            panel: '#151822',
            panelAlt: '#1B1F2A',
            panelHi: '#20242F',
            hairline: '#262B38',
            ink: '#ECEAE4',
            inkMuted: '#8B90A3',
            linkA: '#7C9EFF',
            taskA: '#FFB454',
            planA: '#5FD9A4',
            ytA: '#FF6F91',
            noteA: '#A78BFA',
            urgent: '#FF5C7A',
            steady: '#63C8FF',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color .3s ease, color .3s ease; }
    body.modal-open { overflow: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #2E3444; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #3B4255; }

    /* Height-animated collapse using the grid-template-rows trick (no JS height math) */
    .panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .35s ease, opacity .3s ease;
      opacity: 1;
    }
    .panel-body > div { overflow: hidden; min-height: 0; }
    .panel.collapsed .panel-body { grid-template-rows: 0fr; opacity: 0; }

    .scroll-area { overflow-y: auto; scrollbar-gutter: stable; }
    /* Changed from max-height to fixed height for strict box sizing */
    .list-short { height: 320px; }
    .list-tall  { height: 460px; }

    /* Clamp long text in the lists — the full text opens in the editor */
    .clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { -webkit-line-clamp: 2; }
    .clamp-3 { -webkit-line-clamp: 3; }

    .openable { cursor: pointer; }
    .openable:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .entrance { animation: fadeInUp .45s ease both; }

    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .modal-card { animation: modalIn .2s ease both; }

    :focus-visible { outline: 2px solid #7C9EFF; outline-offset: 2px; border-radius: 4px; }

    textarea { resize: vertical; }

    .seg { border: 1px solid transparent; }
    .done-text { text-decoration: line-through; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-[#F7F6F2] dark:bg-graphite text-slate-800 dark:text-ink min-h-screen">

  <!-- Command bar -->
  <header class="sticky top-0 z-30 bg-[#F7F6F2]/85 dark:bg-graphite/85 backdrop-blur-md border-b border-slate-200 dark:border-hairline">
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 py-3 flex flex-wrap items-center gap-x-4 gap-y-3">

      <div class="flex items-center gap-3 mr-auto min-w-0">
        <div class="w-9 h-9 rounded-lg bg-slate-900 dark:bg-panelAlt border border-slate-800 dark:border-hairline flex items-center justify-center font-display font-bold text-xs text-white dark:text-inkMuted shrink-0">
          UD
        </div>
        <div class="min-w-0">
          <h1 id="greeting" class="font-display text-lg md:text-xl font-semibold tracking-tight text-slate-900 dark:text-white leading-tight truncate">Umar's Dashboard</h1>
          <p id="clockLine" class="text-[11px] font-mono text-inkMuted truncate"></p>
        </div>
      </div>

      <div class="order-last w-full lg:order-none lg:w-auto lg:flex-1 lg:max-w-md">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-inkMuted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"></path></svg>
          <input type="search" id="searchInput" placeholder="Search everything" aria-label="Search all panels"
            class="w-full pl-9 pr-16 py-2.5 text-sm bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA/40 transition-colors">
          <kbd class="hidden sm:block absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono text-inkMuted border border-slate-200 dark:border-hairline rounded px-1.5 py-0.5">/</kbd>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="collapseAllBtn" class="hidden md:inline-flex items-center gap-2 px-3 py-2.5 text-xs font-medium rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          <span id="collapseAllLabel">Collapse all</span>
        </button>
        <button id="themeToggle" class="p-2.5 rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors" title="Toggle theme" aria-label="Toggle color theme">
          <span id="themeIcon">🌓</span>
        </button>
      </div>
    </div>

    <!-- Live counters -->
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 pb-3">
      <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 text-xs font-mono text-inkMuted">
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-taskA"></span><span id="statOpen">0</span> open</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-urgent"></span><span id="statHigh">0</span> high priority</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-planA"></span><span id="statDone">0</span> done</span>
        <span class="hidden sm:block w-px h-3 bg-slate-200 dark:bg-hairline"></span>
        <span id="statTotal">0 items tracked</span>
        <span id="searchNotice" class="hidden items-center gap-1.5 text-linkA"></span>
      </div>
    </div>
  </header>

  <main class="max-w-[1500px] mx-auto px-4 md:px-8 py-6 entrance">
    <!-- Changed to a single vertical column stack -->
    <div class="flex flex-col gap-6">

      <!-- What To Do Next -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="tasks">
        <div class="h-1 bg-taskA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-taskA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span class="font-display font-semibold text-lg truncate">What To Do Next</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="taskCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">

              <div class="flex gap-2">
                <input type="text" id="taskInput" placeholder="What needs doing?" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-taskA/50 focus:border-taskA/40 transition-colors">
                <button id="addTaskBtn" class="bg-taskA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Add task">+</button>
              </div>

              <div class="flex items-center gap-2 mt-2.5">
                <span class="text-[11px] font-mono text-inkMuted shrink-0">priority</span>
                <div id="prioritySelect" class="flex gap-1.5 flex-wrap" role="group" aria-label="Priority for new task"></div>
              </div>

              <div class="flex items-center gap-1.5 mt-4 overflow-x-auto pb-1 -mx-1 px-1" id="taskFilters" role="group" aria-label="Filter tasks"></div>

              <ul id="taskList" class="scroll-area list-tall space-y-2 pr-1 mt-3"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="notes">
        <div class="h-1 bg-noteA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-noteA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Notes</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="noteCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5 grid grid-cols-1 lg:grid-cols-[minmax(0,320px)_minmax(0,1fr)] gap-5">

              <div class="flex flex-col gap-2.5 lg:border-r lg:border-slate-200 lg:dark:border-hairline lg:pr-5">
                <input type="text" id="noteTitleInput" placeholder="Note title" class="w-full px-3.5 py-2.5 text-sm font-medium bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                <textarea id="noteBodyInput" rows="4" placeholder="Write the note here..." class="w-full px-3.5 py-2.5 text-sm leading-relaxed bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors"></textarea>

                <div class="flex gap-2">
                  <input type="text" id="noteLinkLabelInput" placeholder="Link name" class="w-[38%] min-w-0 px-3 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                  <input type="text" id="noteLinkInput" placeholder="Paste a link" class="flex-1 min-w-0 px-3 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA/40 transition-colors">
                  <button id="addNoteLinkBtn" class="bg-slate-100 dark:bg-panelAlt text-slate-600 dark:text-ink border border-slate-200 dark:border-hairline w-11 shrink-0 rounded-lg hover:border-noteA hover:text-noteA active:scale-95 transition-all font-bold" aria-label="Attach link">+</button>
                </div>

                <div id="noteLinkChips" class="hidden flex-wrap gap-2"></div>

                <button id="addNoteBtn" class="mt-1 w-full bg-noteA text-white py-2.5 rounded-lg font-semibold text-sm hover:brightness-110 active:scale-[.98] transition-all">Save note</button>
                <p class="text-[11px] font-mono text-inkMuted">Ctrl + Enter saves · YouTube links embed</p>
              </div>

              <ul id="noteList" class="scroll-area list-tall grid grid-cols-1 xl:grid-cols-2 gap-4 pr-1 content-start"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Quick Links -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="links">
        <div class="h-1 bg-linkA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-linkA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Quick Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="linkCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col gap-2.5 mb-4">
                <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA/40 transition-colors">
                <div class="flex gap-2">
                  <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA/40 transition-colors">
                  <button id="addLinkBtn" class="bg-linkA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Save link">+</button>
                </div>
              </div>
              <ul id="linkList" class="scroll-area list-short space-y-2 pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Long Term Plans -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="plans">
        <div class="h-1 bg-planA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-planA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 18L9 11.25l4.306 4.306a11.95 11.95 0 015.814-5.518l2.74-1.22M21.75 12.75V7.5h-5.25"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Long Term Plans</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="planCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex gap-2 mb-4">
                <input type="text" id="planInput" placeholder="Add a future plan..." class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-planA/50 focus:border-planA/40 transition-colors">
                <button id="addPlanBtn" class="bg-planA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Add plan">+</button>
              </div>
              <ul id="planList" class="scroll-area list-short space-y-2 pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- YouTube -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-sm dark:shadow-none overflow-hidden" data-panel="yt">
        <div class="h-1 bg-ytA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-ytA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="font-display font-semibold text-lg truncate">YouTube Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="ytCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col sm:flex-row gap-2.5 mb-4">
                <input type="text" id="ytTitleInput" placeholder="Video title (e.g. Learn Python)" class="sm:w-[40%] min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-ytA/50 focus:border-ytA/40 transition-colors">
                <div class="flex gap-2 flex-1">
                  <input type="text" id="ytInput" placeholder="Paste YT link here..." class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-ytA/50 focus:border-ytA/40 transition-colors">
                  <button id="addYtBtn" class="bg-ytA text-white w-11 shrink-0 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold" aria-label="Save video">+</button>
                </div>
              </div>
              <ul id="ytList" class="scroll-area list-tall grid grid-cols-1 lg:grid-cols-2 gap-4 pr-1 content-start"></ul>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Detail / edit dialog -->
  <div id="editorOverlay" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-6">
    <div id="editorBackdrop" class="absolute inset-0 bg-slate-900/40 dark:bg-black/60 backdrop-blur-sm"></div>

    <div role="dialog" aria-modal="true" aria-labelledby="editorTitle"
         class="modal-card relative w-full max-w-2xl max-h-[88vh] flex flex-col bg-white dark:bg-panel border border-slate-200 dark:border-hairline rounded-2xl shadow-xl overflow-hidden">
      <div id="editorAccent" class="h-1 bg-taskA"></div>

      <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-200 dark:border-hairline">
        <h2 id="editorTitle" class="font-display font-semibold text-lg text-slate-900 dark:text-white">Edit</h2>
        <button id="editorClose" class="p-1.5 rounded-lg text-inkMuted hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-panelAlt transition-colors" aria-label="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="editorFields" class="px-5 py-4 overflow-y-auto flex flex-col gap-4"></div>

      <div class="flex items-center justify-between gap-3 px-5 py-4 border-t border-slate-200 dark:border-hairline">
        <button id="editorDelete" class="text-sm text-rose-500 hover:text-rose-600 font-medium transition-colors">Delete</button>
        <div class="flex items-center gap-2">
          <span class="hidden sm:block text-[11px] font-mono text-inkMuted mr-1">Ctrl + Enter</span>
          <button id="editorCancel" class="px-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors">Cancel</button>
          <button id="editorSave" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-900 dark:bg-ink text-white dark:text-graphite hover:brightness-110 active:scale-95 transition-all">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // --- THEME ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const dark = html.classList.contains('dark');
      localStorage.theme = dark ? 'dark' : 'light';
      themeIcon.textContent = dark ? '☀️' : '🌙';
    });

    // --- CLOCK + GREETING ---
    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      const part = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : hour < 22 ? 'Good evening' : 'Winding down';
      document.getElementById('greeting').textContent = `${part}, Umar`;
      document.getElementById('clockLine').textContent =
        now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }) +
        '   ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- COLLAPSE / EXPAND ---
    const panels = [...document.querySelectorAll('.panel')];
    const panelApi = new Map();

    panels.forEach((panel) => {
      const key = 'panelCollapsed:' + panel.dataset.panel;
      const toggleBtn = panel.querySelector('.collapse-toggle');
      const chevron = panel.querySelector('.chevron');

      const setCollapsed = (collapsed, persist = true) => {
        panel.classList.toggle('collapsed', collapsed);
        chevron.classList.toggle('-rotate-90', collapsed);
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        if (persist) localStorage.setItem(key, String(collapsed));
      };

      panelApi.set(panel, setCollapsed);
      if (localStorage.getItem(key) === 'true') setCollapsed(true, false);

      toggleBtn.addEventListener('click', () => {
        setCollapsed(!panel.classList.contains('collapsed'));
        syncCollapseAllLabel();
      });
    });

    const collapseAllBtn = document.getElementById('collapseAllBtn');
    const collapseAllLabel = document.getElementById('collapseAllLabel');
    function syncCollapseAllLabel() {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      collapseAllLabel.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
    }
    syncCollapseAllLabel();
    collapseAllBtn.addEventListener('click', () => {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      panels.forEach(p => panelApi.get(p)(!allCollapsed));
      syncCollapseAllLabel();
    });

    // --- FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- HELPERS ---
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const normalizeUrl = (url) => {
      const t = url.trim();
      if (!t) return '';
      return /^https?:\/\//i.test(t) ? t : 'https://' + t;
    };

    const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };

    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    const faviconFor = (url) => {
      try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`; }
      catch { return ''; }
    };

    const trashIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
    const editIcon  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>`;

    const iconBtn = 'text-inkMuted hover:text-slate-900 dark:hover:text-white transition-colors shrink-0 p-1 opacity-0 group-hover/item:opacity-100 focus:opacity-100';

    // --- PRIORITIES ---
    const PRIORITIES = {
      high:   { label: 'High',   rank: 0, dot: 'bg-urgent', chip: 'text-rose-600 dark:text-rose-300 bg-rose-500/10 border-rose-500/30', on: 'bg-urgent text-white border-urgent' },
      medium: { label: 'Medium', rank: 1, dot: 'bg-taskA',  chip: 'text-amber-600 dark:text-amber-300 bg-amber-500/10 border-amber-500/30', on: 'bg-taskA text-white border-taskA' },
      low:    { label: 'Low',    rank: 2, dot: 'bg-steady', chip: 'text-sky-600 dark:text-sky-300 bg-sky-500/10 border-sky-500/30', on: 'bg-steady text-white border-steady' },
    };
    const PRIORITY_ORDER = ['high', 'medium', 'low'];
    const priorityOf = (t) => PRIORITIES[t.priority] ? t.priority : 'medium';

    let newTaskPriority = localStorage.getItem('newTaskPriority') || 'medium';
    if (!PRIORITIES[newTaskPriority]) newTaskPriority = 'medium';

    const prioritySelect = document.getElementById('prioritySelect');
    function renderPrioritySelect() {
      prioritySelect.innerHTML = '';
      PRIORITY_ORDER.forEach((p) => {
        const conf = PRIORITIES[p];
        const active = p === newTaskPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold' : 'bg-slate-100 dark:bg-panelAlt text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white/80' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => {
          newTaskPriority = p;
          localStorage.setItem('newTaskPriority', p);
          renderPrioritySelect();
        });
        prioritySelect.appendChild(btn);
      });
    }
    renderPrioritySelect();

    // --- FILTERS + SEARCH ---
    let taskFilter = localStorage.getItem('taskFilter') || 'open';
    let searchTerm = '';

    const FILTERS = [
      { id: 'open', label: 'Open' },
      { id: 'high', label: 'High' },
      { id: 'medium', label: 'Medium' },
      { id: 'low', label: 'Low' },
      { id: 'done', label: 'Done' },
      { id: 'all', label: 'All' },
    ];

    const taskFilters = document.getElementById('taskFilters');
    function renderFilters() {
      taskFilters.innerHTML = '';
      FILTERS.forEach(f => {
        const active = f.id === taskFilter;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg shrink-0 px-2.5 py-1 rounded-lg text-xs transition-colors ' +
          (active ? 'bg-slate-900 dark:bg-ink text-white dark:text-graphite border-slate-900 dark:border-ink font-semibold'
                  : 'bg-transparent text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          taskFilter = f.id;
          localStorage.setItem('taskFilter', f.id);
          renderFilters();
          renderList('tasks');
          updateStats();
        });
        taskFilters.appendChild(btn);
      });
    }
    renderFilters();

    const searchInput = document.getElementById('searchInput');
    const searchNotice = document.getElementById('searchNotice');
    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value.trim().toLowerCase();
      Object.keys(state).forEach(renderList);
      updateStats();
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing && !editing) { e.preventDefault(); searchInput.focus(); }
    });

    // --- STATE ---
    const state = { tasks: [], notes: [], links: [], plans: [], yt: [] };

    const config = {
      tasks: { collection: 'tasks',      el: document.getElementById('taskList'), countId: 'taskCount', accent: 'bg-taskA', title: 'Task' },
      notes: { collection: 'notes',      el: document.getElementById('noteList'), countId: 'noteCount', accent: 'bg-noteA', title: 'Note' },
      links: { collection: 'quickLinks', el: document.getElementById('linkList'), countId: 'linkCount', accent: 'bg-linkA', title: 'Link' },
      plans: { collection: 'plans',      el: document.getElementById('planList'), countId: 'planCount', accent: 'bg-planA', title: 'Plan' },
      yt:    { collection: 'ytLinks',    el: document.getElementById('ytList'),   countId: 'ytCount',   accent: 'bg-ytA',   title: 'Video' },
    };

    const emptyMessages = {
      tasks: 'Nothing here — add a task or switch the filter.',
      notes: 'No notes yet — write one on the left.',
      links: 'No links saved yet — add one above.',
      plans: 'No plans yet — sketch out what\'s next.',
      yt: 'No videos saved yet — paste a link above.'
    };

    function searchableText(key, item) {
      if (key === 'notes') {
        const linkText = (item.links || []).map(l => `${l.label || ''} ${l.url || ''}`).join(' ');
        return `${item.text || ''} ${item.body || ''} ${linkText}`.toLowerCase();
      }
      return `${item.text || ''} ${item.url || ''}`.toLowerCase();
    }

    /* ==========================================================
       DETAIL / EDIT DIALOG
       ========================================================== */
    const overlay = document.getElementById('editorOverlay');
    const editorFields = document.getElementById('editorFields');
    const editorTitleEl = document.getElementById('editorTitle');
    const editorAccent = document.getElementById('editorAccent');
    let editing = null;          // { key, id }
    let editPriority = 'medium'; // task priority inside the dialog
    let editDone = false;

    const fieldInput = 'w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA/40 transition-colors';
    const fieldLabel = 'text-[11px] font-mono text-inkMuted mb-1.5 block';

    function field(label, inner) {
      return `<label class="block"><span class="${fieldLabel}">${label}</span>${inner}</label>`;
    }

    function linkRow(link = { label: '', url: '' }) {
      return `
        <div class="ed-link-row flex gap-2 items-center">
          <input type="text" class="ed-link-label w-[34%] min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="Name" value="${esc(link.label || '')}">
          <input type="text" class="ed-link-url flex-1 min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="https://" value="${esc(link.url || '')}">
          <button type="button" class="ed-link-remove w-9 h-9 shrink-0 rounded-lg border border-slate-200 dark:border-hairline text-inkMuted hover:text-rose-500 hover:border-rose-400 transition-colors" aria-label="Remove link">&times;</button>
        </div>`;
    }

    function buildEditorFields(key, item) {
      if (key === 'tasks') {
        editPriority = priorityOf(item);
        editDone = !!item.done;
        editorFields.innerHTML =
          field('Task', `<textarea id="edText" rows="5" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Priority</span>
             <div id="edPriority" class="flex gap-1.5 flex-wrap"></div>
           </div>
           <label class="flex items-center gap-2.5 cursor-pointer select-none">
             <input type="checkbox" id="edDone" ${editDone ? 'checked' : ''} class="w-4 h-4 accent-planA">
             <span class="text-sm text-slate-600 dark:text-inkMuted">Mark as done</span>
           </label>`;
        renderEditPriority();
      }
      else if (key === 'plans') {
        editorFields.innerHTML = field('Plan', `<textarea id="edText" rows="6" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`);
      }
      else if (key === 'links') {
        editorFields.innerHTML =
          field('Name', `<input type="text" id="edText" class="${fieldInput}" value="${esc(item.text)}">`) +
          field('URL', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="${esc(item.url || '')}">`) +
          `<a href="${esc(item.url || '#')}" target="_blank" rel="noopener" class="text-xs text-linkA hover:underline">Open this link in a new tab</a>`;
      }
      else if (key === 'yt') {
        editorFields.innerHTML =
          field('Title', `<textarea id="edText" rows="3" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          field('YouTube link', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="https://youtu.be/${esc(item.videoId || '')}">`) +
          `<div class="relative pb-[56.25%] h-0 overflow-hidden rounded-lg bg-black">
             <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${esc(item.videoId || '')}" frameborder="0" allowfullscreen loading="lazy"></iframe>
           </div>`;
      }
      else if (key === 'notes') {
        const links = Array.isArray(item.links) ? item.links : [];
        editorFields.innerHTML =
          field('Title', `<input type="text" id="edText" class="${fieldInput} font-medium" value="${esc(item.text)}">`) +
          field('Note', `<textarea id="edBody" rows="8" class="${fieldInput} leading-relaxed">${esc(item.body || '')}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Links</span>
             <div id="edLinks" class="flex flex-col gap-2">${links.map(linkRow).join('')}</div>
             <button type="button" id="edAddLink" class="mt-2 text-xs font-medium text-noteA hover:underline">+ Add another link</button>
           </div>`;

        document.getElementById('edAddLink').addEventListener('click', () => {
          document.getElementById('edLinks').insertAdjacentHTML('beforeend', linkRow());
        });
        editorFields.addEventListener('click', (e) => {
          const btn = e.target.closest('.ed-link-remove');
          if (btn) btn.closest('.ed-link-row').remove();
        });
      }
    }

    function renderEditPriority() {
      const box = document.getElementById('edPriority');
      if (!box) return;
      box.innerHTML = '';
      PRIORITY_ORDER.forEach(p => {
        const conf = PRIORITIES[p];
        const active = p === editPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold' : 'bg-slate-100 dark:bg-panelAlt text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white/80' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => { editPriority = p; renderEditPriority(); });
        box.appendChild(btn);
      });
    }

    function openEditor(key, item) {
      editing = { key, id: item.id };
      editorTitleEl.textContent = config[key].title;
      editorAccent.className = 'h-1 ' + config[key].accent;
      buildEditorFields(key, item);

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.body.classList.add('modal-open');

      const first = document.getElementById('edText');
      if (first) {
        first.focus();
        if (first.setSelectionRange) {
          const end = first.value.length;
          first.setSelectionRange(end, end);
        }
      }
    }

    function closeEditor() {
      editing = null;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.body.classList.remove('modal-open');
      editorFields.innerHTML = '';
    }

    async function saveEditor() {
      if (!editing) return;
      const { key, id } = editing;
      const ref = doc(db, config[key].collection, id);
      const textEl = document.getElementById('edText');
      const text = textEl ? textEl.value.trim() : '';

      let patch = null;

      if (key === 'tasks' || key === 'plans') {
        if (!text) { alert('Text cannot be empty.'); return; }
        patch = key === 'tasks'
          ? { text, priority: editPriority, done: document.getElementById('edDone').checked }
          : { text };
      }
      else if (key === 'links') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (!url) { alert('A URL is required.'); return; }
        patch = { text: text || hostOf(url), url };
      }
      else if (key === 'yt') {
        const vidId = getYTVideoId(document.getElementById('edUrl').value.trim());
        if (!vidId) { alert('That does not look like a YouTube link.'); return; }
        patch = { text: text || 'Untitled video', videoId: vidId };
      }
      else if (key === 'notes') {
        const body = document.getElementById('edBody').value.trim();
        const links = [...document.querySelectorAll('#edLinks .ed-link-row')]
          .map(row => ({
            label: row.querySelector('.ed-link-label').value.trim(),
            url: normalizeUrl(row.querySelector('.ed-link-url').value)
          }))
          .filter(l => l.url);
        if (!text && !body && !links.length) { alert('The note is empty.'); return; }
        patch = { text: text || 'Untitled note', body, links };
      }

      try {
        await updateDoc(ref, patch);
        closeEditor();
      } catch (err) {
        console.error(err);
        alert('Could not save — the item may have been deleted.');
      }
    }

    async function deleteFromEditor() {
      if (!editing) return;
      const { key, id } = editing;
      if (!confirm('Delete this permanently?')) return;
      try { await deleteDoc(doc(db, config[key].collection, id)); } catch (err) { console.error(err); }
      closeEditor();
    }

    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorCancel').addEventListener('click', closeEditor);
    document.getElementById('editorBackdrop').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    document.getElementById('editorDelete').addEventListener('click', deleteFromEditor);

    document.addEventListener('keydown', (e) => {
      if (!editing) return;
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); }
    });

    // --- RENDERERS ---
    function renderNoteLink(link) {
      if (!link || !link.url) return '';
      const vidId = getYTVideoId(link.url);

      if (vidId) {
        return `
          <div class="flex flex-col gap-2">
            <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-lg bg-black">
              <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${esc(vidId)}" title="${esc(link.label || 'YouTube video')}" frameborder="0" allowfullscreen loading="lazy"></iframe>
            </div>
            ${link.label ? `<span class="text-xs text-inkMuted truncate">${esc(link.label)}</span>` : ''}
          </div>`;
      }

      const host = hostOf(link.url);
      const favicon = faviconFor(link.url);
      return `
        <a href="${esc(link.url)}" target="_blank" rel="noopener" class="flex items-center gap-3 p-2.5 rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline hover:border-noteA/60 transition-colors group/link">
          <span class="w-8 h-8 shrink-0 rounded-md bg-slate-100 dark:bg-panelHi border border-slate-200 dark:border-hairline flex items-center justify-center overflow-hidden">
            ${favicon ? `<img src="${esc(favicon)}" class="w-4 h-4" onerror="this.style.visibility='hidden'" alt="">` : ''}
          </span>
          <span class="flex flex-col min-w-0 leading-tight">
            <span class="text-sm font-medium text-slate-700 dark:text-ink truncate group-hover/link:text-noteA transition-colors">${esc(link.label || host)}</span>
            <span class="text-xs font-mono text-inkMuted truncate">${esc(host)}</span>
          </span>
          <svg class="w-4 h-4 ml-auto shrink-0 text-inkMuted group-hover/link:text-noteA transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>`;
    }

    function buildItem(key, item) {
      const collectionName = config[key].collection;
      const li = document.createElement('li');
      const open = () => openEditor(key, item);

      if (key === 'tasks') {
        const p = priorityOf(item);
        const conf = PRIORITIES[p];
        const done = !!item.done;

        li.className = 'group/item flex items-start gap-3 p-3 rounded-xl bg-slate-50 dark:bg-panelAlt border border-slate-200/70 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/30 transition-colors' + (done ? ' opacity-60' : '');
        li.innerHTML = `
          <button class="toggle-btn mt-0.5 w-5 h-5 shrink-0 rounded-md border-2 flex items-center justify-center transition-colors ${done ? 'bg-planA border-planA text-white' : 'border-slate-300 dark:border-inkMuted/50 hover:border-planA'}" aria-label="${done ? 'Mark as not done' : 'Mark as done'}" aria-pressed="${done}">
            ${done ? `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : ''}
          </button>
          <div class="min-w-0 flex-1">
            <p class="open-target openable clamp-2 text-sm text-slate-700 dark:text-ink break-words ${done ? 'done-text' : ''}" title="Click to open">${esc(item.text)}</p>
            <button class="priority-btn seg mt-1.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] ${conf.chip} hover:brightness-110 transition-all" title="Change priority">
              <span class="w-1.5 h-1.5 rounded-full ${conf.dot}"></span>${conf.label}
            </button>
          </div>
          <div class="flex items-center shrink-0">
            <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
            <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete task">${trashIcon}</button>
          </div>`;

        li.querySelector('.toggle-btn').addEventListener('click', () =>
          updateDoc(doc(db, collectionName, item.id), { done: !done })
        );
        li.querySelector('.priority-btn').addEventListener('click', () => {
          const next = PRIORITY_ORDER[(PRIORITY_ORDER.indexOf(p) + 1) % PRIORITY_ORDER.length];
          updateDoc(doc(db, collectionName, item.id), { priority: next });
        });
      }

      else if (key === 'notes') {
        const links = Array.isArray(item.links) ? item.links : [];
        li.className = 'group/item flex flex-col gap-3 p-4 bg-slate-50 dark:bg-panelAlt rounded-xl border border-slate-200 dark:border-hairline hover:border-noteA/50 transition-colors';
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="open-target openable font-display font-semibold text-base text-slate-900 dark:text-white leading-snug break-words clamp-2" title="Click to open">${esc(item.text)}</h3>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete note">${trashIcon}</button>
            </div>
          </div>
          ${item.body ? `<p class="open-target openable clamp-3 text-sm text-slate-600 dark:text-ink/80 leading-relaxed whitespace-pre-wrap break-words" title="Click to open">${esc(item.body)}</p>` : ''}
          ${links.length ? `<div class="flex flex-col gap-2 pt-3 border-t border-slate-200 dark:border-hairline">${links.map(renderNoteLink).join('')}</div>` : ''}`;
      }

      else if (key === 'yt' && item.videoId) {
        li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="open-target openable clamp-2 font-medium text-sm text-slate-800 dark:text-ink leading-snug break-words" title="Click to open">${esc(item.text)}</h3>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete video">${trashIcon}</button>
            </div>
          </div>
          <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-lg bg-black">
            <iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${esc(item.videoId)}" frameborder="0" allowfullscreen loading="lazy"></iframe>
          </div>`;
      }

      else if (key === 'links' && item.url) {
        const favicon = faviconFor(item.url);
        li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';
        li.innerHTML = `
          <div class="flex items-center justify-between w-full gap-3">
            <a href="${esc(item.url)}" target="_blank" rel="noopener" class="flex items-center gap-2.5 min-w-0 text-sm font-medium text-slate-700 dark:text-ink hover:text-linkA transition-colors">
              ${favicon ? `<img src="${esc(favicon)}" class="w-4 h-4 rounded-sm shrink-0" onerror="this.style.visibility='hidden'" alt="">` : ''}
              <span class="truncate">${esc(item.text)}</span>
            </a>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete link">${trashIcon}</button>
            </div>
          </div>`;
      }

      else {
        li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';
        li.innerHTML = `
          <div class="flex items-start justify-between w-full gap-3">
            <span class="flex items-start gap-2.5 min-w-0">
              <span class="w-1.5 h-1.5 mt-1.5 rounded-full bg-planA shrink-0"></span>
              <span class="open-target openable clamp-2 text-sm text-slate-700 dark:text-ink break-words" title="Click to open">${esc(item.text)}</span>
            </span>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete item">${trashIcon}</button>
            </div>
          </div>`;
      }

      li.querySelectorAll('.open-target').forEach(el => el.addEventListener('click', open));
      const editBtn = li.querySelector('.edit-btn');
      if (editBtn) editBtn.addEventListener('click', open);
      li.querySelector('.delete-btn').addEventListener('click', () => deleteDoc(doc(db, collectionName, item.id)));

      return li;
    }

    function visibleItems(key) {
      let items = state[key];

      if (searchTerm) items = items.filter(i => searchableText(key, i).includes(searchTerm));

      if (key === 'tasks') {
        items = items.filter(t => {
          if (taskFilter === 'all') return true;
          if (taskFilter === 'open') return !t.done;
          if (taskFilter === 'done') return !!t.done;
          return priorityOf(t) === taskFilter && !t.done;
        });
        // Open before done, then high to low. Array#sort is stable, so newest-first holds within ties.
        items = items.slice().sort((a, b) => {
          if (!!a.done !== !!b.done) return a.done ? 1 : -1;
          return PRIORITIES[priorityOf(a)].rank - PRIORITIES[priorityOf(b)].rank;
        });
      }

      return items;
    }

    function renderList(key) {
      const listEl = config[key].el;
      const items = visibleItems(key);
      listEl.innerHTML = '';

      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'col-span-full text-sm text-slate-400 dark:text-inkMuted italic py-2';
        li.textContent = searchTerm ? 'Nothing matches that search.' : emptyMessages[key];
        listEl.appendChild(li);
        return;
      }

      const frag = document.createDocumentFragment();
      items.forEach(item => frag.appendChild(buildItem(key, item)));
      listEl.appendChild(frag);
    }

    function updateStats() {
      const open = state.tasks.filter(t => !t.done).length;
      const done = state.tasks.length - open;
      const high = state.tasks.filter(t => !t.done && priorityOf(t) === 'high').length;
      const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);

      document.getElementById('statOpen').textContent = open;
      document.getElementById('statHigh').textContent = high;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statTotal').textContent = total + (total === 1 ? ' item tracked' : ' items tracked');
      document.getElementById('taskCount').textContent = open;

      if (searchTerm) {
        const matches = Object.keys(state).reduce((n, k) => n + visibleItems(k).length, 0);
        searchNotice.textContent = `${matches} ${matches === 1 ? 'match' : 'matches'}`;
        searchNotice.classList.remove('hidden');
        searchNotice.classList.add('flex');
      } else {
        searchNotice.classList.add('hidden');
        searchNotice.classList.remove('flex');
      }
    }

    function listen(key) {
      const { collection: name, countId } = config[key];
      const q = query(collection(db, name), orderBy('createdAt', 'desc'));

      onSnapshot(q, (snapshot) => {
        state[key] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (key !== 'tasks') document.getElementById(countId).textContent = snapshot.size;
        renderList(key);
        updateStats();
      });
    }

    // --- ADDING ---
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      const dataToSave = { createdAt: serverTimestamp() };

      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('That does not look like a YouTube link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled video';
        dataToSave.videoId = vidId;
        titleInput.value = '';
      }
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        const url = normalizeUrl(mainInputValue);
        dataToSave.text = titleInput.value.trim() || hostOf(url);
        dataToSave.url = url;
        titleInput.value = '';
      }
      else if (type === 'task') {
        dataToSave.text = mainInputValue;
        dataToSave.priority = newTaskPriority;
        dataToSave.done = false;
        // Keep the new task visible if the current filter would hide it
        if (taskFilter === 'done' || (PRIORITIES[taskFilter] && taskFilter !== newTaskPriority)) {
          taskFilter = 'open';
          localStorage.setItem('taskFilter', taskFilter);
          renderFilters();
        }
      }
      else {
        dataToSave.text = mainInputValue;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    // --- NOTE COMPOSER ---
    let pendingNoteLinks = [];
    const noteLinkChips = document.getElementById('noteLinkChips');

    function renderNoteChips() {
      noteLinkChips.innerHTML = '';
      const has = pendingNoteLinks.length > 0;
      noteLinkChips.classList.toggle('hidden', !has);
      noteLinkChips.classList.toggle('flex', has);
      if (!has) return;

      pendingNoteLinks.forEach((link, index) => {
        const chip = document.createElement('span');
        chip.className = 'flex items-center gap-2 pl-2 pr-1.5 py-1 text-xs bg-noteA/10 text-slate-700 dark:text-ink border border-noteA/30 rounded-full';
        chip.innerHTML = `
          <span class="truncate max-w-[150px]">${esc(link.label || hostOf(link.url))}</span>
          <button type="button" class="text-inkMuted hover:text-rose-500 transition-colors leading-none px-1" aria-label="Remove link">&times;</button>`;
        chip.querySelector('button').addEventListener('click', () => {
          pendingNoteLinks.splice(index, 1);
          renderNoteChips();
        });
        noteLinkChips.appendChild(chip);
      });
    }

    function stageNoteLink() {
      const urlInput = document.getElementById('noteLinkInput');
      const labelInput = document.getElementById('noteLinkLabelInput');
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      pendingNoteLinks.push({ url, label: labelInput.value.trim() });
      urlInput.value = '';
      labelInput.value = '';
      renderNoteChips();
    }

    async function addNote() {
      const titleInput = document.getElementById('noteTitleInput');
      const bodyInput = document.getElementById('noteBodyInput');

      if (document.getElementById('noteLinkInput').value.trim()) stageNoteLink();

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title && !body && !pendingNoteLinks.length) return;

      await addDoc(collection(db, 'notes'), {
        text: title || 'Untitled note',
        body,
        links: pendingNoteLinks,
        createdAt: serverTimestamp()
      });

      titleInput.value = '';
      bodyInput.value = '';
      pendingNoteLinks = [];
      renderNoteChips();
      titleInput.focus();
    }

    // --- WIRING ---
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'task'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));
    document.getElementById('addNoteLinkBtn').addEventListener('click', stageNoteLink);
    document.getElementById('addNoteBtn').addEventListener('click', addNote);

    const enterMap = { linkUrlInput: 'addLinkBtn', linkTitleInput: 'addLinkBtn', taskInput: 'addTaskBtn', planInput: 'addPlanBtn', ytInput: 'addYtBtn' };
    Object.entries(enterMap).forEach(([inputId, btnId]) => {
      document.getElementById(inputId).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); }
      });
    });

    ['noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); stageNoteLink(); }
      });
    });

    ['noteTitleInput', 'noteBodyInput', 'noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !editing) { e.preventDefault(); addNote(); }
      });
    });

    document.getElementById('noteTitleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('noteBodyInput').focus(); }
    });

    // Change the priority of the next task with Alt + ArrowUp / ArrowDown
    document.getElementById('taskInput').addEventListener('keydown', (e) => {
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const i = PRIORITY_ORDER.indexOf(newTaskPriority);
      const next = e.key === 'ArrowUp' ? Math.max(0, i - 1) : Math.min(PRIORITY_ORDER.length - 1, i + 1);
      newTaskPriority = PRIORITY_ORDER[next];
      localStorage.setItem('newTaskPriority', newTaskPriority);
      renderPrioritySelect();
    });

    // --- START ---
    Object.keys(config).forEach(listen);
  </script>
</body>
</html>
