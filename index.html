<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Umar's Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            graphite: '#0B0D12',
            panel: '#141720',
            panelAlt: '#1A1E29',
            panelHi: '#202431',
            hairline: '#2A2F40',
            ink: '#F3F4F6',
            inkMuted: '#9CA3AF',
            linkA: '#00C4CC',
            taskA: '#FF6161',
            planA: '#00D084',
            ytA: '#FF0033',
            noteA: '#8B3DFF',
            urgent: '#FF3366',
            steady: '#00E6E6',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
          boxShadow: {
            'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
            'glow': '0 0 20px rgba(139, 61, 255, 0.15)',
          },
          animation: {
            'pop': 'popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'float': 'floating 3s ease-in-out infinite',
          },
          keyframes: {
            popIn: {
              '0%': { opacity: '0', transform: 'translateY(15px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            floating: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            }
          }
        },
      },
    };
  </script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      transition: background-color .4s ease, color .4s ease;
      background-image: radial-gradient(circle at top left, rgba(139, 61, 255, 0.03), transparent 40%),
                        radial-gradient(circle at bottom right, rgba(0, 196, 204, 0.03), transparent 40%);
    }
    body.dark {
      background-image: radial-gradient(circle at top left, rgba(139, 61, 255, 0.08), transparent 40%),
                        radial-gradient(circle at bottom right, rgba(0, 196, 204, 0.08), transparent 40%);
    }
    body.modal-open { overflow: hidden; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #374151; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

    /* Modern Glassmorphic Panels */
    .panel {
      backdrop-filter: blur(12px);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
    }
    .panel:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1);
    }
    .dark .panel:hover {
      box-shadow: 0 15px 35px -10px rgba(0,0,0,0.4);
    }

    .panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .4s cubic-bezier(0.4, 0, 0.2, 1), opacity .3s ease;
      opacity: 1;
    }
    .panel-body > div { overflow: hidden; min-height: 0; }
    .panel.collapsed .panel-body { grid-template-rows: 0fr; opacity: 0; }

    /* Dynamic scrolling - grows to fit, scrolls when too long */
    .scroll-area { 
      overflow-y: auto; 
      overscroll-behavior: contain; 
      padding-right: 4px;
    }
    
    .clamp-2, .clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-2 { -webkit-line-clamp: 2; }
    .clamp-3 { -webkit-line-clamp: 3; }

    .openable { cursor: pointer; transition: color 0.2s ease; }
    .openable:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

    /* Staggered entrance animation delays */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .opacity-0-init { opacity: 0; }

    @keyframes modalIn { 
      from { opacity: 0; transform: translateY(20px) scale(.95); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }
    .modal-card { animation: modalIn .3s cubic-bezier(0.16, 1, 0.3, 1) both; }

    :focus-visible { outline: 2px solid #8B3DFF; outline-offset: 2px; border-radius: 6px; }
    textarea { resize: vertical; }
    .seg { border: 1px solid transparent; }
    .done-text { text-decoration: line-through; opacity: 0.6;}
    .group\/item { transition: all 0.2s ease; }
    .group\/item:hover { transform: scale(1.01); }
  </style>
</head>
<body class="bg-[#F9FAFB] dark:bg-graphite text-slate-800 dark:text-ink min-h-screen">

  <!-- Command bar - Fully responsive for mobile -->
  <header class="sticky top-2 md:top-4 z-30 mx-3 md:mx-8 mb-6 md:mb-8">
    <div class="max-w-[1500px] mx-auto bg-white/70 dark:bg-panel/70 backdrop-blur-xl border border-white/50 dark:border-hairline rounded-2xl md:rounded-3xl shadow-soft dark:shadow-glass p-3 md:p-4 flex flex-col md:flex-row items-center gap-3 md:gap-4 transition-colors duration-300">

      <div class="flex items-center gap-3 w-full md:w-auto mr-auto">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-noteA to-linkA border border-white/20 flex items-center justify-center font-display font-bold text-sm text-white shrink-0 shadow-glow animate-float">
          UD
        </div>
        <div class="min-w-0">
          <h1 id="greeting" class="font-display text-lg md:text-xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-300 leading-tight truncate">Umar's Dashboard</h1>
          <p id="clockLine" class="text-[10px] md:text-xs font-mono text-inkMuted truncate font-medium"></p>
        </div>
      </div>

      <div class="w-full md:flex-1 md:max-w-md relative group">
        <div class="absolute inset-0 bg-gradient-to-r from-noteA to-linkA rounded-xl opacity-0 group-hover:opacity-20 transition-opacity duration-300 blur"></div>
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-inkMuted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"></path></svg>
          <input type="search" id="searchInput" placeholder="Search everything..." aria-label="Search all panels"
            class="w-full pl-10 pr-12 md:pr-16 py-2.5 text-sm font-medium bg-white/90 dark:bg-panelAlt/90 border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-transparent transition-all shadow-inner">
          <kbd class="hidden sm:flex items-center justify-center absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-mono font-bold text-inkMuted bg-slate-100 dark:bg-panelHi border border-slate-200 dark:border-hairline rounded-[4px] px-1.5 py-0.5">/</kbd>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <button id="collapseAllBtn" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold rounded-xl bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline text-slate-600 dark:text-ink hover:bg-slate-100 dark:hover:bg-panelHi hover:border-slate-300 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          <span id="collapseAllLabel">Collapse all</span>
        </button>
        <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline hover:bg-slate-100 dark:hover:bg-panelHi hover:border-slate-300 transition-all shadow-sm shrink-0" title="Toggle theme" aria-label="Toggle color theme">
          <span id="themeIcon" class="block transform transition-transform hover:rotate-12 text-lg">🌓</span>
        </button>
      </div>
    </div>
    
    <!-- Live counters -->
    <div class="max-w-[1460px] mx-auto px-2 mt-3 flex flex-wrap items-center gap-x-3 gap-y-2 text-[10px] md:text-xs font-mono font-medium text-slate-500 dark:text-inkMuted opacity-0-init animate-pop stagger-1">
      <span class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-white dark:bg-panel border border-slate-200 dark:border-hairline shadow-sm"><span class="w-2 h-2 rounded-full bg-taskA shadow-[0_0_8px_rgba(255,97,97,0.6)]"></span><span id="statOpen" class="text-slate-800 dark:text-white">0</span> open</span>
      <span class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-white dark:bg-panel border border-slate-200 dark:border-hairline shadow-sm"><span class="w-2 h-2 rounded-full bg-urgent shadow-[0_0_8px_rgba(255,51,102,0.6)]"></span><span id="statHigh" class="text-slate-800 dark:text-white">0</span> high</span>
      <span class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-white dark:bg-panel border border-slate-200 dark:border-hairline shadow-sm"><span class="w-2 h-2 rounded-full bg-planA shadow-[0_0_8px_rgba(0,208,132,0.6)]"></span><span id="statDone" class="text-slate-800 dark:text-white">0</span> done</span>
      <span id="statTotal" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-panelAlt border border-slate-200 dark:border-hairline shadow-sm">0 items</span>
      <span id="searchNotice" class="hidden items-center gap-1.5 text-linkA font-semibold px-2.5 py-1 bg-linkA/10 rounded-full border border-linkA/30"></span>
    </div>
  </header>

  <!-- IMPORTANT: items-start added here so panels don't stretch vertically creating dead space -->
  <main class="max-w-[1500px] mx-auto px-3 md:px-8 pb-12">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-12 gap-5 md:gap-6 items-start">

      <!-- What To Do Next -->
      <section class="panel md:col-span-2 xl:col-span-5 bg-white/80 dark:bg-panel/80 border border-slate-200/80 dark:border-hairline rounded-[24px] shadow-soft overflow-hidden opacity-0-init animate-pop stagger-2" data-panel="tasks">
        <div class="h-1.5 bg-gradient-to-r from-taskA via-urgent to-taskA opacity-90"></div>
        <!-- FIX: Using block button + inner flex div so headers don't disappear in Android webview -->
        <button type="button" class="collapse-toggle w-full block text-left group focus:outline-none" aria-expanded="true">
          <div class="flex items-center justify-between gap-3 px-4 md:px-6 py-4 md:py-5">
            <span class="flex items-center gap-3 min-w-0">
              <div class="p-2 bg-taskA/10 rounded-xl group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-taskA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
              </div>
              <span class="font-display font-bold text-lg md:text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 truncate">What To Do Next</span>
            </span>
            <span class="flex items-center gap-3 shrink-0">
              <span id="taskCount" class="text-xs font-mono font-bold text-taskA bg-taskA/10 border border-taskA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
              <div class="p-1.5 rounded-full bg-slate-100 dark:bg-panelAlt group-hover:bg-slate-200 dark:group-hover:bg-panelHi transition-colors">
                <svg class="chevron w-4 h-4 text-slate-500 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </span>
          </div>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-4 md:px-6 pb-4 md:pb-6">
              <div class="flex gap-2.5 relative group">
                <input type="text" id="taskInput" placeholder="What needs doing?" class="flex-1 min-w-0 px-3 md:px-4 py-2.5 md:py-3 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-taskA/50 focus:border-taskA transition-all shadow-inner">
                <button id="addTaskBtn" class="bg-gradient-to-br from-taskA to-urgent text-white w-12 shrink-0 rounded-xl hover:shadow-lg hover:shadow-taskA/30 active:scale-95 transition-all font-bold text-lg flex items-center justify-center" aria-label="Add task">+</button>
              </div>

              <div class="flex items-center justify-between mt-4">
                <div class="flex items-center gap-2">
                  <span class="text-[9px] md:text-[10px] uppercase tracking-wider font-bold text-inkMuted shrink-0">Priority</span>
                  <div id="prioritySelect" class="flex gap-1.5 flex-wrap" role="group" aria-label="Priority for new task"></div>
                </div>
              </div>

              <div class="flex items-center gap-2 mt-4 overflow-x-auto pb-2 -mx-1 px-1 scrollbar-hide" id="taskFilters" role="group" aria-label="Filter tasks"></div>

              <!-- Content grows up to 55vh, then scrolls natively -->
              <ul id="taskList" class="scroll-area max-h-[55vh] lg:max-h-[500px] space-y-3 mt-2"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Notes -->
      <section class="panel md:col-span-2 xl:col-span-7 bg-white/80 dark:bg-panel/80 border border-slate-200/80 dark:border-hairline rounded-[24px] shadow-soft overflow-hidden opacity-0-init animate-pop stagger-3" data-panel="notes">
        <div class="h-1.5 bg-gradient-to-r from-noteA to-blue-500 opacity-90"></div>
        <button type="button" class="collapse-toggle w-full block text-left group focus:outline-none" aria-expanded="true">
          <div class="flex items-center justify-between gap-3 px-4 md:px-6 py-4 md:py-5">
            <span class="flex items-center gap-3 min-w-0">
              <div class="p-2 bg-noteA/10 rounded-xl group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-noteA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
              </div>
              <span class="font-display font-bold text-lg md:text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 truncate">Notes</span>
            </span>
            <span class="flex items-center gap-3 shrink-0">
              <span id="noteCount" class="text-xs font-mono font-bold text-noteA bg-noteA/10 border border-noteA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
              <div class="p-1.5 rounded-full bg-slate-100 dark:bg-panelAlt group-hover:bg-slate-200 dark:group-hover:bg-panelHi transition-colors">
                <svg class="chevron w-4 h-4 text-slate-500 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </span>
          </div>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-4 md:px-6 pb-4 md:pb-6 grid grid-cols-1 lg:grid-cols-[minmax(0,340px)_minmax(0,1fr)] gap-6">

              <div class="flex flex-col gap-3 lg:border-r lg:border-slate-200 lg:dark:border-hairline lg:pr-6">
                <input type="text" id="noteTitleInput" placeholder="Note title" class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm font-semibold bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA transition-colors shadow-inner">
                <textarea id="noteBodyInput" rows="4" placeholder="Write the note here..." class="w-full px-3 md:px-4 py-2.5 md:py-3 text-sm leading-relaxed bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA transition-colors shadow-inner"></textarea>

                <div class="flex flex-col sm:flex-row gap-2 mt-1">
                  <input type="text" id="noteLinkLabelInput" placeholder="Link name" class="w-full sm:w-[38%] min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA transition-colors shadow-inner">
                  <div class="flex gap-2 w-full sm:flex-1">
                    <input type="text" id="noteLinkInput" placeholder="Paste a link" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-noteA/50 focus:border-noteA transition-colors shadow-inner">
                    <button id="addNoteLinkBtn" class="bg-slate-100 dark:bg-panelAlt text-slate-600 dark:text-ink border border-slate-200 dark:border-hairline w-11 shrink-0 rounded-lg hover:border-noteA hover:text-noteA hover:bg-noteA/5 active:scale-95 transition-all font-bold" aria-label="Attach link">+</button>
                  </div>
                </div>

                <div id="noteLinkChips" class="hidden flex-wrap gap-2 mt-1"></div>

                <button id="addNoteBtn" class="mt-2 w-full bg-gradient-to-r from-noteA to-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:shadow-lg hover:shadow-noteA/30 active:scale-[.98] transition-all">Save Note</button>
                <p class="text-[10px] font-mono text-center text-inkMuted mt-1">Ctrl + Enter saves · YT links embed directly</p>
              </div>

              <!-- Content grows up to 55vh, then scrolls natively -->
              <ul id="noteList" class="scroll-area max-h-[55vh] lg:max-h-[500px] grid grid-cols-1 xl:grid-cols-2 gap-4 content-start"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- Quick Links -->
      <section class="panel xl:col-span-4 bg-white/80 dark:bg-panel/80 border border-slate-200/80 dark:border-hairline rounded-[24px] shadow-soft overflow-hidden opacity-0-init animate-pop stagger-4" data-panel="links">
        <div class="h-1.5 bg-gradient-to-r from-linkA to-sky-400 opacity-90"></div>
        <button type="button" class="collapse-toggle w-full block text-left group focus:outline-none" aria-expanded="true">
          <div class="flex items-center justify-between gap-3 px-4 md:px-6 py-4 md:py-5">
            <span class="flex items-center gap-3 min-w-0">
              <div class="p-2 bg-linkA/10 rounded-xl group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-linkA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
              </div>
              <span class="font-display font-bold text-lg md:text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 truncate">Quick Links</span>
            </span>
            <span class="flex items-center gap-3 shrink-0">
              <span id="linkCount" class="text-xs font-mono font-bold text-linkA bg-linkA/10 border border-linkA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
              <div class="p-1.5 rounded-full bg-slate-100 dark:bg-panelAlt group-hover:bg-slate-200 dark:group-hover:bg-panelHi transition-colors">
                <svg class="chevron w-4 h-4 text-slate-500 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </span>
          </div>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-4 md:px-6 pb-4 md:pb-6">
              <div class="flex flex-col gap-3 mb-5 p-3 md:p-4 bg-slate-50 dark:bg-panelAlt/50 rounded-2xl border border-slate-100 dark:border-hairline">
                <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-3 md:px-4 py-2.5 text-sm bg-white dark:bg-panelHi border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA transition-colors shadow-sm">
                <div class="flex gap-2">
                  <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 min-w-0 px-3 md:px-4 py-2.5 text-sm bg-white dark:bg-panelHi border border-slate-200 dark:border-hairline rounded-lg placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/50 focus:border-linkA transition-colors shadow-sm">
                  <button id="addLinkBtn" class="bg-gradient-to-br from-linkA to-sky-500 text-white w-12 shrink-0 rounded-lg hover:shadow-lg hover:shadow-linkA/30 active:scale-95 transition-all font-bold flex items-center justify-center" aria-label="Save link">+</button>
                </div>
              </div>

  <script type="module">
    // --- THEME ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const dark = html.classList.contains('dark');
      localStorage.theme = dark ? 'dark' : 'light';
      themeIcon.textContent = dark ? '☀️' : '🌙';
    });

    // --- CLOCK + GREETING ---
    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      const part = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : hour < 22 ? 'Good evening' : 'Winding down';
      document.getElementById('greeting').textContent = `${part}, Umar`;
      document.getElementById('clockLine').textContent =
        now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }) +
        '   ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- COLLAPSE / EXPAND ---
    const panels = [...document.querySelectorAll('.panel')];
    const panelApi = new Map();

    panels.forEach((panel) => {
      const key = 'panelCollapsed:' + panel.dataset.panel;
      const toggleBtn = panel.querySelector('.collapse-toggle');
      const chevron = panel.querySelector('.chevron');

      const setCollapsed = (collapsed, persist = true) => {
        panel.classList.toggle('collapsed', collapsed);
        if(chevron) chevron.classList.toggle('-rotate-90', collapsed);
        if(toggleBtn) toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        if (persist) localStorage.setItem(key, String(collapsed));
      };

      panelApi.set(panel, setCollapsed);
      if (localStorage.getItem(key) === 'true') setCollapsed(true, false);

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          setCollapsed(!panel.classList.contains('collapsed'));
          syncCollapseAllLabel();
        });
      }
    });

    const collapseAllBtn = document.getElementById('collapseAllBtn');
    const collapseAllLabel = document.getElementById('collapseAllLabel');
    function syncCollapseAllLabel() {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      collapseAllLabel.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
    }
    syncCollapseAllLabel();
    collapseAllBtn.addEventListener('click', () => {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      panels.forEach(p => panelApi.get(p)(!allCollapsed));
      syncCollapseAllLabel();

    // --- FIREBASE ---

    const firebaseConfig = {

      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- HELPERS ---
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const normalizeUrl = (url) => {
      const t = url.trim();
      if (!t) return '';
      return /^https?:\/\//i.test(t) ? t : 'https://' + t;
    };

    const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };

    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    const faviconFor = (url) => {
      try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`; }
      catch { return ''; }
    };

    const trashIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;

    const iconBtn = 'text-inkMuted hover:text-slate-900 dark:hover:text-white transition-colors shrink-0 p-2 md:p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-panelHi opacity-100 md:opacity-0 group-hover/item:opacity-100 focus:opacity-100';

    const PRIORITY_ORDER = ['high', 'medium', 'low'];
    const priorityOf = (t) => PRIORITIES[t.priority] ? t.priority : 'medium';

    if (!PRIORITIES[newTaskPriority]) newTaskPriority = 'medium';

    const prioritySelect = document.getElementById('prioritySelect');

      prioritySelect.innerHTML = '';

        const conf = PRIORITIES[p];
        const active = p === newTaskPriority;

        btn.type = 'button';

          newTaskPriority = p;
          localStorage.setItem('newTaskPriority', p);
          renderPrioritySelect();
        });
        prioritySelect.appendChild(btn);
      });
    }
    renderPrioritySelect();

    // --- FILTERS + SEARCH ---
    let taskFilter = localStorage.getItem('taskFilter') || 'open';
    let searchTerm = '';

    const FILTERS = [
      { id: 'open', label: 'Open' },
      { id: 'high', label: 'High' },
      { id: 'medium', label: 'Medium' },
      { id: 'low', label: 'Low' },
      { id: 'done', label: 'Done' },
      { id: 'all', label: 'All' },

    const taskFilters = document.getElementById('taskFilters');

      taskFilters.innerHTML = '';

      const tag = document.activeElement && document.activeElement.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing && !editing) { e.preventDefault(); searchInput.focus(); }

    const config = {

          </div>

        editDone = !!item.done;

             <span class="text-sm font-medium text-slate-700 dark:text-ink">Mark as done</span>
           </label>`;

      else if (key === 'plans') {

    function renderEditPriority() {
      const box = document.getElementById('edPriority');
      if (!box) return;
      box.innerHTML = '';
      PRIORITY_ORDER.forEach(p => {
        const conf = PRIORITIES[p];
        const active = p === editPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex flex-1 sm:flex-none items-center justify-center sm:justify-start gap-2 px-4 py-2.5 sm:py-2 rounded-xl text-xs uppercase tracking-wide transition-all ' +
          (active ? conf.on + ' font-bold' : 'bg-slate-100 dark:bg-panelAlt text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:bg-slate-200 dark:hover:bg-panelHi font-medium');
        btn.innerHTML = `<span class="w-2 h-2 rounded-full ${active ? 'bg-white' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => { editPriority = p; renderEditPriority(); });
        box.appendChild(btn);
      });
    }

    function openEditor(key, item) {
      editing = { key, id: item.id };
      editorTitleEl.textContent = config[key].title;
      editorAccent.className = 'h-1.5 bg-gradient-to-r ' + config[key].accent;
      buildEditorFields(key, item);

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.body.classList.add('modal-open');

      const first = document.getElementById('edText');
      if (first) {
        first.focus();
        if (first.setSelectionRange) {
          const end = first.value.length;
          first.setSelectionRange(end, end);
        }
      }
    }

    function closeEditor() {
      editing = null;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.body.classList.remove('modal-open');
      editorFields.innerHTML = '';
    }

    async function saveEditor() {
      if (!editing) return;
      const { key, id } = editing;
      const ref = doc(db, config[key].collection, id);
      const textEl = document.getElementById('edText');
      const text = textEl ? textEl.value.trim() : '';

      let patch = null;

      if (key === 'tasks' || key === 'plans') {
        if (!text) { alert('Text cannot be empty.'); return; }
        patch = key === 'tasks'
          ? { text, priority: editPriority, done: document.getElementById('edDone').checked }
          : { text };
      }
      else if (key === 'links') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (!url) { alert('A URL is required.'); return; }
        patch = { text: text || hostOf(url), url };
      }
      else if (key === 'yt') {
        const vidId = getYTVideoId(document.getElementById('edUrl').value.trim());
        if (!vidId) { alert('That does not look like a YouTube link.'); return; }
        patch = { text: text || 'Untitled video', videoId: vidId };
      }
      else if (key === 'notes') {
        const body = document.getElementById('edBody').value.trim();
        const links = [...document.querySelectorAll('#edLinks .ed-link-row')]
          .map(row => ({
            label: row.querySelector('.ed-link-label').value.trim(),
            url: normalizeUrl(row.querySelector('.ed-link-url').value)
          }))
          .filter(l => l.url);
        if (!text && !body && !links.length) { alert('The note is empty.'); return; }
        patch = { text: text || 'Untitled note', body, links };
      }

      try {
        await updateDoc(ref, patch);
        closeEditor();
      } catch (err) {
        console.error(err);
        alert('Could not save — the item may have been deleted.');
      }
    }

    async function deleteFromEditor() {
      if (!editing) return;
      const { key, id } = editing;
      if (!confirm('Delete this permanently?')) return;
      try { await deleteDoc(doc(db, config[key].collection, id)); } catch (err) { console.error(err); }
      closeEditor();
    }

    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorCancel').addEventListener('click', closeEditor);
    document.getElementById('editorBackdrop').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    document.getElementById('editorDelete').addEventListener('click', deleteFromEditor);

    document.addEventListener('keydown', (e) => {
      if (!editing) return;
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); }
    });

    // --- RENDERERS ---

    function visibleItems(key) {
      let items = state[key];

      if (searchTerm) items = items.filter(i => searchableText(key, i).includes(searchTerm));

      if (key === 'tasks') {
        items = items.filter(t => {
          if (taskFilter === 'all') return true;
          if (taskFilter === 'open') return !t.done;
          if (taskFilter === 'done') return !!t.done;
          return priorityOf(t) === taskFilter && !t.done;
        });
        items = items.slice().sort((a, b) => {
          if (!!a.done !== !!b.done) return a.done ? 1 : -1;
          return PRIORITIES[priorityOf(a)].rank - PRIORITIES[priorityOf(b)].rank;
        });
      }

      return items;
    }

    function renderList(key) {
      const listEl = config[key].el;
      const items = visibleItems(key);
      listEl.innerHTML = '';

      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'col-span-full text-sm font-medium text-slate-400 dark:text-inkMuted italic py-6 text-center bg-slate-50/50 dark:bg-panelAlt/30 rounded-xl border border-dashed border-slate-200 dark:border-hairline';
        li.textContent = searchTerm ? 'Nothing matches that search.' : emptyMessages[key];
        listEl.appendChild(li);
        return;
      }

      const frag = document.createDocumentFragment();
      items.forEach(item => frag.appendChild(buildItem(key, item)));
      listEl.appendChild(frag);
    }

    function updateStats() {
      const open = state.tasks.filter(t => !t.done).length;
      const done = state.tasks.length - open;
      const high = state.tasks.filter(t => !t.done && priorityOf(t) === 'high').length;
      const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);

      document.getElementById('statOpen').textContent = open;
      document.getElementById('statHigh').textContent = high;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statTotal').textContent = total + (total === 1 ? ' item' : ' items');
      document.getElementById('taskCount').textContent = open;

      if (searchTerm) {
        const matches = Object.keys(state).reduce((n, k) => n + visibleItems(k).length, 0);
        searchNotice.textContent = `${matches} ${matches === 1 ? 'match' : 'matches'}`;
        searchNotice.classList.remove('hidden');
        searchNotice.classList.add('flex');
      } else {
        searchNotice.classList.add('hidden');
        searchNotice.classList.remove('flex');
      }
    }

    function listen(key) {
      const { collection: name, countId } = config[key];
      const q = query(collection(db, name), orderBy('createdAt', 'desc'));

      onSnapshot(q, (snapshot) => {
        state[key] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (key !== 'tasks') document.getElementById(countId).textContent = snapshot.size;
        renderList(key);
        updateStats();
      });
    }

    // --- ADDING ---
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      const dataToSave = { createdAt: serverTimestamp() };

      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('That does not look like a YouTube link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled video';
        dataToSave.videoId = vidId;
        titleInput.value = '';
      }
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        const url = normalizeUrl(mainInputValue);
        dataToSave.text = titleInput.value.trim() || hostOf(url);
        dataToSave.url = url;
        titleInput.value = '';
      }
      else if (type === 'task') {
        dataToSave.text = mainInputValue;
        dataToSave.priority = newTaskPriority;
        dataToSave.done = false;
        if (taskFilter === 'done' || (PRIORITIES[taskFilter] && taskFilter !== newTaskPriority)) {
          taskFilter = 'open';
          localStorage.setItem('taskFilter', taskFilter);
          renderFilters();
        }
      }
      else {
        dataToSave.text = mainInputValue;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    // --- NOTE COMPOSER ---
    let pendingNoteLinks = [];
    const noteLinkChips = document.getElementById('noteLinkChips');

    function renderNoteChips() {
      noteLinkChips.innerHTML = '';
      const has = pendingNoteLinks.length > 0;
      noteLinkChips.classList.toggle('hidden', !has);
      noteLinkChips.classList.toggle('flex', has);
      if (!has) return;

      pendingNoteLinks.forEach((link, index) => {
        const chip = document.createElement('span');
        chip.className = 'flex items-center gap-2 pl-3 pr-2 py-1.5 text-xs font-medium bg-noteA/10 text-slate-800 dark:text-ink border border-noteA/30 rounded-lg';
        chip.innerHTML = `
          <span class="truncate max-w-[150px]">${esc(link.label || hostOf(link.url))}</span>
          <button type="button" class="text-inkMuted hover:text-rose-500 bg-white dark:bg-panelAlt rounded-md transition-colors leading-none p-1 shadow-sm" aria-label="Remove link"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;
        chip.querySelector('button').addEventListener('click', () => {
          pendingNoteLinks.splice(index, 1);
          renderNoteChips();
        });
        noteLinkChips.appendChild(chip);
      });
    }

    function stageNoteLink() {
      const urlInput = document.getElementById('noteLinkInput');
      const labelInput = document.getElementById('noteLinkLabelInput');
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      pendingNoteLinks.push({ url, label: labelInput.value.trim() });
      urlInput.value = '';
      labelInput.value = '';
      renderNoteChips();
    }

    async function addNote() {
      const titleInput = document.getElementById('noteTitleInput');
      const bodyInput = document.getElementById('noteBodyInput');

      if (document.getElementById('noteLinkInput').value.trim()) stageNoteLink();

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title && !body && !pendingNoteLinks.length) return;

      await addDoc(collection(db, 'notes'), {
        text: title || 'Untitled note',
        body,
        links: pendingNoteLinks,
        createdAt: serverTimestamp()
      });

      titleInput.value = '';
      bodyInput.value = '';
      pendingNoteLinks = [];
      renderNoteChips();
      titleInput.focus();
    }

    // --- WIRING ---
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'task'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));
    document.getElementById('addNoteLinkBtn').addEventListener('click', stageNoteLink);
    document.getElementById('addNoteBtn').addEventListener('click', addNote);

    const enterMap = { linkUrlInput: 'addLinkBtn', linkTitleInput: 'addLinkBtn', taskInput: 'addTaskBtn', planInput: 'addPlanBtn', ytInput: 'addYtBtn' };
    Object.entries(enterMap).forEach(([inputId, btnId]) => {
      document.getElementById(inputId).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); }
      });
    });

    ['noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); stageNoteLink(); }
      });
    });

    ['noteTitleInput', 'noteBodyInput', 'noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !editing) { e.preventDefault(); addNote(); }
      });
    });

    document.getElementById('noteTitleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('noteBodyInput').focus(); }
    });

    document.getElementById('taskInput').addEventListener('keydown', (e) => {
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const i = PRIORITY_ORDER.indexOf(newTaskPriority);
      const next = e.key === 'ArrowUp' ? Math.max(0, i - 1) : Math.min(PRIORITY_ORDER.length - 1, i + 1);
      newTaskPriority = PRIORITY_ORDER[next];
      localStorage.setItem('newTaskPriority', newTaskPriority);
      renderPrioritySelect();
    });

    // --- START ---
    Object.keys(config).forEach(listen);
  </script>
</body>
</html>
