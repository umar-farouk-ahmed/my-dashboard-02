<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0B0E14">
  <title>Umar's Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            graphite: '#0B0E14',
            panel: '#121621',
            panelAlt: '#181D2B',
            panelHi: '#1F2637',
            hairline: '#252D40',
            ink: '#F1F5F9',
            inkMuted: '#94A3B8',
            linkA: '#60A5FA',
            taskA: '#F59E0B',
            planA: '#10B981',
            ytA: '#F43F5E',
            fbA: '#3B82F6',
            noteA: '#A78BFA',
            urgent: '#EF4444',
            steady: '#38BDF8',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color .25s ease, color .25s ease;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #262E42; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #37415C; }

    /* Smooth accordion collapse */
    .panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .3s cubic-bezier(0.4, 0, 0.2, 1), opacity .25s ease;
      opacity: 1;
    }
    .panel-body > div { overflow: hidden; min-height: 0; }
    .panel.collapsed .panel-body { grid-template-rows: 0fr; opacity: 0; }

    .scroll-area { overflow-y: auto; scrollbar-gutter: stable; }
    .list-short { max-height: 360px; }
    .list-tall  { max-height: 520px; }

    /* In focused tab mode, let lists expand comfortably */
    body[data-view]:not([data-view="all"]) .list-short,
    body[data-view]:not([data-view="all"]) .list-tall {
      max-height: none;
    }

    .clamp-2, .clamp-3, .clamp-4 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .clamp-2 { -webkit-line-clamp: 2; }
    .clamp-3 { -webkit-line-clamp: 3; }
    .clamp-4 { -webkit-line-clamp: 4; }

    .openable { cursor: pointer; }
    .openable:hover { color: #60A5FA; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .entrance { animation: fadeInUp .35s ease both; }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    .modal-card { animation: modalIn .18s ease-out both; }

    :focus-visible { outline: 2px solid #60A5FA; outline-offset: 2px; border-radius: 6px; }
    textarea { resize: vertical; }
    .seg { border: 1px solid transparent; }
    .done-text { text-decoration: line-through; opacity: 0.65; }
    .media-preview { aspect-ratio: 16 / 9; }
    .media-preview button { touch-action: manipulation; }
    .media-player { width: 100%; height: 100%; border: 0; }

    @media (max-width: 767px) {
      .list-short, .list-tall { max-height: none; }
      .scroll-area { overflow-y: visible; }
    }
    @media (hover: none) { .edit-btn, .delete-btn { opacity: 1 !important; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body data-view="all" class="bg-[#F4F6FA] dark:bg-graphite text-slate-800 dark:text-ink min-h-screen selection:bg-linkA/20 selection:text-linkA">

  <!-- Sticky Top Command Header -->
  <header class="sticky top-0 z-30 bg-[#F4F6FA]/90 dark:bg-graphite/90 backdrop-blur-xl border-b border-slate-200/80 dark:border-hairline">
    <div class="max-w-[1560px] mx-auto px-4 sm:px-6 lg:px-8 pt-3.5 pb-3">
      
      <!-- Top Row: Brand, Search, Actions -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3.5 min-w-0">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-900 to-slate-700 dark:from-panelHi dark:to-panelAlt border border-slate-700/60 dark:border-hairline shadow-sm flex items-center justify-center font-display font-bold text-sm text-white shrink-0">
            UD
          </div>
          <div class="min-w-0">
            <h1 id="greeting" class="font-display text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight truncate">Umar's Dashboard</h1>
            <div class="flex items-center gap-2.5 mt-0.5">
              <p id="clockLine" class="text-xs font-mono text-slate-500 dark:text-inkMuted truncate"></p>
              <span class="text-slate-300 dark:text-hairline">•</span>
              <span class="inline-flex items-center gap-1.5 text-xs font-mono text-slate-500 dark:text-inkMuted" id="syncIndicator" title="Firestore synchronization status" role="status" aria-live="polite">
                <span id="syncDot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span id="syncText">Connecting…</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Global Search Bar -->
        <div class="order-last w-full lg:order-none lg:w-auto lg:flex-1 lg:max-w-md mx-auto">
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-inkMuted pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"></path></svg>
            <input type="search" id="searchInput" placeholder="Search tasks, notes, links, videos…" aria-label="Search all panels"
              class="w-full pl-10 pr-20 py-2 text-sm bg-white dark:bg-panel border border-slate-200/90 dark:border-hairline rounded-xl shadow-sm placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA transition-all">
            <span id="searchNotice" class="hidden absolute right-9 top-1/2 -translate-y-1/2 text-[11px] font-mono font-medium text-linkA bg-linkA/10 px-2 py-0.5 rounded-md"></span>
            <kbd class="hidden sm:inline-block absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono text-slate-400 dark:text-inkMuted bg-slate-100 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded px-1.5 py-0.5">/</kbd>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
          <button id="exportBackupBtn" class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-xl bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-inkMuted/50 shadow-sm transition-all" title="Download a JSON backup of all your data">
            <svg class="w-4 h-4 text-planA" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span class="hidden sm:inline">Backup JSON</span>
          </button>

          <button id="collapseAllBtn" class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium rounded-xl bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-inkMuted/50 shadow-sm transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span id="collapseAllLabel">Collapse all</span>
          </button>

          <button id="themeToggle" class="p-2 rounded-xl bg-white dark:bg-panel border border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/50 shadow-sm transition-all" title="Toggle theme" aria-label="Toggle color theme">
            <span id="themeIcon" class="text-sm leading-none">🌓</span>
          </button>
        </div>
      </div>

      <!-- Second Row: View Switcher Tabs + Quick Metrics -->
      <div class="flex flex-wrap items-center justify-between gap-3 mt-3 pt-2.5 border-t border-slate-200/60 dark:border-hairline/70">
        <!-- View Mode Tabs -->
        <nav id="viewTabs" class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0 -mx-1 px-1" aria-label="Workspace view">
          <button type="button" data-view-target="all" class="view-tab px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white dark:bg-ink dark:text-graphite transition-all shrink-0">
            All Panels
          </button>
          <button type="button" data-view-target="focus" class="view-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-inkMuted hover:bg-slate-200/60 dark:hover:bg-panelAlt transition-all shrink-0">
            Tasks &amp; Plans
          </button>
          <button type="button" data-view-target="notes" class="view-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-inkMuted hover:bg-slate-200/60 dark:hover:bg-panelAlt transition-all shrink-0">
            Notes
          </button>
          <button type="button" data-view-target="links" class="view-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-inkMuted hover:bg-slate-200/60 dark:hover:bg-panelAlt transition-all shrink-0">
            Quick Links
          </button>
          <button type="button" data-view-target="media" class="view-tab px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-inkMuted hover:bg-slate-200/60 dark:hover:bg-panelAlt transition-all shrink-0">
            Watch Queue
          </button>
        </nav>

        <!-- Live KPI Pills -->
        <div class="flex flex-wrap items-center gap-2 text-xs font-mono">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-panel border border-slate-200/80 dark:border-hairline text-slate-700 dark:text-ink">
            <span class="w-2 h-2 rounded-full bg-taskA"></span>
            <strong id="statOpen" class="font-semibold">0</strong> open
          </span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-panel border border-slate-200/80 dark:border-hairline text-slate-700 dark:text-ink">
            <span class="w-2 h-2 rounded-full bg-urgent"></span>
            <strong id="statHigh" class="font-semibold">0</strong> high
          </span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-panel border border-slate-200/80 dark:border-hairline text-slate-700 dark:text-ink">
            <span class="w-2 h-2 rounded-full bg-planA"></span>
            <strong id="statDone" class="font-semibold">0</strong> done
          </span>
          <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-panel border border-slate-200/80 dark:border-hairline text-slate-500 dark:text-inkMuted" id="statMedia">
            0/0 watched
          </span>
          <span class="hidden xl:inline-flex items-center px-2.5 py-1 rounded-lg text-slate-400 dark:text-inkMuted" id="statTotal">
            0 items tracked
          </span>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Workspace Bento Grid -->
  <main class="max-w-[1560px] mx-auto px-4 sm:px-6 lg:px-8 py-6 entrance">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- 1. WHAT TO DO NEXT (7 cols on desktop) -->
      <section class="panel lg:col-span-7 bg-white dark:bg-panel border border-slate-200/90 dark:border-hairline rounded-2xl shadow-sm overflow-hidden transition-all" data-panel="tasks" data-group="focus">
        <div class="h-1 bg-gradient-to-r from-taskA to-urgent"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-slate-50/60 dark:hover:bg-panelAlt/40 transition-colors" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <span class="w-8 h-8 rounded-lg bg-taskA/10 text-taskA flex items-center justify-center shrink-0">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </span>
            <div>
              <span class="font-display font-semibold text-base sm:text-lg text-slate-900 dark:text-white block leading-tight">What To Do Next</span>
              <span class="text-xs text-slate-400 dark:text-inkMuted">Actionable tasks prioritized by urgency</span>
            </div>
          </span>
          <span class="flex items-center gap-2.5 shrink-0">
            <span id="taskCount" class="text-xs font-mono font-semibold text-taskA bg-taskA/10 border border-taskA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-slate-400 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>

        <div class="panel-body">
          <div>
            <div class="px-5 pb-5 pt-1">
              <!-- Task Input Row -->
              <div class="flex gap-2">
                <input type="text" id="taskInput" placeholder="Add a new task… (Alt + ↑/↓ changes priority)" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-taskA/40 focus:border-taskA transition-colors">
                <button id="addTaskBtn" class="bg-taskA text-slate-950 font-semibold px-4 shrink-0 rounded-xl hover:brightness-105 active:scale-95 transition-all text-sm shadow-sm" aria-label="Add task">Add</button>
              </div>

              <!-- Priority & Filter Bar -->
              <div class="flex flex-wrap items-center justify-between gap-2 mt-3 pb-3 border-b border-slate-100 dark:border-hairline">
                <div class="flex items-center gap-2">
                  <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400 dark:text-inkMuted">Priority:</span>
                  <div id="prioritySelect" class="flex gap-1.5 flex-wrap" role="group" aria-label="Priority for new task"></div>
                </div>
                <div class="flex items-center gap-1 overflow-x-auto" id="taskFilters" role="group" aria-label="Filter tasks"></div>
              </div>

              <ul id="taskList" class="scroll-area list-tall space-y-2.5 pr-1 mt-3.5"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN STACK: LONG TERM PLANS + QUICK LINKS (5 cols on desktop) -->
      <div id="rightStack" class="lg:col-span-5 flex flex-col gap-6">

        <!-- 2. LONG TERM PLANS -->
        <section class="panel bg-white dark:bg-panel border border-slate-200/90 dark:border-hairline rounded-2xl shadow-sm overflow-hidden transition-all" data-panel="plans" data-group="focus">
          <div class="h-1 bg-planA"></div>
          <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-slate-50/60 dark:hover:bg-panelAlt/40 transition-colors" aria-expanded="true">
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="w-8 h-8 rounded-lg bg-planA/10 text-planA flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 18L9 11.25l4.306 4.306a11.95 11.95 0 015.814-5.518l2.74-1.22M21.75 12.75V7.5h-5.25"></path></svg>
              </span>
              <div>
                <span class="font-display font-semibold text-base sm:text-lg text-slate-900 dark:text-white block leading-tight">Long Term Plans</span>
                <span class="text-xs text-slate-400 dark:text-inkMuted">Milestones, goals &amp; roadmap items</span>
              </div>
            </span>
            <span class="flex items-center gap-2.5 shrink-0">
              <span id="planCount" class="text-xs font-mono font-semibold text-planA bg-planA/10 border border-planA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
              <svg class="chevron w-4 h-4 text-slate-400 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </span>
          </button>
          <div class="panel-body">
            <div>
              <div class="px-5 pb-5 pt-1">
                <div class="flex gap-2 mb-3.5">
                  <input type="text" id="planInput" placeholder="Add a milestone or future goal…" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-planA/40 focus:border-planA transition-colors">
                  <button id="addPlanBtn" class="bg-planA text-slate-950 font-semibold px-4 shrink-0 rounded-xl hover:brightness-105 active:scale-95 transition-all text-sm shadow-sm" aria-label="Add plan">Add</button>
                </div>
                <ul id="planList" class="scroll-area list-short space-y-2 pr-1"></ul>
              </div>
            </div>
          </div>
        </section>

        <!-- 3. QUICK LINKS -->
        <section class="panel bg-white dark:bg-panel border border-slate-200/90 dark:border-hairline rounded-2xl shadow-sm overflow-hidden transition-all" data-panel="links" data-group="links">
          <div class="h-1 bg-linkA"></div>
          <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-slate-50/60 dark:hover:bg-panelAlt/40 transition-colors" aria-expanded="true">
            <span class="flex items-center gap-2.5 min-w-0">
              <span class="w-8 h-8 rounded-lg bg-linkA/10 text-linkA flex items-center justify-center shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
              </span>
              <div>
                <span class="font-display font-semibold text-base sm:text-lg text-slate-900 dark:text-white block leading-tight">Quick Links</span>
                <span class="text-xs text-slate-400 dark:text-inkMuted">Frequent tools, portals &amp; bookmarks</span>
              </div>
            </span>
            <span class="flex items-center gap-2.5 shrink-0">
              <span id="linkCount" class="text-xs font-mono font-semibold text-linkA bg-linkA/10 border border-linkA/20 px-2.5 py-0.5 rounded-full min-w-[1.75rem] text-center">0</span>
              <svg class="chevron w-4 h-4 text-slate-400 dark:text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </span>
          </button>
          <div class="panel-body">
            <div>
              <div class="px-5 pb-5 pt-1">
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 mb-3.5">
                  <input type="text" id="linkTitleInput" placeholder="Label (e.g. GitHub)" class="sm:col-span-5 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA transition-colors">
                  <div class="sm:col-span-7 flex gap-2">
                    <input type="text" id="linkUrlInput" placeholder="URL (e.g. github.com)" class="flex-1 min-w-0 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl placeholder:text-slate-400 dark:placeholder:text-inkMuted/70 focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA transition-colors">
                    <button id="addLinkBtn" class="bg-linkA text-slate-950 font-semibold px-4 shrink-0 rounded-xl hover:brightness-105 active:scale-95 transition-all text-sm shadow-sm" aria-label="Save link">Add</button>
                  </div>
                </div>
                <ul id="linkList" class="scroll-area list-short grid grid-cols-1 sm:grid-cols-2 gap-2.5 pr-1 content-start"></ul>
              </div>
            </div>
          </div>
        </section>

      </div>

      <!-- 4. NOTES (Full 12 cols) -->
      <section class="panel lg:col-span-12 bg-white dark:bg-panel border border-slate-200/90 dark:border-hairline rounded-2xl shadow-sm overflow-hidden transition-all" data-panel="notes" data-group="notes">
        <div class="h-1 bg-noteA"></div>
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left hover:bg-slate-50/60 dark:hover:bg-panelAlt/40 transition-colors" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <span class="w-8 h-8 rounded-lg bg-noteA/10 text-noteA flex items-center justify-center shrink-0">

  <script type="module">
    // --- THEME ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const dark = html.classList.contains('dark');
      localStorage.theme = dark ? 'dark' : 'light';
      themeIcon.textContent = dark ? '☀️' : '🌙';
    });

    // --- CLOCK + GREETING ---
    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      const part = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : hour < 22 ? 'Good evening' : 'Winding down';
      document.getElementById('greeting').textContent = `${part}, Umar`;
      document.getElementById('clockLine').textContent =
        now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) +
        ' · ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- WORKSPACE VIEW TABS ---
    const viewTabs = [...document.querySelectorAll('.view-tab')];
    const panels = [...document.querySelectorAll('.panel')];
    const rightStack = document.getElementById('rightStack');
    const panelApi = new Map();

    function setWorkspaceView(viewName) {
      document.body.dataset.view = viewName;
      viewTabs.forEach(tab => {
        const active = tab.dataset.viewTarget === viewName;
        tab.className = 'view-tab px-3 py-1.5 rounded-lg text-xs transition-all shrink-0 ' +
          (active
            ? 'font-semibold bg-slate-900 text-white dark:bg-ink dark:text-graphite shadow-sm'
            : 'font-medium text-slate-600 dark:text-inkMuted hover:bg-slate-200/60 dark:hover:bg-panelAlt');
      });

      if (viewName === 'all') {
        rightStack.className = 'lg:col-span-5 flex flex-col gap-6';
        panels.forEach(p => {
          p.classList.remove('hidden', 'lg:col-span-12');
          if (['tasks', 'yt'].includes(p.dataset.panel)) p.classList.add('lg:col-span-7');
          if (p.dataset.panel === 'fb') p.classList.add('lg:col-span-5');
          if (p.dataset.panel === 'notes') p.classList.add('lg:col-span-12');
        });
      } else {
        rightStack.className = (viewName === 'focus' || viewName === 'links') ? 'lg:col-span-12 flex flex-col gap-6' : 'hidden';
        panels.forEach(p => {
          const match = p.dataset.group === viewName;
          p.classList.toggle('hidden', !match);
          if (match) {
            p.classList.remove('lg:col-span-7', 'lg:col-span-5');
            p.classList.add('lg:col-span-12');
            panelApi.get(p)?.(false, false);
          }
        });
      }
    }

    viewTabs.forEach(tab => {
      tab.addEventListener('click', () => setWorkspaceView(tab.dataset.viewTarget));
    });

    // --- COLLAPSE / EXPAND ---
    panels.forEach((panel) => {
      const key = 'panelCollapsed:' + panel.dataset.panel;
      const toggleBtn = panel.querySelector('.collapse-toggle');
      const chevron = panel.querySelector('.chevron');

      const setCollapsed = (collapsed, persist = true) => {
        panel.classList.toggle('collapsed', collapsed);
        chevron.classList.toggle('-rotate-90', collapsed);
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        if (persist) localStorage.setItem(key, String(collapsed));
      };

      panelApi.set(panel, setCollapsed);
      if (localStorage.getItem(key) === 'true') setCollapsed(true, false);

      toggleBtn.addEventListener('click', () => {
        setCollapsed(!panel.classList.contains('collapsed'));
        syncCollapseAllLabel();
      });
    });

    const collapseAllBtn = document.getElementById('collapseAllBtn');
    const collapseAllLabel = document.getElementById('collapseAllLabel');
    function syncCollapseAllLabel() {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      collapseAllLabel.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
    }
    syncCollapseAllLabel();
    collapseAllBtn.addEventListener('click', () => {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      panels.forEach(p => panelApi.get(p)(!allCollapsed));
      syncCollapseAllLabel();
    });

    // --- FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch (err) {
      console.warn('Persistent cache unavailable; using memory-only Firestore.', err);
      db = getFirestore(app);
    }

    let toastTimeout;
    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.add('hidden'), 5000);
    }
    function reportError(error, action = 'save your changes') {
      console.error('Firestore:', error);
      toast(`Could not ${action}. ${error?.code === 'permission-denied' ? 'Check your Firestore security rules.' : 'Please check your connection and try again.'}`);
    }

    const connection = {};
    function renderSyncStatus() {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncText');
      const statuses = Object.values(connection);
      const isOffline = !navigator.onLine;
      const pending = statuses.some(s => s.pending);
      const cached = statuses.some(s => s.cached);
      const failed = statuses.some(s => s.failed);
      const message = failed ? 'Sync error' : isOffline ? 'Offline (cached)' : pending ? 'Saving…' : cached || statuses.length < 6 ? 'Syncing…' : 'Synced';
      label.textContent = message;
      dot.className = 'w-2 h-2 rounded-full ' + (failed ? 'bg-rose-500' : isOffline || cached ? 'bg-amber-400' : pending ? 'bg-blue-400 animate-pulse' : 'bg-planA');
    }
    window.addEventListener('online', renderSyncStatus);
    window.addEventListener('offline', renderSyncStatus);

    // --- HELPERS ---
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const normalizeUrl = (value) => {
      const raw = String(value || '').trim();
      if (!raw || /^(?:javascript|data|file|vbscript):/i.test(raw)) return '';
      try {
        const parsed = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
        return ['https:', 'http:'].includes(parsed.protocol) && parsed.hostname ? parsed.href : '';
      } catch { return ''; }
    };

    const isFacebookUrl = (url) => {
      try {
        const host = new URL(url).hostname.toLowerCase();
        return host === 'facebook.com' || host.endsWith('.facebook.com') || host === 'fb.watch' || host === 'fb.com' || host.endsWith('.fb.com');
      } catch { return false; }
    };

    const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };

    function getYTVideoId(input) {
      try {
        const url = new URL(normalizeUrl(input));
        const host = url.hostname.toLowerCase();
        let id = null;
        if (host === 'youtu.be' || host === 'www.youtu.be') {
          id = url.pathname.split('/').filter(Boolean)[0];
        } else if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtube-nocookie.com', 'www.youtube-nocookie.com'].includes(host)) {
          const parts = url.pathname.split('/').filter(Boolean);
          id = parts[0] === 'watch' ? url.searchParams.get('v') :
            ['shorts', 'embed', 'live', 'v'].includes(parts[0]) ? parts[1] : null;
        }
        return /^[a-zA-Z0-9_-]{11}$/.test(id || '') ? id : null;
      } catch { return null; }
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      try {
        const date = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts.seconds * 1000);
        return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch { return ''; }
    }

    const checkIcon = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12l4 4L19 6"/></svg>';
    function completedLabel(item) {
      if (!item.done || !item.completedAt) return '';
      const formatted = formatTimestamp(item.completedAt);
      return formatted ? `Completed ${formatted}` : '';
    }

    const mediaCheckButton = (item, label) => {
      const done = !!item.done;
      return `<button type="button" class="toggle-btn inline-flex items-center gap-2 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all ${done ? 'bg-planA/15 border border-planA/50 text-emerald-700 dark:text-planA' : 'bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:border-planA'}" aria-pressed="${done}" aria-label="${done ? `Mark ${label} as not watched` : `Mark ${label} as watched`}">
        <span class="w-4 h-4 rounded border ${done ? 'bg-planA border-planA text-slate-950' : 'border-current'} flex items-center justify-center">${done ? checkIcon : ''}</span>
        ${done ? 'Watched' : 'Mark watched'}</button>`;
    };

    function mediaPreview(videoId, title) {
      const safeId = esc(videoId);
      return `<div class="media-preview relative overflow-hidden rounded-xl bg-slate-900 border border-slate-200/40 dark:border-hairline">
        <button type="button" class="play-video w-full h-full relative group/play" data-video="${safeId}" aria-label="Play ${esc(title)}">
          <img src="https://i.ytimg.com/vi/${safeId}/hqdefault.jpg" loading="lazy" decoding="async" alt="" class="w-full h-full object-cover group-hover/play:scale-[1.02] transition-transform duration-300" width="480" height="360">
          <span class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover/play:bg-black/35 transition-colors">
            <span class="rounded-full bg-ytA text-white px-4 py-2 shadow-lg font-semibold text-xs flex items-center gap-1.5 group-hover/play:scale-105 transition-transform">▶ Play Video</span>
          </span>
        </button></div>`;
    }

    function mountMediaPlayers(root) {
      root.querySelectorAll('.play-video').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.video;
          if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return;
          const iframe = document.createElement('iframe');
          iframe.className = 'media-player absolute inset-0';
          iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
          iframe.title = 'YouTube video player';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.allowFullscreen = true;
          btn.parentElement.replaceChildren(iframe);
        });
      });
    }

    const faviconFor = (url) => {
      try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`; }
      catch { return ''; }
    };

    const trashIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
    const editIcon  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>`;

    const iconBtn = 'text-slate-400 dark:text-inkMuted hover:text-slate-900 dark:hover:text-white hover:bg-slate-200/60 dark:hover:bg-panel rounded-lg transition-all shrink-0 p-1.5 inline-flex items-center justify-center opacity-100 md:opacity-0 md:group-hover/item:opacity-100 md:focus:opacity-100';

    // --- PRIORITIES ---
    const PRIORITIES = {
      high:   { label: 'High',   rank: 0, dot: 'bg-urgent', chip: 'text-rose-600 dark:text-rose-300 bg-rose-500/10 border-rose-500/30', on: 'bg-urgent text-white border-urgent' },
      medium: { label: 'Medium', rank: 1, dot: 'bg-taskA',  chip: 'text-amber-700 dark:text-amber-300 bg-amber-500/10 border-amber-500/30', on: 'bg-taskA text-slate-950 border-taskA' },
      low:    { label: 'Low',    rank: 2, dot: 'bg-steady', chip: 'text-sky-700 dark:text-sky-300 bg-sky-500/10 border-sky-500/30', on: 'bg-steady text-slate-950 border-steady' },
    };
    const PRIORITY_ORDER = ['high', 'medium', 'low'];
    const priorityOf = (t) => PRIORITIES[t.priority] ? t.priority : 'medium';

    let newTaskPriority = localStorage.getItem('newTaskPriority') || 'medium';
    if (!PRIORITIES[newTaskPriority]) newTaskPriority = 'medium';

    const prioritySelect = document.getElementById('prioritySelect');
    function renderPrioritySelect() {
      prioritySelect.innerHTML = '';
      PRIORITY_ORDER.forEach((p) => {
        const conf = PRIORITIES[p];
        const active = p === newTaskPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold shadow-sm' : 'bg-slate-100 dark:bg-panelAlt text-slate-600 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-current' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => {
          newTaskPriority = p;
          localStorage.setItem('newTaskPriority', p);
          renderPrioritySelect();
        });
        prioritySelect.appendChild(btn);
      });
    }
    renderPrioritySelect();

    // --- FILTERS + SEARCH ---
    let taskFilter = localStorage.getItem('taskFilter') || 'open';
    let searchTerm = '';

    const FILTERS = [
      { id: 'open', label: 'Open' },
      { id: 'high', label: 'High' },
      { id: 'medium', label: 'Medium' },
      { id: 'low', label: 'Low' },
      { id: 'done', label: 'Done' },
      { id: 'all', label: 'All' },
    ];

    const taskFilters = document.getElementById('taskFilters');
    function renderFilters() {
      taskFilters.innerHTML = '';
      FILTERS.forEach(f => {
        const active = f.id === taskFilter;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg shrink-0 px-2.5 py-1 rounded-lg text-xs transition-colors ' +
          (active ? 'bg-slate-900 dark:bg-ink text-white dark:text-graphite border-slate-900 dark:border-ink font-semibold'
                  : 'bg-transparent text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300');
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          taskFilter = f.id;
          localStorage.setItem('taskFilter', f.id);
          renderFilters();
          renderList('tasks');
          updateStats();
        });
        taskFilters.appendChild(btn);
      });
    }
    renderFilters();

    const searchInput = document.getElementById('searchInput');
    const searchNotice = document.getElementById('searchNotice');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value.trim().toLowerCase();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        Object.keys(config).forEach(key => { visibleLimits[key] = PAGE_SIZE; renderList(key); });
        updateStats();
      }, 120);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing && !editing) { e.preventDefault(); searchInput.focus(); }
    });

    // --- STATE ---
    const state = { tasks: [], notes: [], links: [], plans: [], yt: [], fb: [] };
    const PAGE_SIZE = 48;
    const visibleLimits = { tasks: PAGE_SIZE, notes: PAGE_SIZE, links: PAGE_SIZE, plans: PAGE_SIZE, yt: PAGE_SIZE, fb: PAGE_SIZE };
    const mediaFilters = {
      yt: localStorage.getItem('ytFilter') || 'queued',
      fb: localStorage.getItem('fbFilter') || 'queued'
    };
    for (const key of ['yt', 'fb']) {
      if (!['queued', 'watched', 'all'].includes(mediaFilters[key])) mediaFilters[key] = 'queued';
    }
    function renderMediaFilters(key) {
      const container = document.getElementById(`${key}Filters`);
      container.replaceChildren();
      [['queued', 'To Watch'], ['watched', 'Watched'], ['all', 'All']].forEach(([value, label]) => {
        const btn = document.createElement('button');
        const active = mediaFilters[key] === value;
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg rounded-lg px-3 py-1 text-xs transition-colors ' +
          (active ? 'bg-slate-900 dark:bg-ink text-white dark:text-graphite font-semibold' : 'border border-slate-200 dark:border-hairline text-slate-500 dark:text-inkMuted hover:border-slate-400');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          mediaFilters[key] = value;
          localStorage.setItem(`${key}Filter`, value);
          visibleLimits[key] = PAGE_SIZE;
          renderMediaFilters(key);
          renderList(key);
          updateStats();
        });
        container.append(btn);
      });
    }
    renderMediaFilters('yt');
    renderMediaFilters('fb');

    const config = {
      tasks: { collection: 'tasks',      el: document.getElementById('taskList'), countId: 'taskCount', accent: 'bg-taskA', title: 'Task' },
      notes: { collection: 'notes',      el: document.getElementById('noteList'), countId: 'noteCount', accent: 'bg-noteA', title: 'Note' },
      links: { collection: 'quickLinks', el: document.getElementById('linkList'), countId: 'linkCount', accent: 'bg-linkA', title: 'Quick Link' },
      plans: { collection: 'plans',      el: document.getElementById('planList'), countId: 'planCount', accent: 'bg-planA', title: 'Long Term Plan' },
      yt:    { collection: 'ytLinks',    el: document.getElementById('ytList'),   countId: 'ytCount',   accent: 'bg-ytA',   title: 'YouTube Video' },
      fb:    { collection: 'fbLinks',    el: document.getElementById('fbList'),   countId: 'fbCount',   accent: 'bg-fbA',   title: 'Facebook Link' },
    };

    const emptyMessages = {
      tasks: 'No tasks match this filter — add one above or switch filters.',
      notes: 'No notes saved yet — write one in the composer.',
      links: 'No quick links saved yet — add a bookmark above.',
      plans: 'No long term plans yet — add your next milestone above.',
      yt: 'No videos in this view — paste a YouTube link above.',
      fb: 'No Facebook posts in this view — paste a link above.'
    };

    function searchableText(key, item) {
      if (key === 'notes') {
        const linkText = (item.links || []).map(l => `${l.label || ''} ${l.url || ''}`).join(' ');
        return `${item.text || ''} ${item.body || ''} ${linkText}`.toLowerCase();
      }
      return `${item.text || ''} ${item.url || ''} ${item.reflection || ''}`.toLowerCase();
    }

    // --- BACKUP JSON EXPORT ---
    document.getElementById('exportBackupBtn').addEventListener('click', () => {
      const payload = {
        exportedAt: new Date().toISOString(),
        projectId: firebaseConfig.projectId,
        collections: {
          tasks: state.tasks,
          notes: state.notes,
          quickLinks: state.links,
          plans: state.plans,
          ytLinks: state.yt,
          fbLinks: state.fb,
        }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `umar-dashboard-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Backup JSON downloaded successfully.');
    });

    /* ==========================================================
       DETAIL / EDIT DIALOG
       ========================================================== */
    const overlay = document.getElementById('editorOverlay');
    const editorFields = document.getElementById('editorFields');
    const editorTitleEl = document.getElementById('editorTitle');
    const editorAccent = document.getElementById('editorAccent');
    let editing = null;
    let editPriority = 'medium';
    let editDone = false;

    const fieldInput = 'w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-xl focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA transition-colors';
    const fieldLabel = 'text-xs font-mono uppercase tracking-wider text-slate-400 dark:text-inkMuted mb-1.5 block';

    function field(label, inner) {
      return `<label class="block"><span class="${fieldLabel}">${label}</span>${inner}</label>`;
    }

    function linkRow(link = { label: '', url: '' }) {
      return `
        <div class="ed-link-row flex gap-2 items-center">
          <input type="text" class="ed-link-label w-[34%] min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="Label" value="${esc(link.label || '')}">
          <input type="text" class="ed-link-url flex-1 min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="https://" value="${esc(link.url || '')}">
          <button type="button" class="ed-link-remove w-9 h-9 shrink-0 rounded-lg border border-slate-200 dark:border-hairline text-slate-400 hover:text-rose-500 hover:border-rose-400 transition-colors" aria-label="Remove link">&times;</button>
        </div>`;
    }

    function buildEditorFields(key, item) {
      if (key === 'tasks') {
        editPriority = priorityOf(item);
        editDone = !!item.done;
        editorFields.innerHTML =
          field('Task Description', `<textarea id="edText" rows="4" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Priority</span>
             <div id="edPriority" class="flex gap-1.5 flex-wrap"></div>
           </div>
           <label class="flex items-center gap-2.5 cursor-pointer select-none pt-1">
             <input type="checkbox" id="edDone" ${editDone ? 'checked' : ''} class="w-4 h-4 accent-planA rounded">
             <span class="text-sm font-medium text-slate-700 dark:text-ink">Mark task as completed</span>
           </label>`;
        renderEditPriority();
      }
      else if (key === 'plans') {
        editDone = !!item.done;
        editorFields.innerHTML =
          field('Plan / Milestone', `<textarea id="edText" rows="5" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none pt-1">
             <input type="checkbox" id="edDone" ${editDone ? 'checked' : ''} class="w-4 h-4 accent-planA rounded">
             <span class="text-sm font-medium text-slate-700 dark:text-ink">Mark milestone as achieved</span>
           </label>`;
      }
      else if (key === 'links') {
        editorFields.innerHTML =
          field('Bookmark Name', `<input type="text" id="edText" class="${fieldInput}" value="${esc(item.text)}">`) +
          field('Destination URL', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="${esc(item.url || '')}">`) +
          `<a href="${esc(normalizeUrl(item.url) || '#')}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-semibold text-linkA hover:underline">Open link in new tab ↗</a>`;
      }
      else if (key === 'yt') {
        editorFields.innerHTML =
          field('Video Title', `<textarea id="edText" rows="2" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          field('YouTube URL', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="https://youtu.be/${esc(item.videoId || '')}">`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="edDone" ${item.done ? 'checked' : ''} class="w-4 h-4 accent-planA rounded">
            <span class="text-sm font-medium text-slate-700 dark:text-ink">Finished watching</span>
          </label>` +
          field('Key Takeaways & Learning Notes', `<textarea id="edReflection" rows="6" maxlength="20000" placeholder="What did you learn? Any timestamps or action items?" class="${fieldInput} leading-relaxed">${esc(item.reflection || '')}</textarea>`) +
          `<a class="inline-flex items-center gap-1.5 text-xs font-semibold text-ytA hover:underline" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(item.videoId || '')}">Open video on YouTube ↗</a>`;
      }
      else if (key === 'fb') {
        editorFields.innerHTML =
          field('Post Title / Summary', `<textarea id="edText" rows="2" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          field('Facebook URL', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="${esc(item.url || '')}">`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="edDone" ${item.done ? 'checked' : ''} class="w-4 h-4 accent-planA rounded">
            <span class="text-sm font-medium text-slate-700 dark:text-ink">Finished reading / viewing</span>
          </label>` +
          field('Key Takeaways & Thoughts', `<textarea id="edReflection" rows="6" maxlength="20000" placeholder="Key idea, reaction, or next action…" class="${fieldInput} leading-relaxed">${esc(item.reflection || '')}</textarea>`) +
          `<a href="${esc(normalizeUrl(item.url) || '#')}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 text-xs font-semibold text-fbA hover:underline">Open on Facebook ↗</a>`;
      }
      else if (key === 'notes') {
        const links = Array.isArray(item.links) ? item.links : [];
        editorFields.innerHTML =
          field('Note Title', `<input type="text" id="edText" class="${fieldInput} font-semibold text-base" value="${esc(item.text)}">`) +
          field('Note Content', `<textarea id="edBody" rows="10" class="${fieldInput} leading-relaxed">${esc(item.body || '')}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Attached Links</span>
             <div id="edLinks" class="flex flex-col gap-2">${links.map(linkRow).join('')}</div>
             <button type="button" id="edAddLink" class="mt-2.5 text-xs font-semibold text-noteA hover:underline">+ Attach another link</button>
           </div>`;

        document.getElementById('edAddLink').addEventListener('click', () => {
          document.getElementById('edLinks').insertAdjacentHTML('beforeend', linkRow());
        });
        editorFields.onclick = (e) => {
          const btn = e.target.closest('.ed-link-remove');
          if (btn) btn.closest('.ed-link-row').remove();
        };
      }
    }

    function renderEditPriority() {
      const box = document.getElementById('edPriority');
      if (!box) return;
      box.innerHTML = '';
      PRIORITY_ORDER.forEach(p => {
        const conf = PRIORITIES[p];
        const active = p === editPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold' : 'bg-slate-100 dark:bg-panelAlt text-slate-600 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-current' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => { editPriority = p; renderEditPriority(); });
        box.appendChild(btn);
      });
    }

    let previousFocus = null;
    function openEditor(key, item) {
      previousFocus = document.activeElement;
      editing = { key, id: item.id };
      editorTitleEl.textContent = config[key].title;
      editorAccent.className = 'h-1.5 ' + config[key].accent;
      buildEditorFields(key, item);

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.body.classList.add('modal-open');

      const first = document.getElementById('edText');
      if (first) {
        first.focus();
        if (first.setSelectionRange) {
          const end = first.value.length;
          first.setSelectionRange(end, end);
        }
      }
    }

    function closeEditor() {
      editing = null;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.body.classList.remove('modal-open');
      editorFields.innerHTML = '';
      if (previousFocus?.isConnected) previousFocus.focus();
      previousFocus = null;
    }

    async function saveEditor() {
      if (!editing) return;
      const { key, id } = editing;
      const ref = doc(db, config[key].collection, id);
      const textEl = document.getElementById('edText');
      const text = textEl ? textEl.value.trim() : '';

      let patch = null;

      if (key === 'tasks' || key === 'plans') {
        if (!text) { alert('Text cannot be empty.'); return; }
        patch = key === 'tasks'
          ? { text, priority: editPriority, done: document.getElementById('edDone').checked }
          : { text, done: document.getElementById('edDone').checked };
      }
      else if (key === 'links') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (!url) { toast('Please enter a valid http(s) link.'); return; }
        patch = { text: text || hostOf(url), url };
      }
      else if (key === 'yt' || key === 'fb') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (key === 'yt' && !getYTVideoId(url)) { toast('Please enter a valid YouTube video link.'); return; }
        if (key === 'fb' && !isFacebookUrl(url)) { toast('Please enter a valid Facebook link.'); return; }
        const oldItem = state[key].find(x => x.id === id);
        const done = document.getElementById('edDone').checked;
        patch = {
          text: text || (key === 'yt' ? 'Untitled video' : 'Untitled Facebook link'),
          reflection: document.getElementById('edReflection').value.trim(),
          done,
          completedAt: done ? (oldItem?.done && oldItem.completedAt || serverTimestamp()) : null,
          ...(key === 'yt' ? { videoId: getYTVideoId(url) } : { url })
        };
      }
      else if (key === 'notes') {
        const body = document.getElementById('edBody').value.trim();
        const links = [...document.querySelectorAll('#edLinks .ed-link-row')]
          .map(row => ({
            label: row.querySelector('.ed-link-label').value.trim(),
            url: normalizeUrl(row.querySelector('.ed-link-url').value)
          }))
          .filter(l => l.url);
        if (!text && !body && !links.length) { alert('The note is empty.'); return; }
        patch = { text: text || 'Untitled note', body, links };
      }

      updateDoc(ref, patch).catch(err => reportError(err));
      closeEditor();
    }

    async function deleteFromEditor() {
      if (!editing) return;
      const { key, id } = editing;
      if (!confirm('Delete this item permanently?')) return;
      deleteDoc(doc(db, config[key].collection, id)).catch(err => reportError(err, 'delete this item'));
      closeEditor();
    }

    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorCancel').addEventListener('click', closeEditor);
    document.getElementById('editorBackdrop').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    document.getElementById('editorDelete').addEventListener('click', deleteFromEditor);

    document.addEventListener('keydown', (e) => {
      if (!editing) return;
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); }
    });

    // --- RENDERERS ---
    function renderNoteLink(link) {
      if (!link || !link.url) return '';
      const safeUrl = normalizeUrl(link.url);
      if (!safeUrl) return '';
      const vidId = getYTVideoId(safeUrl);

      if (vidId) {
        return `
          <div class="flex flex-col gap-1.5">
            ${mediaPreview(vidId, link.label || 'YouTube video')}
            ${link.label ? `<span class="text-xs font-medium text-slate-500 dark:text-inkMuted truncate">${esc(link.label)}</span>` : ''}
          </div>`;
      }

      const host = hostOf(safeUrl);
      const favicon = faviconFor(safeUrl);
      return `

      li.querySelector('.delete-btn')?.addEventListener('click', () => {

    function visibleItems(key) {
      let items = state[key];

      if (searchTerm) items = items.filter(i => searchableText(key, i).includes(searchTerm));

      if (key === 'yt' || key === 'fb') {
        if (mediaFilters[key] === 'queued') items = items.filter(x => !x.done);
        if (mediaFilters[key] === 'watched') items = items.filter(x => !!x.done);
      }
      if (key === 'tasks') {
        items = items.filter(t => {
          if (taskFilter === 'all') return true;
          if (taskFilter === 'open') return !t.done;
          if (taskFilter === 'done') return !!t.done;
          return priorityOf(t) === taskFilter && !t.done;
        });
        items = items.slice().sort((a, b) => {
          if (!!a.done !== !!b.done) return a.done ? 1 : -1;
          return PRIORITIES[priorityOf(a)].rank - PRIORITIES[priorityOf(b)].rank;
        });
      }

      return items;
    }

    function renderList(key) {
      const listEl = config[key].el;
      const items = visibleItems(key);
      listEl.innerHTML = '';

      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'col-span-full text-center text-xs font-mono text-slate-400 dark:text-inkMuted py-8 px-4 rounded-xl border border-dashed border-slate-200 dark:border-hairline';
        li.textContent = searchTerm ? 'No items match your search.' : emptyMessages[key];
        listEl.appendChild(li);
        return;
      }

      const frag = document.createDocumentFragment();
      items.slice(0, visibleLimits[key]).forEach(item => frag.appendChild(buildItem(key, item)));
      if (items.length > visibleLimits[key]) {
        const more = document.createElement('li');
        more.className = 'col-span-full';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full py-2.5 px-4 text-xs font-semibold text-linkA border border-slate-200 dark:border-hairline rounded-xl hover:bg-slate-100 dark:hover:bg-panelAlt transition-colors';
        btn.textContent = `Show more (${items.length - visibleLimits[key]} remaining)`;
        btn.addEventListener('click', () => { visibleLimits[key] += PAGE_SIZE; renderList(key); });
        more.append(btn);
        frag.append(more);
      }
      listEl.appendChild(frag);
    }

    function updateStats() {
      const open = state.tasks.filter(t => !t.done).length;
      const done = state.tasks.length - open;
      const high = state.tasks.filter(t => !t.done && priorityOf(t) === 'high').length;
      const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);

      document.getElementById('statOpen').textContent = open;
      document.getElementById('statHigh').textContent = high;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statTotal').textContent = total + (total === 1 ? ' item' : ' items');
      const mediaItems = [...state.yt, ...state.fb];
      document.getElementById('statMedia').textContent = `${mediaItems.filter(x => x.done).length}/${mediaItems.length} watched`;
      document.getElementById('taskCount').textContent = open;

      if (searchTerm) {
        const matches = Object.keys(state).reduce((n, k) => n + visibleItems(k).length, 0);
        searchNotice.textContent = `${matches} ${matches === 1 ? 'match' : 'matches'}`;
        searchNotice.classList.remove('hidden');
      } else {
        searchNotice.classList.add('hidden');
      }
    }

    function listen(key) {
      const { collection: name, countId } = config[key];
      const q = query(collection(db, name), orderBy('createdAt', 'desc'));

      onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
        connection[key] = {
          cached: snapshot.metadata.fromCache,
          pending: snapshot.metadata.hasPendingWrites,
          failed: false
        };
        renderSyncStatus();
        if (snapshot.docChanges({ includeMetadataChanges: false }).length === 0 && state[key].length > 0) return;
        state[key] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (key !== 'tasks') document.getElementById(countId).textContent = snapshot.size;
        renderList(key);
        updateStats();
      }, (err) => {
        connection[key] = { cached: false, pending: false, failed: true };
        renderSyncStatus();
        reportError(err, `load ${key}`);
      });
    }

    // --- ADDING ---
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      const dataToSave = { createdAt: serverTimestamp() };

      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { toast('Please enter a valid YouTube link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled video';
        dataToSave.videoId = vidId;
        dataToSave.done = false;
        dataToSave.reflection = '';
        titleInput.value = '';
      }
      else if (type === 'fb') {
        const titleInput = document.getElementById('fbTitleInput');
        const url = normalizeUrl(mainInputValue);
        if (!isFacebookUrl(url)) { toast('Please enter a valid Facebook link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled Facebook link';
        dataToSave.url = url;
        dataToSave.done = false;
        dataToSave.reflection = '';
        titleInput.value = '';
      }
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        const url = normalizeUrl(mainInputValue);
        if (!url) { toast('Please enter a valid website URL.'); return; }
        dataToSave.text = titleInput.value.trim() || hostOf(url);
        dataToSave.url = url;
        titleInput.value = '';
      }
      else if (type === 'task') {
        dataToSave.text = mainInputValue;
        dataToSave.priority = newTaskPriority;
        dataToSave.done = false;
        if (taskFilter === 'done' || (PRIORITIES[taskFilter] && taskFilter !== newTaskPriority)) {
          taskFilter = 'open';
          localStorage.setItem('taskFilter', taskFilter);
          renderFilters();
        }
      }
      else {
        dataToSave.text = mainInputValue;
      }

      addDoc(collection(db, collectionName), dataToSave).catch(err => {
        reportError(err);
        if (!inputElement.value) inputElement.value = mainInputValue;
      });
      inputElement.value = '';
    }

    // --- NOTE COMPOSER ---
    let pendingNoteLinks = [];
    const noteLinkChips = document.getElementById('noteLinkChips');

    function renderNoteChips() {
      noteLinkChips.innerHTML = '';
      const has = pendingNoteLinks.length > 0;
      noteLinkChips.classList.toggle('hidden', !has);
      noteLinkChips.classList.toggle('flex', has);
      if (!has) return;

      pendingNoteLinks.forEach((link, index) => {
        const chip = document.createElement('span');
        chip.className = 'flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 text-xs bg-noteA/10 text-slate-700 dark:text-ink border border-noteA/30 rounded-full';
        chip.innerHTML = `
          <span class="truncate max-w-[150px]">${esc(link.label || hostOf(link.url))}</span>
          <button type="button" class="text-slate-400 hover:text-rose-500 transition-colors leading-none px-1" aria-label="Remove link">&times;</button>`;
        chip.querySelector('button').addEventListener('click', () => {
          pendingNoteLinks.splice(index, 1);
          renderNoteChips();
        });
        noteLinkChips.appendChild(chip);
      });
    }

    function stageNoteLink() {
      const urlInput = document.getElementById('noteLinkInput');
      const labelInput = document.getElementById('noteLinkLabelInput');
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      pendingNoteLinks.push({ url, label: labelInput.value.trim() });
      urlInput.value = '';
      labelInput.value = '';
      renderNoteChips();
    }

    async function addNote() {
      const titleInput = document.getElementById('noteTitleInput');
      const bodyInput = document.getElementById('noteBodyInput');

      if (document.getElementById('noteLinkInput').value.trim()) stageNoteLink();

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title && !body && !pendingNoteLinks.length) return;

      addDoc(collection(db, 'notes'), {
        text: title || 'Untitled note',
        body,
        links: [...pendingNoteLinks],
        createdAt: serverTimestamp()
      }).catch(err => {
        reportError(err);
        if (!titleInput.value) titleInput.value = title;
        if (!bodyInput.value) bodyInput.value = body;
      });

      titleInput.value = '';
      bodyInput.value = '';
      pendingNoteLinks = [];
      renderNoteChips();
      titleInput.focus();
    }

    // --- WIRING ---
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'task'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));
    document.getElementById('addFbBtn').addEventListener('click', () => addItem('fbLinks', document.getElementById('fbInput'), 'fb'));
    document.getElementById('addNoteLinkBtn').addEventListener('click', stageNoteLink);
    document.getElementById('addNoteBtn').addEventListener('click', addNote);

    const enterMap = { linkUrlInput: 'addLinkBtn', linkTitleInput: 'addLinkBtn', taskInput: 'addTaskBtn', planInput: 'addPlanBtn', ytInput: 'addYtBtn', fbInput: 'addFbBtn' };
    Object.entries(enterMap).forEach(([inputId, btnId]) => {
      document.getElementById(inputId).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); }
      });
    });

    ['noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); stageNoteLink(); }
      });
    });

    ['noteTitleInput', 'noteBodyInput', 'noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !editing) { e.preventDefault(); addNote(); }
      });
    });

    document.getElementById('noteTitleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('noteBodyInput').focus(); }
    });

    document.getElementById('taskInput').addEventListener('keydown', (e) => {
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const i = PRIORITY_ORDER.indexOf(newTaskPriority);
      const next = e.key === 'ArrowUp' ? Math.max(0, i - 1) : Math.min(PRIORITY_ORDER.length - 1, i + 1);
      newTaskPriority = PRIORITY_ORDER[next];
      localStorage.setItem('newTaskPriority', newTaskPriority);
      renderPrioritySelect();
    });

    // --- START ---
    Object.keys(config).forEach(listen);
    renderSyncStatus();
  </script>
</body>
</html>
