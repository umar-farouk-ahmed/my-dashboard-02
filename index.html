<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Umar's Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            graphite: '#0D0F14',
            panel: '#151822',
            panelAlt: '#1B1F2A',
            hairline: '#262B38',
            ink: '#ECEAE4',
            inkMuted: '#8B90A3',
            linkA: '#7C9EFF',
            taskA: '#FFB454',
            planA: '#5FD9A4',
            ytA: '#FF6F91',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #2E3444; }

    /* Height-animated collapse using the grid-template-rows trick (no JS height math) */
    .panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.35s ease, opacity 0.3s ease;
      opacity: 1;
    }
    .panel-body > div { overflow: hidden; min-height: 0; }
    .panel.collapsed .panel-body { grid-template-rows: 0fr; opacity: 0; }

    .item-list { max-height: 300px; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .entrance { animation: fadeInUp 0.5s ease both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body class="bg-[#F7F6F2] dark:bg-graphite text-slate-800 dark:text-ink min-h-screen p-4 md:p-8">

  <div class="max-w-[1400px] mx-auto space-y-6 entrance">

    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center gap-4 bg-white dark:bg-panel px-6 py-5 rounded-xl border border-slate-200 dark:border-hairline">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-panelAlt border border-slate-200 dark:border-hairline flex items-center justify-center font-display font-bold text-sm text-slate-500 dark:text-inkMuted">
          UD
        </div>
        <div>
          <h1 class="font-display text-2xl font-semibold tracking-tight text-slate-900 dark:text-white leading-tight">Umar's Dashboard</h1>
          <div class="flex items-center gap-2 mt-1">
            <span class="relative flex h-1.5 w-1.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-planA opacity-75"></span>
              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-planA"></span>
            </span>
            <span class="text-xs font-mono text-inkMuted">Synced</span>
            <span id="totalCount" class="text-xs font-mono text-inkMuted"></span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="hidden sm:flex flex-col items-end leading-tight font-mono text-inkMuted">
          <span id="clockDate" class="text-xs"></span>
          <span id="clockTime" class="text-sm font-medium text-slate-700 dark:text-ink"></span>
        </div>
        <button id="themeToggle" class="p-3 rounded-lg bg-slate-100 dark:bg-panelAlt border border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/50 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400" title="Toggle Theme" aria-label="Toggle color theme">
          <span id="themeIcon">🌓</span>
        </button>
      </div>
    </header>

    <!-- 4-Column Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">

      <!-- 1. Quick Links -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline border-l-4 border-l-linkA rounded-xl transition-colors" data-panel="links">
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left focus:outline-none" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-linkA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Quick Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="linkCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col gap-2.5 mb-4">
                <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-linkA/50 transition-colors">
                <div class="flex gap-2">
                  <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-linkA/50 transition-colors">
                  <button id="addLinkBtn" class="bg-linkA text-white px-4 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold focus:outline-none focus:ring-2 focus:ring-linkA/50">+</button>
                </div>
              </div>
              <ul id="linkList" class="item-list space-y-2 overflow-y-auto pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. What To Do Next -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline border-l-4 border-l-taskA rounded-xl transition-colors" data-panel="tasks">
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left focus:outline-none" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-taskA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            <span class="font-display font-semibold text-lg truncate">What To Do Next</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="taskCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex gap-2 mb-4">
                <input type="text" id="taskInput" placeholder="Add a new task..." class="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-taskA/50 transition-colors">
                <button id="addTaskBtn" class="bg-taskA text-white px-4 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold focus:outline-none focus:ring-2 focus:ring-taskA/50">+</button>
              </div>
              <ul id="taskList" class="item-list space-y-2 overflow-y-auto pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. Long Term Plans -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline border-l-4 border-l-planA rounded-xl transition-colors" data-panel="plans">
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left focus:outline-none" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-planA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 18L9 11.25l4.306 4.306a11.95 11.95 0 015.814-5.518l2.74-1.22M21.75 12.75V7.5h-5.25"></path></svg>
            <span class="font-display font-semibold text-lg truncate">Long Term Plans</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="planCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex gap-2 mb-4">
                <input type="text" id="planInput" placeholder="Add a future plan..." class="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-planA/50 transition-colors">
                <button id="addPlanBtn" class="bg-planA text-white px-4 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold focus:outline-none focus:ring-2 focus:ring-planA/50">+</button>
              </div>
              <ul id="planList" class="item-list space-y-2 overflow-y-auto pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. YT Videos -->
      <section class="panel bg-white dark:bg-panel border border-slate-200 dark:border-hairline border-l-4 border-l-ytA rounded-xl transition-colors" data-panel="yt">
        <button type="button" class="collapse-toggle w-full flex items-center justify-between gap-3 px-5 py-4 text-left focus:outline-none" aria-expanded="true">
          <span class="flex items-center gap-2.5 min-w-0">
            <svg class="w-5 h-5 text-ytA shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="font-display font-semibold text-lg truncate">YouTube Links</span>
          </span>
          <span class="flex items-center gap-3 shrink-0">
            <span id="ytCount" class="text-xs font-mono text-inkMuted bg-slate-100 dark:bg-panelAlt px-2 py-0.5 rounded-full min-w-[1.5rem] text-center">0</span>
            <svg class="chevron w-4 h-4 text-inkMuted transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </span>
        </button>
        <div class="panel-body">
          <div>
            <div class="px-5 pb-5">
              <div class="flex flex-col gap-2.5 mb-4">
                <input type="text" id="ytTitleInput" placeholder="Video Title (e.g. Learn Python)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-ytA/50 transition-colors">
                <div class="flex gap-2">
                  <input type="text" id="ytInput" placeholder="Paste YT Link here..." class="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-ytA/50 transition-colors">
                  <button id="addYtBtn" class="bg-ytA text-white px-4 rounded-lg hover:brightness-110 active:scale-95 transition-all font-bold focus:outline-none focus:ring-2 focus:ring-ytA/50">+</button>
                </div>
              </div>
              <ul id="ytList" class="item-list space-y-3 overflow-y-auto pr-1"></ul>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <script type="module">
    // --- THEME TOGGLE LOGIC ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      if (html.classList.contains('dark')) {
        localStorage.theme = 'dark';
        themeIcon.textContent = '☀️';
      } else {
        localStorage.theme = 'light';
        themeIcon.textContent = '🌙';
      }
    });

    // --- CLOCK ---
    function updateClock() {
      const now = new Date();
      document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      document.getElementById('clockTime').textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- COLLAPSE / EXPAND PANELS ---
    document.querySelectorAll('.panel').forEach((panel) => {
      const key = 'panelCollapsed:' + panel.dataset.panel;
      const toggleBtn = panel.querySelector('.collapse-toggle');
      const chevron = panel.querySelector('.chevron');

      const setCollapsed = (collapsed) => {
        panel.classList.toggle('collapsed', collapsed);
        chevron.classList.toggle('-rotate-90', collapsed);
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
      };

      if (localStorage.getItem(key) === 'true') setCollapsed(true);

      toggleBtn.addEventListener('click', () => {
        const collapsed = !panel.classList.contains('collapsed');
        setCollapsed(collapsed);
        localStorage.setItem(key, String(collapsed));
      });
    });

    // --- FIREBASE LOGIC ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const lists = {
      links: document.getElementById('linkList'),
      tasks: document.getElementById('taskList'),
      plans: document.getElementById('planList'),
      yt: document.getElementById('ytList')
    };

    const counts = { links: 0, tasks: 0, plans: 0, yt: 0 };
    function updateTotalCount() {
      const total = counts.links + counts.tasks + counts.plans + counts.yt;
      document.getElementById('totalCount').textContent = total + (total === 1 ? ' item tracked' : ' items tracked');
    }

    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Consolidated add function for all types of data
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      let dataToSave = { createdAt: serverTimestamp() };

      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Untitled Video';
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('Invalid YouTube Link'); return; }
        dataToSave.videoId = vidId;
        titleInput.value = '';
      }
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Saved Link';
        let url = mainInputValue;
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        dataToSave.url = url;
        titleInput.value = '';
      }
      else {
        dataToSave.text = mainInputValue;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    const emptyMessages = {
      links: 'No links saved yet — add one above.',
      tasks: 'Nothing on the list — add your first task.',
      plans: 'No plans yet — sketch out what\'s next.',
      yt: 'No videos saved yet — paste a link above.'
    };

    function faviconFor(url) {
      try {
        const host = new URL(url).hostname;
        return `https://www.google.com/s2/favicons?sz=32&domain=${host}`;
      } catch {
        return '';
      }
    }

    function listenToCollection(collectionName, listElement, type, key, countId) {
      const q = query(collection(db, collectionName), orderBy("createdAt", "desc"));

      onSnapshot(q, (snapshot) => {
        counts[key] = snapshot.size;
        document.getElementById(countId).textContent = snapshot.size;
        updateTotalCount();

        listElement.innerHTML = '';

        if (snapshot.empty) {
          const li = document.createElement('li');
          li.className = 'text-sm text-slate-400 dark:text-inkMuted italic py-2';
          li.textContent = emptyMessages[key];
          listElement.appendChild(li);
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement('li');
          li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-lg border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';

          if (type === 'yt' && data.videoId) {
            li.innerHTML = `
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-medium text-sm text-slate-800 dark:text-ink leading-snug">${data.text}</h3>
                <button class="delete-btn text-inkMuted hover:text-rose-500 transition-colors shrink-0 p-1 opacity-0 group-hover/item:opacity-100 focus:opacity-100">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
              <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-md bg-black">
                <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${data.videoId}" frameborder="0" allowfullscreen></iframe>
              </div>
            `;
          } else if (type === 'link' && data.url) {
            const favicon = faviconFor(data.url);
            li.innerHTML = `
              <div class="flex items-center justify-between w-full gap-3">
                <a href="${data.url}" target="_blank" rel="noopener" class="flex items-center gap-2.5 min-w-0 text-sm font-medium text-slate-700 dark:text-ink hover:text-linkA dark:hover:text-linkA transition-colors">
                  ${favicon ? `<img src="${favicon}" class="w-4 h-4 rounded-sm shrink-0" onerror="this.style.visibility='hidden'" alt="">` : ''}
                  <span class="truncate">${data.text}</span>
                </a>
                <button class="delete-btn text-inkMuted hover:text-rose-500 transition-colors shrink-0 p-1 opacity-0 group-hover/item:opacity-100 focus:opacity-100">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          } else {
            const dotColor = key === 'tasks' ? 'bg-taskA' : 'bg-planA';
            li.innerHTML = `
              <div class="flex items-center justify-between w-full gap-3">
                <span class="flex items-center gap-2.5 min-w-0">
                  <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></span>
                  <span class="text-sm text-slate-700 dark:text-ink truncate">${data.text}</span>
                </span>
                <button class="delete-btn text-inkMuted hover:text-rose-500 transition-colors shrink-0 p-1 opacity-0 group-hover/item:opacity-100 focus:opacity-100">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          }

          li.querySelector('.delete-btn').addEventListener('click', async () => {
            await deleteDoc(doc(db, collectionName, docSnap.id));
          });

          listElement.appendChild(li);
        });
      });
    }

    // Button Click Listeners
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'text'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));

    // "Enter" Key Listeners
    ['linkUrlInput', 'taskInput', 'planInput', 'ytInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          let btnId = id.replace('Input', 'Btn');
          if (id === 'linkUrlInput') btnId = 'addLinkBtn';
          if (id === 'ytInput') btnId = 'addYtBtn';
          document.getElementById(btnId).click();
        }
      });
    });

    // Start Listeners
    listenToCollection('quickLinks', lists.links, 'link', 'links', 'linkCount');
    listenToCollection('tasks', lists.tasks, 'text', 'tasks', 'taskCount');
    listenToCollection('plans', lists.plans, 'text', 'plans', 'planCount');
    listenToCollection('ytLinks', lists.yt, 'yt', 'yt', 'ytCount');

  </script>
</body>
</html>
