<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Modern Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Modern Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  <style>
    body { transition: background-color 0.4s ease, color 0.4s ease; }
    /* Beautiful Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    /* Glass Effect for Cards */
    .glass-panel {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 dark:from-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans transition-colors duration-500 selection:bg-brand-500 selection:text-white">

  <div class="max-w-[1500px] mx-auto space-y-8">
    
    <!-- Modern Header -->
    <header class="flex justify-between items-center glass-panel bg-white/60 dark:bg-slate-800/60 p-6 md:px-8 md:py-6 rounded-3xl shadow-lg shadow-slate-200/50 dark:shadow-none border border-white/50 dark:border-slate-700/50 transition-colors duration-300">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-500 to-purple-500 flex items-center justify-center shadow-lg shadow-brand-500/30 text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Workspace</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5 font-medium flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cloud Synced
          </p>
        </div>
      </div>
      <button id="themeToggle" class="p-3.5 rounded-2xl bg-white dark:bg-slate-700 hover:bg-slate-100 dark:hover:bg-slate-600 transition-all duration-300 shadow-sm border border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500 hover:scale-105 active:scale-95" title="Toggle Theme">
        <span id="themeIcon" class="text-xl">🌓</span>
      </button>
    </header>

    <!-- 4-Column Grid Layout (Using items-start so collapsed cards don't stretch) -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 items-start">
      
      <!-- 1. Quick Links -->
      <div class="glass-panel bg-white/70 dark:bg-slate-800/70 rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-white/60 dark:border-slate-700/50 transition-all duration-300 overflow-hidden group">
        <!-- Clickable Header for Collapse -->
        <div class="flex items-center justify-between p-5 cursor-pointer hover:bg-white/40 dark:hover:bg-slate-700/30 transition-colors" onclick="toggleSection('linksBody', 'linksChevron')">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-purple-100 dark:bg-purple-500/20 rounded-xl text-purple-600 dark:text-purple-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Quick Links</h2>
          </div>
          <svg id="linksChevron" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <!-- Collapsible Body -->
        <div id="linksBody" class="px-5 pb-5 flex flex-col transition-all duration-300">
          <div class="flex flex-col gap-2.5 mb-5 mt-2">
            <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
            <div class="flex gap-2">
              <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
              <button id="addLinkBtn" class="bg-purple-600 text-white px-5 py-3 rounded-2xl hover:bg-purple-700 active:scale-95 transition-all font-bold shadow-lg shadow-purple-600/30 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              </button>
            </div>
          </div>
          <ul id="linkList" class="h-[320px] overflow-y-auto pr-1 space-y-3"></ul>
        </div>
      </div>

      <!-- 2. What To Do Next -->
      <div class="glass-panel bg-white/70 dark:bg-slate-800/70 rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-white/60 dark:border-slate-700/50 transition-all duration-300 overflow-hidden">
        <div class="flex items-center justify-between p-5 cursor-pointer hover:bg-white/40 dark:hover:bg-slate-700/30 transition-colors" onclick="toggleSection('tasksBody', 'tasksChevron')">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-blue-100 dark:bg-blue-500/20 rounded-xl text-blue-600 dark:text-blue-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">To Do Next</h2>
          </div>
          <svg id="tasksChevron" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <div id="tasksBody" class="px-5 pb-5 flex flex-col transition-all duration-300">
          <div class="flex gap-2 mb-5 mt-2">
            <input type="text" id="taskInput" placeholder="Add a new task..." class="flex-1 px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
            <button id="addTaskBtn" class="bg-blue-600 text-white px-5 py-3 rounded-2xl hover:bg-blue-700 active:scale-95 transition-all font-bold shadow-lg shadow-blue-600/30 flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
          </div>
          <ul id="taskList" class="h-[370px] overflow-y-auto pr-1 space-y-3"></ul>
        </div>
      </div>

      <!-- 3. Long Term Plans -->
      <div class="glass-panel bg-white/70 dark:bg-slate-800/70 rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-white/60 dark:border-slate-700/50 transition-all duration-300 overflow-hidden">
        <div class="flex items-center justify-between p-5 cursor-pointer hover:bg-white/40 dark:hover:bg-slate-700/30 transition-colors" onclick="toggleSection('plansBody', 'plansChevron')">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-emerald-100 dark:bg-emerald-500/20 rounded-xl text-emerald-600 dark:text-emerald-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Long Term</h2>
          </div>
          <svg id="plansChevron" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <div id="plansBody" class="px-5 pb-5 flex flex-col transition-all duration-300">
          <div class="flex gap-2 mb-5 mt-2">
            <input type="text" id="planInput" placeholder="Add a future plan..." class="flex-1 px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
            <button id="addPlanBtn" class="bg-emerald-600 text-white px-5 py-3 rounded-2xl hover:bg-emerald-700 active:scale-95 transition-all font-bold shadow-lg shadow-emerald-600/30 flex items-center justify-center">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
          </div>
          <ul id="planList" class="h-[370px] overflow-y-auto pr-1 space-y-3"></ul>
        </div>
      </div>

      <!-- 4. YT Videos -->
      <div class="glass-panel bg-white/70 dark:bg-slate-800/70 rounded-3xl shadow-xl shadow-slate-200/40 dark:shadow-none border border-white/60 dark:border-slate-700/50 transition-all duration-300 overflow-hidden">
        <div class="flex items-center justify-between p-5 cursor-pointer hover:bg-white/40 dark:hover:bg-slate-700/30 transition-colors" onclick="toggleSection('ytBody', 'ytChevron')">
          <div class="flex items-center gap-3">
            <div class="p-2.5 bg-rose-100 dark:bg-rose-500/20 rounded-xl text-rose-600 dark:text-rose-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">Library</h2>
          </div>
          <svg id="ytChevron" class="w-5 h-5 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <div id="ytBody" class="px-5 pb-5 flex flex-col transition-all duration-300">
          <div class="flex flex-col gap-2.5 mb-5 mt-2">
            <input type="text" id="ytTitleInput" placeholder="Video Title (e.g. Learn Python)" class="w-full px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-rose-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
            <div class="flex gap-2">
              <input type="text" id="ytInput" placeholder="Paste YT Link here..." class="flex-1 px-4 py-3 bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700/50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-rose-500 dark:text-white transition-all text-sm placeholder-slate-400 shadow-inner">
              <button id="addYtBtn" class="bg-rose-600 text-white px-5 py-3 rounded-2xl hover:bg-rose-700 active:scale-95 transition-all font-bold shadow-lg shadow-rose-600/30 flex items-center justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              </button>
            </div>
          </div>
          <ul id="ytList" class="h-[320px] overflow-y-auto pr-1 space-y-4"></ul>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    // --- COLLAPSE LOGIC ---
    window.toggleSection = function(bodyId, iconId) {
      const body = document.getElementById(bodyId);
      const icon = document.getElementById(iconId);
      body.classList.toggle('hidden');
      icon.classList.toggle('rotate-180');
    };

    // --- THEME TOGGLE LOGIC ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      if (html.classList.contains('dark')) {
        localStorage.theme = 'dark';
        themeIcon.textContent = '☀️';
      } else {
        localStorage.theme = 'light';
        themeIcon.textContent = '🌙';
      }
    });

    // --- FIREBASE LOGIC ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const lists = {
      links: document.getElementById('linkList'),
      tasks: document.getElementById('taskList'),
      plans: document.getElementById('planList'),
      yt: document.getElementById('ytList')
    };

    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      let dataToSave = { createdAt: serverTimestamp() };
      
      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Untitled Video';
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('Invalid YouTube Link'); return; }
        dataToSave.videoId = vidId;
        titleInput.value = ''; 
      } 
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Saved Link';
        let url = mainInputValue;
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        dataToSave.url = url;
        titleInput.value = '';
      } 
      else {
        dataToSave.text = mainInputValue;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    function listenToCollection(collectionName, listElement, type = 'text') {
      const q = query(collection(db, collectionName), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        listElement.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement('li');
          // Upgraded List Item Styling
          li.className = 'group flex flex-col gap-2 p-4 bg-white/80 dark:bg-slate-700/60 rounded-2xl border border-slate-100 dark:border-slate-600/50 shadow-sm transition-all hover:shadow-md hover:-translate-y-0.5';
          
          if (type === 'yt' && data.videoId) {
            li.innerHTML = `
              <h3 class="font-bold text-[15px] text-slate-800 dark:text-white mb-1 truncate px-1">${data.text}</h3>
              <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-xl bg-slate-900 shadow-inner">
                <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${data.videoId}" frameborder="0" allowfullscreen></iframe>
              </div>
              <button class="delete-btn text-sm font-semibold text-slate-400 hover:text-rose-500 text-left mt-2 transition-colors flex items-center gap-1 px-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Remove
              </button>
            `;
          } else if (type === 'link' && data.url) {
            li.innerHTML = `
              <div class="flex justify-between items-center w-full gap-3 px-1">
                <a href="${data.url}" target="_blank" class="flex items-center gap-2 text-purple-600 dark:text-purple-400 font-bold hover:text-purple-700 dark:hover:text-purple-300 transition-colors truncate flex-1">
                  <div class="p-1.5 bg-purple-50 dark:bg-purple-500/10 rounded-lg shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                  </div>
                  <span class="truncate">${data.text}</span>
                </a>
                <button class="delete-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-2 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-500/10 transition-all shrink-0 focus:opacity-100">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          } else {
            li.innerHTML = `
              <div class="flex justify-between items-center w-full gap-3 px-1">
                <span class="text-slate-700 dark:text-slate-200 leading-relaxed font-medium">${data.text}</span>
                <button class="delete-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-2 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-500/10 transition-all shrink-0 focus:opacity-100">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          }

          li.querySelector('.delete-btn').addEventListener('click', async () => {
            await deleteDoc(doc(db, collectionName, docSnap.id));
          });

          listElement.appendChild(li);
        });
      });
    }

    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'text'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));

    ['linkUrlInput', 'taskInput', 'planInput', 'ytInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          let btnId = id.replace('Input', 'Btn');
          if (id === 'linkUrlInput') btnId = 'addLinkBtn';
          if (id === 'ytInput') btnId = 'addYtBtn';
          document.getElementById(btnId).click();
        }
      });
    });

    listenToCollection('quickLinks', lists.links, 'link');
    listenToCollection('tasks', lists.tasks, 'text');
    listenToCollection('plans', lists.plans, 'text');
    listenToCollection('ytLinks', lists.yt, 'yt');

  </script>
</body>
</html>
