  <script type="module">
    // --- THEME ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const dark = html.classList.contains('dark');
      localStorage.theme = dark ? 'dark' : 'light';
      themeIcon.textContent = dark ? '☀️' : '🌙';
    });

    // --- CLOCK + GREETING ---
    function updateClock() {
      const now = new Date();
      const hour = now.getHours();
      const part = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : hour < 22 ? 'Good evening' : 'Winding down';
      document.getElementById('greeting').textContent = `${part}, Umar`;
      document.getElementById('clockLine').textContent =
        now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }) +
        '   ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);

    // --- COLLAPSE / EXPAND ---
    const panels = [...document.querySelectorAll('.panel')];
    const panelApi = new Map();

    panels.forEach((panel) => {
      const key = 'panelCollapsed:' + panel.dataset.panel;
      const toggleBtn = panel.querySelector('.collapse-toggle');
      const chevron = panel.querySelector('.chevron');

      const setCollapsed = (collapsed, persist = true) => {
        panel.classList.toggle('collapsed', collapsed);
        chevron.classList.toggle('-rotate-90', collapsed);
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        if (persist) localStorage.setItem(key, String(collapsed));
      };

      panelApi.set(panel, setCollapsed);
      if (localStorage.getItem(key) === 'true') setCollapsed(true, false);

      toggleBtn.addEventListener('click', () => {
        setCollapsed(!panel.classList.contains('collapsed'));
        syncCollapseAllLabel();
      });
    });

    const collapseAllBtn = document.getElementById('collapseAllBtn');
    const collapseAllLabel = document.getElementById('collapseAllLabel');
    function syncCollapseAllLabel() {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      collapseAllLabel.textContent = allCollapsed ? 'Expand all' : 'Collapse all';
    }
    syncCollapseAllLabel();
    collapseAllBtn.addEventListener('click', () => {
      const allCollapsed = panels.every(p => p.classList.contains('collapsed'));
      panels.forEach(p => panelApi.get(p)(!allCollapsed));
      syncCollapseAllLabel();
    });

    // --- FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    // Multi-tab IndexedDB cache makes revisiting the dashboard and offline use faster.
    // Only enable this on devices you trust; cached data may remain on the device.
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch (err) {
      console.warn('Persistent cache unavailable; using memory-only Firestore.', err);
      db = getFirestore(app);
    }

    let toastTimeout;
    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.add('hidden'), 5500);
    }
    function reportError(error, action = 'save your changes') {
      console.error('Firestore:', error);
      toast(`Could not ${action}. ${error?.code === 'permission-denied' ? 'Check your Firestore security rules.' : 'Please check your connection and try again.'}`);
    }

    const connection = {};
    function renderSyncStatus() {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncText');
      const statuses = Object.values(connection);
      const isOffline = !navigator.onLine;
      const pending = statuses.some(s => s.pending);
      const cached = statuses.some(s => s.cached);
      const failed = statuses.some(s => s.failed);
      let message = failed ? 'Sync error' : isOffline ? 'Offline · saved locally' : pending ? 'Syncing…' : cached || statuses.length < 6 ? 'Checking sync…' : 'Synced';
      label.textContent = message;
      dot.className = 'w-1.5 h-1.5 rounded-full ' + (failed ? 'bg-rose-500' : isOffline || cached ? 'bg-amber-400' : pending ? 'bg-blue-400' : 'bg-planA');
    }
    window.addEventListener('online', renderSyncStatus);
    window.addEventListener('offline', renderSyncStatus);

    // --- HELPERS ---
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    // Reject javascript:, data:, malformed URLs, and non-web protocols.
    const normalizeUrl = (value) => {
      const raw = String(value || '').trim();
      if (!raw || /^(?:javascript|data|file|vbscript):/i.test(raw)) return '';
      try {
        const parsed = new URL(/^https?:\/\//i.test(raw) ? raw : `https://${raw}`);
        return ['https:', 'http:'].includes(parsed.protocol) && parsed.hostname ? parsed.href : '';
      } catch { return ''; }
    };

    const isFacebookUrl = (url) => {
      try {
        const host = new URL(url).hostname.toLowerCase();
        return host === 'facebook.com' || host.endsWith('.facebook.com') || host === 'fb.watch' || host === 'fb.com' || host.endsWith('.fb.com');
      } catch { return false; }
    };

    const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } };

    function getYTVideoId(input) {
      try {
        const url = new URL(normalizeUrl(input));
        const host = url.hostname.toLowerCase();
        let id = null;
        if (host === 'youtu.be' || host === 'www.youtu.be') {
          id = url.pathname.split('/').filter(Boolean)[0];
        } else if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtube-nocookie.com', 'www.youtube-nocookie.com'].includes(host)) {
          const parts = url.pathname.split('/').filter(Boolean);
          id = parts[0] === 'watch' ? url.searchParams.get('v') :
            ['shorts', 'embed', 'live', 'v'].includes(parts[0]) ? parts[1] : null;
        }
        return /^[a-zA-Z0-9_-]{11}$/.test(id || '') ? id : null;
      } catch { return null; }
    }

    const checkIcon = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 12l4 4L19 6"/></svg>';
    function completedLabel(item) {
      if (!item.done || !item.completedAt) return '';
      try {
        const date = typeof item.completedAt.toDate === 'function'
          ? item.completedAt.toDate()
          : new Date(item.completedAt.seconds * 1000);
        return Number.isNaN(date.getTime()) ? '' : `Completed ${date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
      } catch { return ''; }
    }

    const mediaCheckButton = (item, label) => {
      const done = !!item.done;
      return `<button type="button" class="toggle-btn inline-flex items-center gap-2 py-2 px-3 rounded-lg text-xs font-semibold min-h-10 transition-colors ${done ? 'bg-planA/15 border border-planA/70 text-green-700 dark:text-planA' : 'bg-white dark:bg-panel border border-slate-200 dark:border-hairline text-slate-600 dark:text-inkMuted hover:border-planA'}" aria-pressed="${done}" aria-label="${done ? `Mark ${label} as not watched` : `Mark ${label} as watched`}">
        <span class="w-4 h-4 rounded border ${done ? 'bg-planA border-planA text-white' : 'border-current'} flex items-center justify-center">${done ? checkIcon : ''}</span>
        ${done ? 'Watched' : 'Mark watched'}</button>`;
    };
    function mediaPreview(videoId, title) {
      const safeId = esc(videoId);
      return `<div class="media-preview relative overflow-hidden rounded-lg bg-slate-900">
        <button type="button" class="play-video w-full h-full relative group/play" data-video="${safeId}" aria-label="Play ${esc(title)}">
          <img src="https://i.ytimg.com/vi/${safeId}/hqdefault.jpg" loading="lazy" decoding="async" alt="" class="w-full h-full object-cover" width="480" height="360">
          <span class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover/play:bg-black/25 transition-colors">
            <span class="rounded-full bg-red-600 text-white px-4 py-2 shadow-lg font-semibold text-xs">▶ Play video</span>
          </span>
        </button></div>`;
    }
    // Creating a player only after tapping Play avoids N YouTube iframes on page load.
    function mountMediaPlayers(root) {
      root.querySelectorAll('.play-video').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.video;
          if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return;
          const iframe = document.createElement('iframe');
          iframe.className = 'media-player absolute inset-0';
          iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
          iframe.title = 'YouTube video player';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.referrerPolicy = 'strict-origin-when-cross-origin';
          iframe.allowFullscreen = true;
          btn.parentElement.replaceChildren(iframe);
        });
      });
    }

    const faviconFor = (url) => {
      try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(url).hostname}`; }
      catch { return ''; }
    };

    const trashIcon = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
    const editIcon  = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>`;

    const iconBtn = 'text-inkMuted hover:text-slate-900 dark:hover:text-white transition-colors shrink-0 p-2 min-w-9 min-h-9 inline-flex items-center justify-center opacity-100 md:opacity-0 md:group-hover/item:opacity-100 md:focus:opacity-100';

    // --- PRIORITIES ---
    const PRIORITIES = {
      high:   { label: 'High',   rank: 0, dot: 'bg-urgent', chip: 'text-rose-600 dark:text-rose-300 bg-rose-500/10 border-rose-500/30', on: 'bg-urgent text-white border-urgent' },
      medium: { label: 'Medium', rank: 1, dot: 'bg-taskA',  chip: 'text-amber-600 dark:text-amber-300 bg-amber-500/10 border-amber-500/30', on: 'bg-taskA text-white border-taskA' },
      low:    { label: 'Low',    rank: 2, dot: 'bg-steady', chip: 'text-sky-600 dark:text-sky-300 bg-sky-500/10 border-sky-500/30', on: 'bg-steady text-white border-steady' },
    };
    const PRIORITY_ORDER = ['high', 'medium', 'low'];
    const priorityOf = (t) => PRIORITIES[t.priority] ? t.priority : 'medium';

    let newTaskPriority = localStorage.getItem('newTaskPriority') || 'medium';
    if (!PRIORITIES[newTaskPriority]) newTaskPriority = 'medium';

    const prioritySelect = document.getElementById('prioritySelect');
    function renderPrioritySelect() {
      prioritySelect.innerHTML = '';
      PRIORITY_ORDER.forEach((p) => {
        const conf = PRIORITIES[p];
        const active = p === newTaskPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold' : 'bg-slate-100 dark:bg-panelAlt text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white/80' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => {
          newTaskPriority = p;
          localStorage.setItem('newTaskPriority', p);
          renderPrioritySelect();
        });
        prioritySelect.appendChild(btn);
      });
    }
    renderPrioritySelect();

    // --- FILTERS + SEARCH ---
    let taskFilter = localStorage.getItem('taskFilter') || 'open';
    let searchTerm = '';

    const FILTERS = [
      { id: 'open', label: 'Open' },
      { id: 'high', label: 'High' },
      { id: 'medium', label: 'Medium' },
      { id: 'low', label: 'Low' },
      { id: 'done', label: 'Done' },
      { id: 'all', label: 'All' },
    ];

    const taskFilters = document.getElementById('taskFilters');
    function renderFilters() {
      taskFilters.innerHTML = '';
      FILTERS.forEach(f => {
        const active = f.id === taskFilter;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg shrink-0 px-2.5 py-1 rounded-lg text-xs transition-colors ' +
          (active ? 'bg-slate-900 dark:bg-ink text-white dark:text-graphite border-slate-900 dark:border-ink font-semibold'
                  : 'bg-transparent text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.textContent = f.label;
        btn.addEventListener('click', () => {
          taskFilter = f.id;
          localStorage.setItem('taskFilter', f.id);
          renderFilters();
          renderList('tasks');
          updateStats();
        });
        taskFilters.appendChild(btn);
      });
    }
    renderFilters();

    const searchInput = document.getElementById('searchInput');
    const searchNotice = document.getElementById('searchNotice');
    let searchTimer;
    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value.trim().toLowerCase();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        Object.keys(config).forEach(key => { visibleLimits[key] = PAGE_SIZE; renderList(key); });
        updateStats();
      }, 140);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
    });
    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === '/' && !typing && !editing) { e.preventDefault(); searchInput.focus(); }
    });

    // --- STATE ---
    const state = { tasks: [], notes: [], links: [], plans: [], yt: [], fb: [] };
    const PAGE_SIZE = 48;
    const visibleLimits = { tasks: PAGE_SIZE, notes: PAGE_SIZE, links: PAGE_SIZE, plans: PAGE_SIZE, yt: PAGE_SIZE, fb: PAGE_SIZE };
    const mediaFilters = {
      yt: localStorage.getItem('ytFilter') || 'queued',
      fb: localStorage.getItem('fbFilter') || 'queued'
    };
    for (const key of ['yt', 'fb']) {
      if (!['queued', 'watched', 'all'].includes(mediaFilters[key])) mediaFilters[key] = 'queued';
    }
    function renderMediaFilters(key) {
      const container = document.getElementById(`${key}Filters`);
      container.replaceChildren();
      [['queued', 'To watch'], ['watched', 'Watched'], ['all', 'All']].forEach(([value, label]) => {
        const btn = document.createElement('button');
        const active = mediaFilters[key] === value;
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg rounded-lg px-3 py-1.5 min-h-9 text-xs transition-colors ' +
          (active ? 'bg-slate-900 dark:bg-ink text-white dark:text-graphite font-semibold' : 'border border-slate-200 dark:border-hairline text-slate-500 dark:text-inkMuted hover:border-slate-400');
        btn.textContent = label;
        btn.addEventListener('click', () => {
          mediaFilters[key] = value;
          localStorage.setItem(`${key}Filter`, value);
          visibleLimits[key] = PAGE_SIZE;
          renderMediaFilters(key);
          renderList(key);
          updateStats();
        });
        container.append(btn);
      });
    }
    renderMediaFilters('yt');
    renderMediaFilters('fb');

    const config = {
      tasks: { collection: 'tasks',      el: document.getElementById('taskList'), countId: 'taskCount', accent: 'bg-taskA', title: 'Task' },
      notes: { collection: 'notes',      el: document.getElementById('noteList'), countId: 'noteCount', accent: 'bg-noteA', title: 'Note' },
      links: { collection: 'quickLinks', el: document.getElementById('linkList'), countId: 'linkCount', accent: 'bg-linkA', title: 'Link' },
      plans: { collection: 'plans',      el: document.getElementById('planList'), countId: 'planCount', accent: 'bg-planA', title: 'Plan' },
      yt:    { collection: 'ytLinks',    el: document.getElementById('ytList'),   countId: 'ytCount',   accent: 'bg-ytA',   title: 'Video' },
      fb:    { collection: 'fbLinks',    el: document.getElementById('fbList'),   countId: 'fbCount',   accent: 'bg-fbA',   title: 'Facebook Link' },
    };

    const emptyMessages = {
      tasks: 'Nothing here — add a task or switch the filter.',
      notes: 'No notes yet — write one on the left.',
      links: 'No links saved yet — add one above.',
      plans: 'No plans yet — sketch out what\'s next.',
      yt: 'No videos saved yet — paste a link above.',
      fb: 'No Facebook links saved yet — paste a link above.'
    };

    function searchableText(key, item) {
      if (key === 'notes') {
        const linkText = (item.links || []).map(l => `${l.label || ''} ${l.url || ''}`).join(' ');
        return `${item.text || ''} ${item.body || ''} ${linkText}`.toLowerCase();
      }
      return `${item.text || ''} ${item.url || ''} ${item.reflection || ''}`.toLowerCase();
    }

    /* ==========================================================
       DETAIL / EDIT DIALOG
       ========================================================== */
    const overlay = document.getElementById('editorOverlay');
    const editorFields = document.getElementById('editorFields');
    const editorTitleEl = document.getElementById('editorTitle');
    const editorAccent = document.getElementById('editorAccent');
    let editing = null;          // { key, id }
    let editPriority = 'medium'; // task priority inside the dialog
    let editDone = false;

    const fieldInput = 'w-full px-3.5 py-2.5 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-linkA/40 focus:border-linkA/40 transition-colors';
    const fieldLabel = 'text-[11px] font-mono text-inkMuted mb-1.5 block';

    function field(label, inner) {
      return `<label class="block"><span class="${fieldLabel}">${label}</span>${inner}</label>`;
    }

    function linkRow(link = { label: '', url: '' }) {
      return `
        <div class="ed-link-row flex gap-2 items-center">
          <input type="text" class="ed-link-label w-[34%] min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="Name" value="${esc(link.label || '')}">
          <input type="text" class="ed-link-url flex-1 min-w-0 px-3 py-2 text-sm bg-slate-50 dark:bg-panelAlt border border-slate-200 dark:border-hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-noteA/40" placeholder="https://" value="${esc(link.url || '')}">
          <button type="button" class="ed-link-remove w-9 h-9 shrink-0 rounded-lg border border-slate-200 dark:border-hairline text-inkMuted hover:text-rose-500 hover:border-rose-400 transition-colors" aria-label="Remove link">&times;</button>
        </div>`;
    }

    function buildEditorFields(key, item) {
      if (key === 'tasks') {
        editPriority = priorityOf(item);
        editDone = !!item.done;
        editorFields.innerHTML =
          field('Task', `<textarea id="edText" rows="5" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Priority</span>
             <div id="edPriority" class="flex gap-1.5 flex-wrap"></div>
           </div>
           <label class="flex items-center gap-2.5 cursor-pointer select-none">
             <input type="checkbox" id="edDone" ${editDone ? 'checked' : ''} class="w-4 h-4 accent-planA">
             <span class="text-sm text-slate-600 dark:text-inkMuted">Mark as done</span>
           </label>`;
        renderEditPriority();
      }
      else if (key === 'plans') {
        editDone = !!item.done;
        editorFields.innerHTML = 
          field('Plan', `<textarea id="edText" rows="6" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none mt-2">
             <input type="checkbox" id="edDone" ${editDone ? 'checked' : ''} class="w-4 h-4 accent-planA">
             <span class="text-sm text-slate-600 dark:text-inkMuted">Mark as done</span>
           </label>`;
      }
      else if (key === 'links') {
        editorFields.innerHTML =
          field('Name', `<input type="text" id="edText" class="${fieldInput}" value="${esc(item.text)}">`) +
          field('URL', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="${esc(item.url || '')}">`) +
          `<a href="${esc(normalizeUrl(item.url) || '#')}" target="_blank" rel="noopener" class="text-xs text-linkA hover:underline">Open this link in a new tab</a>`;
      }
      else if (key === 'yt') {
        editorFields.innerHTML =
          field('Title', `<textarea id="edText" rows="3" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          field('YouTube link', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="https://youtu.be/${esc(item.videoId || '')}">`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="edDone" ${item.done ? 'checked' : ''} class="w-5 h-5 accent-green-500">
            <span class="text-sm text-slate-700 dark:text-ink">Finished watching</span>
          </label>` +
          field('My learning / thoughts', `<textarea id="edReflection" rows="5" maxlength="20000" placeholder="What did you learn? What will you try next?" class="${fieldInput} leading-relaxed">${esc(item.reflection || '')}</textarea>`) +
          `<a class="text-sm text-ytA font-semibold hover:underline" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(item.videoId || '')}">Open video on YouTube ↗</a>`;
      }
      else if (key === 'fb') {
        editorFields.innerHTML =
          field('Title', `<textarea id="edText" rows="3" class="${fieldInput} leading-relaxed">${esc(item.text)}</textarea>`) +
          field('Facebook link', `<input type="text" id="edUrl" class="${fieldInput} font-mono text-xs" value="${esc(item.url || '')}">`) +
          `<label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="edDone" ${item.done ? 'checked' : ''} class="w-5 h-5 accent-green-500">
            <span class="text-sm text-slate-700 dark:text-ink">Finished viewing / reading</span>
          </label>` +
          field('My learning / thoughts', `<textarea id="edReflection" rows="5" maxlength="20000" placeholder="Key idea, reaction, or next action…" class="${fieldInput} leading-relaxed">${esc(item.reflection || '')}</textarea>`) +
          `<a href="${esc(normalizeUrl(item.url) || '#')}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-medium text-fbA hover:underline mt-2">Open on Facebook ↗</a>`;
      }
      else if (key === 'notes') {
        const links = Array.isArray(item.links) ? item.links : [];
        editorFields.innerHTML =
          field('Title', `<input type="text" id="edText" class="${fieldInput} font-medium" value="${esc(item.text)}">`) +
          field('Note', `<textarea id="edBody" rows="8" class="${fieldInput} leading-relaxed">${esc(item.body || '')}</textarea>`) +
          `<div>
             <span class="${fieldLabel}">Links</span>
             <div id="edLinks" class="flex flex-col gap-2">${links.map(linkRow).join('')}</div>
             <button type="button" id="edAddLink" class="mt-2 text-xs font-medium text-noteA hover:underline">+ Add another link</button>
           </div>`;

        document.getElementById('edAddLink').addEventListener('click', () => {
          document.getElementById('edLinks').insertAdjacentHTML('beforeend', linkRow());
        });
        editorFields.onclick = (e) => {
          const btn = e.target.closest('.ed-link-remove');
          if (btn) btn.closest('.ed-link-row').remove();
        };
      }
    }

    function renderEditPriority() {
      const box = document.getElementById('edPriority');
      if (!box) return;
      box.innerHTML = '';
      PRIORITY_ORDER.forEach(p => {
        const conf = PRIORITIES[p];
        const active = p === editPriority;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', String(active));
        btn.className = 'seg flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs transition-all ' +
          (active ? conf.on + ' font-semibold' : 'bg-slate-100 dark:bg-panelAlt text-slate-500 dark:text-inkMuted border-slate-200 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/40');
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white/80' : conf.dot}"></span>${conf.label}`;
        btn.addEventListener('click', () => { editPriority = p; renderEditPriority(); });
        box.appendChild(btn);
      });
    }

    function openEditor(key, item) {
      previousFocus = document.activeElement;
      editing = { key, id: item.id };
      editorTitleEl.textContent = config[key].title;
      editorAccent.className = 'h-1 ' + config[key].accent;
      buildEditorFields(key, item);

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.body.classList.add('modal-open');

      const first = document.getElementById('edText');
      if (first) {
        first.focus();
        if (first.setSelectionRange) {
          const end = first.value.length;
          first.setSelectionRange(end, end);
        }
      }
    }

    let previousFocus = null;
    function closeEditor() {
      editing = null;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.body.classList.remove('modal-open');
      editorFields.innerHTML = '';
      if (previousFocus?.isConnected) previousFocus.focus();
      previousFocus = null;
    }

    async function saveEditor() {
      if (!editing) return;
      const { key, id } = editing;
      const ref = doc(db, config[key].collection, id);
      const textEl = document.getElementById('edText');
      const text = textEl ? textEl.value.trim() : '';

      let patch = null;

      if (key === 'tasks' || key === 'plans') {
        if (!text) { alert('Text cannot be empty.'); return; }
        patch = key === 'tasks'
          ? { text, priority: editPriority, done: document.getElementById('edDone').checked }
          : { text, done: document.getElementById('edDone').checked };
      }
      else if (key === 'links') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (!url) { toast('Please enter a valid http(s) link.'); return; }
        patch = { text: text || hostOf(url), url };
      }
      else if (key === 'yt' || key === 'fb') {
        const url = normalizeUrl(document.getElementById('edUrl').value);
        if (key === 'yt' && !getYTVideoId(url)) { toast('Please enter a valid YouTube video link.'); return; }
        if (key === 'fb' && !isFacebookUrl(url)) { toast('Please enter a valid Facebook link.'); return; }
        const oldItem = state[key].find(x => x.id === id);
        const done = document.getElementById('edDone').checked;
        patch = {
          text: text || (key === 'yt' ? 'Untitled video' : 'Untitled Facebook link'),
          reflection: document.getElementById('edReflection').value.trim(),
          done,
          completedAt: done ? (oldItem?.done && oldItem.completedAt || serverTimestamp()) : null,
          ...(key === 'yt' ? { videoId: getYTVideoId(url) } : { url })
        };
      }
      else if (key === 'notes') {
        const body = document.getElementById('edBody').value.trim();
        const links = [...document.querySelectorAll('#edLinks .ed-link-row')]
          .map(row => ({
            label: row.querySelector('.ed-link-label').value.trim(),
            url: normalizeUrl(row.querySelector('.ed-link-url').value)
          }))
          .filter(l => l.url);
        if (!text && !body && !links.length) { alert('The note is empty.'); return; }
        patch = { text: text || 'Untitled note', body, links };
      }

      // Firestore applies local writes immediately; don't block this dialog while offline.
      updateDoc(ref, patch).catch(err => reportError(err));
      closeEditor();
    }

    async function deleteFromEditor() {
      if (!editing) return;
      const { key, id } = editing;
      if (!confirm('Delete this permanently?')) return;
      deleteDoc(doc(db, config[key].collection, id)).catch(err => reportError(err, 'delete this item'));
      closeEditor();
    }

    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorCancel').addEventListener('click', closeEditor);
    document.getElementById('editorBackdrop').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    document.getElementById('editorDelete').addEventListener('click', deleteFromEditor);

    document.addEventListener('keydown', (e) => {
      if (!editing) return;
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveEditor(); }
    });

    // --- RENDERERS ---
    function renderNoteLink(link) {
      if (!link || !link.url) return '';
      const safeUrl = normalizeUrl(link.url);
      if (!safeUrl) return '';
      const vidId = getYTVideoId(safeUrl);

      if (vidId) {
        return `
          <div class="flex flex-col gap-2">
            ${mediaPreview(vidId, link.label || 'YouTube video')}
            ${link.label ? `<span class="text-xs text-inkMuted truncate">${esc(link.label)}</span>` : ''}
          </div>`;
      }

      const host = hostOf(safeUrl);
      const favicon = faviconFor(safeUrl);
      return `
        <a href="${esc(safeUrl)}" target="_blank" rel="noopener" class="flex items-center gap-3 p-2.5 rounded-lg bg-white dark:bg-panel border border-slate-200 dark:border-hairline hover:border-noteA/60 transition-colors group/link">
          <span class="w-8 h-8 shrink-0 rounded-md bg-slate-100 dark:bg-panelHi border border-slate-200 dark:border-hairline flex items-center justify-center overflow-hidden">
            ${favicon ? `<img src="${esc(favicon)}" class="w-4 h-4" onerror="this.style.visibility='hidden'" alt="">` : ''}
          </span>
          <span class="flex flex-col min-w-0 leading-tight">
            <span class="text-sm font-medium text-slate-700 dark:text-ink truncate group-hover/link:text-noteA transition-colors">${esc(link.label || host)}</span>
            <span class="text-xs font-mono text-inkMuted truncate">${esc(host)}</span>
          </span>
          <svg class="w-4 h-4 ml-auto shrink-0 text-inkMuted group-hover/link:text-noteA transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>`;
    }

    function buildItem(key, item) {
      const collectionName = config[key].collection;
      const li = document.createElement('li');
      const open = () => openEditor(key, item);

      if (key === 'tasks') {
        const p = priorityOf(item);
        const conf = PRIORITIES[p];
        const done = !!item.done;

        li.className = 'group/item flex items-start gap-3 p-3 rounded-xl bg-slate-50 dark:bg-panelAlt border border-slate-200/70 dark:border-hairline hover:border-slate-300 dark:hover:border-inkMuted/30 transition-colors' + (done ? ' opacity-60' : '');
        li.innerHTML = `
          <button class="toggle-btn mt-0.5 w-10 h-10 shrink-0 rounded-lg border-2 flex items-center justify-center transition-colors ${done ? 'bg-planA border-planA text-white' : 'border-slate-300 dark:border-inkMuted/50 hover:border-planA'}" aria-label="${done ? 'Mark as not done' : 'Mark as done'}" aria-pressed="${done}">
            ${done ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : ''}
          </button>
          <div class="min-w-0 flex-1">
            <p class="open-target openable clamp-2 text-sm text-slate-700 dark:text-ink break-words ${done ? 'done-text' : ''}" title="Click to open">${esc(item.text)}</p>
            <button class="priority-btn seg mt-1.5 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] ${conf.chip} hover:brightness-110 transition-all" title="Change priority">
              <span class="w-1.5 h-1.5 rounded-full ${conf.dot}"></span>${conf.label}
            </button>
          </div>
          <div class="flex items-center shrink-0">
            <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
            <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete task">${trashIcon}</button>
          </div>`;

        li.querySelector('.toggle-btn').addEventListener('click', () =>
          updateDoc(doc(db, collectionName, item.id), { done: !done }).catch(err => reportError(err, 'update completion'))
        );
        li.querySelector('.priority-btn').addEventListener('click', () => {
          const next = PRIORITY_ORDER[(PRIORITY_ORDER.indexOf(p) + 1) % PRIORITY_ORDER.length];
          updateDoc(doc(db, collectionName, item.id), { priority: next }).catch(err => reportError(err, 'update priority'));
        });
      }

      else if (key === 'notes') {
        const links = Array.isArray(item.links) ? item.links : [];
        li.className = 'group/item flex flex-col gap-3 p-4 bg-slate-50 dark:bg-panelAlt rounded-xl border border-slate-200 dark:border-hairline hover:border-noteA/50 transition-colors';
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="open-target openable font-display font-semibold text-base text-slate-900 dark:text-white leading-snug break-words clamp-2" title="Click to open">${esc(item.text)}</h3>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete note">${trashIcon}</button>
            </div>
          </div>
          ${item.body ? `<p class="open-target openable clamp-3 text-sm text-slate-600 dark:text-ink/80 leading-relaxed whitespace-pre-wrap break-words" title="Click to open">${esc(item.body)}</p>` : ''}
          ${links.length ? `<div class="flex flex-col gap-2 pt-3 border-t border-slate-200 dark:border-hairline">${links.map(renderNoteLink).join('')}</div>` : ''}`;
      }

      else if (key === 'yt' && item.videoId) {
        const done = !!item.done;
        li.className = 'group/item flex flex-col gap-2.5 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors' + (done ? ' border-planA/30' : '');
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="open-target openable clamp-2 font-medium text-sm text-slate-800 dark:text-ink leading-snug break-words" title="Click to edit">${esc(item.text)}</h3>
            <div class="flex shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Edit video and learning notes">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete video">${trashIcon}</button>
            </div>
          </div>
          ${mediaPreview(item.videoId, item.text || 'video')}
          <div class="flex flex-wrap items-center gap-2 justify-between">
            ${mediaCheckButton(item, 'video')}
            <button class="reflection-btn py-2 px-2 text-xs font-semibold min-h-10 text-ytA hover:underline">${item.reflection ? '✎ Edit learning' : '+ Add learning'}</button>
          </div>
          ${completedLabel(item) ? `<p class="text-[10px] font-mono text-inkMuted">${completedLabel(item)}</p>` : ''}
          ${item.reflection ? `<p class="open-target openable text-xs leading-relaxed whitespace-pre-wrap break-words text-slate-600 dark:text-inkMuted rounded-md bg-white/60 dark:bg-panel/70 p-2.5 clamp-3">${esc(item.reflection)}</p>` : ''}`;
      }

      else if (key === 'fb' && normalizeUrl(item.url)) {
        li.className = 'group/item flex flex-col gap-3 p-4 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-fbA/40 transition-colors' + (item.done ? ' border-planA/40' : '');
        li.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-3 min-w-0">
              <div class="w-10 h-10 shrink-0 rounded-full bg-[#1877F2]/10 flex items-center justify-center text-[#1877F2]">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"></path></svg>
              </div>
              <div class="flex flex-col min-w-0">
                <h3 class="open-target openable clamp-2 font-medium text-sm text-slate-800 dark:text-ink leading-snug break-words" title="Click to edit">${esc(item.text)}</h3>
                <a href="${esc(item.url)}" target="_blank" rel="noopener" class="text-[11px] font-mono text-inkMuted hover:text-fbA truncate mt-1 transition-colors">
                  ${esc(item.url)}
                </a>
              </div>
            </div>
            <div class="flex items-center shrink-0">
              <a href="${esc(item.url)}" target="_blank" rel="noopener" class="p-1.5 text-inkMuted hover:text-fbA transition-colors" aria-label="Open Link">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              </a>
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete Facebook link">${trashIcon}</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 dark:border-hairline pt-2">
            ${mediaCheckButton(item, 'post')}
            <button class="reflection-btn py-2 px-2 min-h-10 text-xs font-semibold text-fbA hover:underline">${item.reflection ? '✎ Edit thoughts' : '+ Add thoughts'}</button>
          </div>
          ${completedLabel(item) ? `<p class="text-[10px] font-mono text-inkMuted">${completedLabel(item)}</p>` : ''}
          ${item.reflection ? `<p class="open-target openable text-xs leading-relaxed whitespace-pre-wrap break-words text-slate-600 dark:text-inkMuted rounded-md bg-white/60 dark:bg-panel/70 p-2.5 clamp-3">${esc(item.reflection)}</p>` : ''}`;
      }

      else if (key === 'links' && normalizeUrl(item.url)) {
        const favicon = faviconFor(item.url);
        li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';
        li.innerHTML = `
          <div class="flex items-center justify-between w-full gap-3">
            <a href="${esc(item.url)}" target="_blank" rel="noopener" class="flex items-center gap-2.5 min-w-0 text-sm font-medium text-slate-700 dark:text-ink hover:text-linkA transition-colors">
              ${favicon ? `<img src="${esc(favicon)}" class="w-4 h-4 rounded-sm shrink-0" onerror="this.style.visibility='hidden'" alt="">` : ''}
              <span class="truncate">${esc(item.text)}</span>
            </a>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete link">${trashIcon}</button>
            </div>
          </div>`;
      }

      else if (key === 'plans') {
        const done = !!item.done;
        li.className = 'group/item flex items-start gap-3 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors' + (done ? ' opacity-70' : '');
        li.innerHTML = `
          <button class="toggle-btn mt-0.5 w-10 h-10 shrink-0 rounded-lg border-2 flex items-center justify-center transition-all ${done ? 'bg-planA border-planA text-white shadow-[0_0_10px_#5FD9A4]' : 'border-slate-300 dark:border-inkMuted/50 hover:border-planA'}" aria-label="${done ? 'Mark as not done' : 'Mark as done'}" aria-pressed="${done}">
            ${done ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>` : ''}
          </button>
          <div class="flex-1 min-w-0">
            <span class="open-target openable clamp-2 text-sm text-slate-700 dark:text-ink break-words ${done ? 'done-text' : ''}" title="Click to open">${esc(item.text)}</span>
          </div>
          <div class="flex items-center shrink-0">
            <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
            <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete item">${trashIcon}</button>
          </div>`;

        li.querySelector('.toggle-btn').addEventListener('click', () =>
          updateDoc(doc(db, collectionName, item.id), { done: !done }).catch(err => reportError(err, 'update completion'))
        );
      }

      else {
        li.className = 'group/item flex flex-col gap-2 p-3.5 bg-slate-50 dark:bg-panelAlt rounded-xl border border-transparent hover:border-slate-200 dark:hover:border-hairline transition-colors';
        li.innerHTML = `
          <div class="flex items-start justify-between w-full gap-3">
            <span class="flex items-start gap-2.5 min-w-0">
              <span class="w-1.5 h-1.5 mt-1.5 rounded-full bg-planA shrink-0"></span>
              <span class="open-target openable clamp-2 text-sm text-slate-700 dark:text-ink break-words" title="Click to open">${esc(item.text)}</span>
            </span>
            <div class="flex items-center shrink-0">
              <button class="edit-btn ${iconBtn}" aria-label="Open and edit">${editIcon}</button>
              <button class="delete-btn ${iconBtn} hover:!text-rose-500" aria-label="Delete item">${trashIcon}</button>
            </div>
          </div>`;
      }

      li.querySelectorAll('.open-target').forEach(el => el.addEventListener('click', open));
      const editBtn = li.querySelector('.edit-btn');
      if (editBtn) editBtn.addEventListener('click', open);
      const reflectionBtn = li.querySelector('.reflection-btn');
      if (reflectionBtn) reflectionBtn.addEventListener('click', () => {
        open();
        document.getElementById('edReflection')?.focus();
      });
      if (key === 'yt' || key === 'fb') {
        li.querySelector('.toggle-btn')?.addEventListener('click', () => {
          updateDoc(doc(db, collectionName, item.id), {
            done: !item.done,
            completedAt: !item.done ? serverTimestamp() : null
          }).catch(err => reportError(err, 'update watched status'));
        });
      }
      mountMediaPlayers(li);
      li.querySelector('.delete-btn').addEventListener('click', () => {
        if (!confirm('Delete this item permanently?')) return;
        deleteDoc(doc(db, collectionName, item.id)).catch(err => reportError(err, 'delete this item'));
      });

      return li;
    }

    function visibleItems(key) {
      let items = state[key];

      if (searchTerm) items = items.filter(i => searchableText(key, i).includes(searchTerm));

      if (key === 'yt' || key === 'fb') {
        if (mediaFilters[key] === 'queued') items = items.filter(x => !x.done);
        if (mediaFilters[key] === 'watched') items = items.filter(x => !!x.done);
      }
      if (key === 'tasks') {
        items = items.filter(t => {
          if (taskFilter === 'all') return true;
          if (taskFilter === 'open') return !t.done;
          if (taskFilter === 'done') return !!t.done;
          return priorityOf(t) === taskFilter && !t.done;
        });
        // Open before done, then high to low. Array#sort is stable, so newest-first holds within ties.
        items = items.slice().sort((a, b) => {
          if (!!a.done !== !!b.done) return a.done ? 1 : -1;
          return PRIORITIES[priorityOf(a)].rank - PRIORITIES[priorityOf(b)].rank;
        });
      }

      return items;
    }

    function renderList(key) {
      const listEl = config[key].el;
      const items = visibleItems(key);
      listEl.innerHTML = '';

      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'col-span-full text-sm text-slate-400 dark:text-inkMuted italic py-2';
        li.textContent = searchTerm ? 'Nothing matches that search.' : emptyMessages[key];
        listEl.appendChild(li);
        return;
      }

      const frag = document.createDocumentFragment();
      items.slice(0, visibleLimits[key]).forEach(item => frag.appendChild(buildItem(key, item)));
      if (items.length > visibleLimits[key]) {
        const more = document.createElement('li');
        more.className = 'col-span-full';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'w-full py-3 px-4 text-xs font-semibold text-linkA border border-slate-200 dark:border-hairline rounded-lg hover:bg-slate-100 dark:hover:bg-panelAlt';
        btn.textContent = `Show more (${items.length - visibleLimits[key]} remaining)`;
        btn.addEventListener('click', () => { visibleLimits[key] += PAGE_SIZE; renderList(key); });
        more.append(btn);
        frag.append(more);
      }
      listEl.appendChild(frag);
    }

    function updateStats() {
      const open = state.tasks.filter(t => !t.done).length;
      const done = state.tasks.length - open;
      const high = state.tasks.filter(t => !t.done && priorityOf(t) === 'high').length;
      const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);

      document.getElementById('statOpen').textContent = open;
      document.getElementById('statHigh').textContent = high;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statTotal').textContent = total + (total === 1 ? ' item tracked' : ' items tracked');
      const mediaItems = [...state.yt, ...state.fb];
      document.getElementById('statMedia').textContent = `${mediaItems.filter(x => x.done).length}/${mediaItems.length} watched`;
      document.getElementById('taskCount').textContent = open;

      if (searchTerm) {
        const matches = Object.keys(state).reduce((n, k) => n + visibleItems(k).length, 0);
        searchNotice.textContent = `${matches} ${matches === 1 ? 'match' : 'matches'}`;
        searchNotice.classList.remove('hidden');
        searchNotice.classList.add('flex');
      } else {
        searchNotice.classList.add('hidden');
        searchNotice.classList.remove('flex');
      }
    }

    function listen(key) {
      const { collection: name, countId } = config[key];
      const q = query(collection(db, name), orderBy('createdAt', 'desc'));

      onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
        connection[key] = {
          cached: snapshot.metadata.fromCache,
          pending: snapshot.metadata.hasPendingWrites,
          failed: false
        };
        renderSyncStatus();
        // Metadata-only updates should not rebuild all cards and interrupt playback.
        if (snapshot.docChanges({ includeMetadataChanges: false }).length === 0 && state[key].length > 0) return;
        state[key] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (key !== 'tasks') document.getElementById(countId).textContent = snapshot.size;
        renderList(key);
        updateStats();
      }, (err) => {
        connection[key] = { cached: false, pending: false, failed: true };
        renderSyncStatus();
        reportError(err, `load ${key}`);
      });
    }

    // --- ADDING ---
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      const dataToSave = { createdAt: serverTimestamp() };

      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('That does not look like a YouTube link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled video';
        dataToSave.videoId = vidId;
        dataToSave.done = false;
        dataToSave.reflection = '';
        titleInput.value = '';
      }
      else if (type === 'fb') {
        const titleInput = document.getElementById('fbTitleInput');
        const url = normalizeUrl(mainInputValue);
        if (!isFacebookUrl(url)) { toast('Please enter a valid Facebook link.'); return; }
        dataToSave.text = titleInput.value.trim() || 'Untitled Facebook link';
        dataToSave.url = url;
        dataToSave.done = false;
        dataToSave.reflection = '';
        titleInput.value = '';
      }
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        const url = normalizeUrl(mainInputValue);
        if (!url) { toast('Please enter a valid website URL.'); return; }
        dataToSave.text = titleInput.value.trim() || hostOf(url);
        dataToSave.url = url;
        titleInput.value = '';
      }
      else if (type === 'task') {
        dataToSave.text = mainInputValue;
        dataToSave.priority = newTaskPriority;
        dataToSave.done = false;
        // Keep the new task visible if the current filter would hide it
        if (taskFilter === 'done' || (PRIORITIES[taskFilter] && taskFilter !== newTaskPriority)) {
          taskFilter = 'open';
          localStorage.setItem('taskFilter', taskFilter);
          renderFilters();
        }
      }
      else {
        dataToSave.text = mainInputValue;
      }

      // Queue locally and clear the input immediately (works even when disconnected).
      addDoc(collection(db, collectionName), dataToSave).catch(err => {
        reportError(err);
        if (!inputElement.value) inputElement.value = mainInputValue;
      });
      inputElement.value = '';
    }

    // --- NOTE COMPOSER ---
    let pendingNoteLinks = [];
    const noteLinkChips = document.getElementById('noteLinkChips');

    function renderNoteChips() {
      noteLinkChips.innerHTML = '';
      const has = pendingNoteLinks.length > 0;
      noteLinkChips.classList.toggle('hidden', !has);
      noteLinkChips.classList.toggle('flex', has);
      if (!has) return;

      pendingNoteLinks.forEach((link, index) => {
        const chip = document.createElement('span');
        chip.className = 'flex items-center gap-2 pl-2 pr-1.5 py-1 text-xs bg-noteA/10 text-slate-700 dark:text-ink border border-noteA/30 rounded-full';
        chip.innerHTML = `
          <span class="truncate max-w-[150px]">${esc(link.label || hostOf(link.url))}</span>
          <button type="button" class="text-inkMuted hover:text-rose-500 transition-colors leading-none px-1" aria-label="Remove link">&times;</button>`;
        chip.querySelector('button').addEventListener('click', () => {
          pendingNoteLinks.splice(index, 1);
          renderNoteChips();
        });
        noteLinkChips.appendChild(chip);
      });
    }

    function stageNoteLink() {
      const urlInput = document.getElementById('noteLinkInput');
      const labelInput = document.getElementById('noteLinkLabelInput');
      const url = normalizeUrl(urlInput.value);
      if (!url) return;
      pendingNoteLinks.push({ url, label: labelInput.value.trim() });
      urlInput.value = '';
      labelInput.value = '';
      renderNoteChips();
    }

    async function addNote() {
      const titleInput = document.getElementById('noteTitleInput');
      const bodyInput = document.getElementById('noteBodyInput');

      if (document.getElementById('noteLinkInput').value.trim()) stageNoteLink();

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      if (!title && !body && !pendingNoteLinks.length) return;

      addDoc(collection(db, 'notes'), {
        text: title || 'Untitled note',
        body,
        links: [...pendingNoteLinks],
        createdAt: serverTimestamp()
      }).catch(err => {
        reportError(err);
        if (!titleInput.value) titleInput.value = title;
        if (!bodyInput.value) bodyInput.value = body;
      });

      titleInput.value = '';
      bodyInput.value = '';
      pendingNoteLinks = [];
      renderNoteChips();
      titleInput.focus();
    }

    // --- WIRING ---
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'task'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));
    document.getElementById('addFbBtn').addEventListener('click', () => addItem('fbLinks', document.getElementById('fbInput'), 'fb'));
    document.getElementById('addNoteLinkBtn').addEventListener('click', stageNoteLink);
    document.getElementById('addNoteBtn').addEventListener('click', addNote);

    const enterMap = { linkUrlInput: 'addLinkBtn', linkTitleInput: 'addLinkBtn', taskInput: 'addTaskBtn', planInput: 'addPlanBtn', ytInput: 'addYtBtn', fbInput: 'addFbBtn' };
    Object.entries(enterMap).forEach(([inputId, btnId]) => {
      document.getElementById(inputId).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById(btnId).click(); }
      });
    });

    ['noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); stageNoteLink(); }
      });
    });

    ['noteTitleInput', 'noteBodyInput', 'noteLinkInput', 'noteLinkLabelInput'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !editing) { e.preventDefault(); addNote(); }
      });
    });

    document.getElementById('noteTitleInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('noteBodyInput').focus(); }
    });

    // Change the priority of the next task with Alt + ArrowUp / ArrowDown
    document.getElementById('taskInput').addEventListener('keydown', (e) => {
      if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const i = PRIORITY_ORDER.indexOf(newTaskPriority);
      const next = e.key === 'ArrowUp' ? Math.max(0, i - 1) : Math.min(PRIORITY_ORDER.length - 1, i + 1);
      newTaskPriority = PRIORITY_ORDER[next];
      localStorage.setItem('newTaskPriority', newTaskPriority);
      renderPrioritySelect();
    });

    // --- START ---
    Object.keys(config).forEach(listen);
    renderSyncStatus();
  </script>
</body>
