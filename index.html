<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Configure Tailwind to use class-based dark mode
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    /* Smooth transition for theme switching */
    body { transition: background-color 0.3s ease, color 0.3s ease; }
    .glass-card { transition: all 0.3s ease; }
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans transition-colors duration-300">

  <div class="max-w-[1400px] mx-auto space-y-8">
    
    <!-- Header with Dark Mode Toggle -->
    <header class="flex justify-between items-center bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors duration-300">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">My Dashboard</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium">Live Syncing • Cloud Database</p>
      </div>
      <button id="themeToggle" class="p-3 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500" title="Toggle Theme">
        <span id="themeIcon">🌓</span>
      </button>
    </header>

    <!-- 4-Column Grid Layout -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
      
      <!-- 1. Quick Links (NEW) -->
      <div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-full h-[500px]">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-purple-100 dark:bg-purple-900/30 rounded-lg text-purple-600 dark:text-purple-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
          </div>
          <h2 class="text-xl font-bold">Quick Links</h2>
        </div>
        <div class="flex flex-col gap-3 mb-6">
          <input type="text" id="linkTitleInput" placeholder="Name (e.g. ChatGPT)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white transition-colors">
          <div class="flex gap-2">
            <input type="text" id="linkUrlInput" placeholder="URL (e.g. chatgpt.com)" class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white transition-colors">
            <button id="addLinkBtn" class="bg-purple-600 text-white px-5 py-2.5 rounded-xl hover:bg-purple-700 active:scale-95 transition-all font-bold shadow-md shadow-purple-500/20">+</button>
          </div>
        </div>
        <ul id="linkList" class="space-y-3 flex-1 overflow-y-auto pr-2"></ul>
      </div>

      <!-- 2. What To Do Next -->
      <div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-full h-[500px]">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-blue-100 dark:bg-blue-900/30 rounded-lg text-blue-600 dark:text-blue-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
          </div>
          <h2 class="text-xl font-bold">What To Do Next</h2>
        </div>
        <div class="flex gap-2 mb-6">
          <input type="text" id="taskInput" placeholder="Add a new task..." class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-colors">
          <button id="addTaskBtn" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl hover:bg-blue-700 active:scale-95 transition-all font-bold shadow-md shadow-blue-500/20">+</button>
        </div>
        <ul id="taskList" class="space-y-3 flex-1 overflow-y-auto pr-2"></ul>
      </div>

      <!-- 3. Long Term Plans -->
      <div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-full h-[500px]">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-emerald-100 dark:bg-emerald-900/30 rounded-lg text-emerald-600 dark:text-emerald-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          </div>
          <h2 class="text-xl font-bold">Long Term Plans</h2>
        </div>
        <div class="flex gap-2 mb-6">
          <input type="text" id="planInput" placeholder="Add a future plan..." class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:text-white transition-colors">
          <button id="addPlanBtn" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl hover:bg-emerald-700 active:scale-95 transition-all font-bold shadow-md shadow-emerald-500/20">+</button>
        </div>
        <ul id="planList" class="space-y-3 flex-1 overflow-y-auto pr-2"></ul>
      </div>

      <!-- 4. YT Videos (UPDATED) -->
      <div class="glass-card bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-full h-[500px]">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-rose-100 dark:bg-rose-900/30 rounded-lg text-rose-600 dark:text-rose-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h2 class="text-xl font-bold">YouTube Links</h2>
        </div>
        <div class="flex flex-col gap-3 mb-6">
          <input type="text" id="ytTitleInput" placeholder="Video Title (e.g. Learn Python)" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 dark:text-white transition-colors">
          <div class="flex gap-2">
            <input type="text" id="ytInput" placeholder="Paste YT Link here..." class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500 dark:text-white transition-colors">
            <button id="addYtBtn" class="bg-rose-600 text-white px-5 py-2.5 rounded-xl hover:bg-rose-700 active:scale-95 transition-all font-bold shadow-md shadow-rose-500/20">+</button>
          </div>
        </div>
        <ul id="ytList" class="space-y-4 flex-1 overflow-y-auto pr-2"></ul>
      </div>

    </div>
  </div>

  <script type="module">
    // --- THEME TOGGLE LOGIC ---
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
      themeIcon.textContent = '☀️';
    } else {
      html.classList.remove('dark');
      themeIcon.textContent = '🌙';
    }

    themeToggleBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      if (html.classList.contains('dark')) {
        localStorage.theme = 'dark';
        themeIcon.textContent = '☀️';
      } else {
        localStorage.theme = 'light';
        themeIcon.textContent = '🌙';
      }
    });

    // --- FIREBASE LOGIC ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4IOS2Kr2jBDnt37_b7YGqTbieNgtpCfU",
      authDomain: "dashboard-dadf9.firebaseapp.com",
      projectId: "dashboard-dadf9",
      storageBucket: "dashboard-dadf9.firebasestorage.app",
      messagingSenderId: "560280635206",
      appId: "1:560280635206:web:627907768c2eb23866c747",
      measurementId: "G-FTDSQ59SS0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const lists = {
      links: document.getElementById('linkList'),
      tasks: document.getElementById('taskList'),
      plans: document.getElementById('planList'),
      yt: document.getElementById('ytList')
    };

    function getYTVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // Consolidated add function for all types of data
    async function addItem(collectionName, inputElement, type = 'text') {
      const mainInputValue = inputElement.value.trim();
      if (!mainInputValue) return;

      let dataToSave = { createdAt: serverTimestamp() };
      
      if (type === 'yt') {
        const titleInput = document.getElementById('ytTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Untitled Video';
        const vidId = getYTVideoId(mainInputValue);
        if (!vidId) { alert('Invalid YouTube Link'); return; }
        dataToSave.videoId = vidId;
        titleInput.value = ''; 
      } 
      else if (type === 'link') {
        const titleInput = document.getElementById('linkTitleInput');
        dataToSave.text = titleInput.value.trim() || 'Saved Link';
        let url = mainInputValue;
        // Ensure the URL works as a proper clickable link
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        dataToSave.url = url;
        titleInput.value = '';
      } 
      else {
        dataToSave.text = mainInputValue;
      }

      await addDoc(collection(db, collectionName), dataToSave);
      inputElement.value = '';
    }

    function listenToCollection(collectionName, listElement, type = 'text') {
      const q = query(collection(db, collectionName), orderBy("createdAt", "desc"));
      
      onSnapshot(q, (snapshot) => {
        listElement.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const li = document.createElement('li');
          li.className = 'group flex flex-col gap-2 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-100 dark:border-slate-700 transition-all hover:shadow-md';
          
          if (type === 'yt' && data.videoId) {
            li.innerHTML = `
              <h3 class="font-bold text-[15px] text-slate-800 dark:text-white mb-1 truncate">${data.text}</h3>
              <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-lg bg-black shadow-inner">
                <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${data.videoId}" frameborder="0" allowfullscreen></iframe>
              </div>
              <button class="delete-btn text-sm font-medium text-slate-400 hover:text-rose-500 text-left mt-2 transition-colors flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Remove
              </button>
            `;
          } else if (type === 'link' && data.url) {
            li.innerHTML = `
              <div class="flex justify-between items-center w-full gap-3">
                <a href="${data.url}" target="_blank" class="flex items-center gap-2 text-purple-600 dark:text-purple-400 font-bold hover:underline truncate flex-1">
                  <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                  ${data.text}
                </a>
                <button class="delete-btn opacity-50 hover:opacity-100 text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-all shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          } else {
            li.innerHTML = `
              <div class="flex justify-between items-center w-full gap-3">
                <span class="text-slate-700 dark:text-slate-200 leading-relaxed">${data.text}</span>
                <button class="delete-btn opacity-50 hover:opacity-100 text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-all shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            `;
          }

          li.querySelector('.delete-btn').addEventListener('click', async () => {
            await deleteDoc(doc(db, collectionName, docSnap.id));
          });

          listElement.appendChild(li);
        });
      });
    }

    // Button Click Listeners
    document.getElementById('addLinkBtn').addEventListener('click', () => addItem('quickLinks', document.getElementById('linkUrlInput'), 'link'));
    document.getElementById('addTaskBtn').addEventListener('click', () => addItem('tasks', document.getElementById('taskInput'), 'text'));
    document.getElementById('addPlanBtn').addEventListener('click', () => addItem('plans', document.getElementById('planInput'), 'text'));
    document.getElementById('addYtBtn').addEventListener('click', () => addItem('ytLinks', document.getElementById('ytInput'), 'yt'));

    // "Enter" Key Listeners
    ['linkUrlInput', 'taskInput', 'planInput', 'ytInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          // Find the corresponding button id (e.g. linkUrlInput -> addLinkBtn)
          let btnId = id.replace('Input', 'Btn');
          if (id === 'linkUrlInput') btnId = 'addLinkBtn';
          if (id === 'ytInput') btnId = 'addYtBtn';
          document.getElementById(btnId).click();
        }
      });
    });

    // Start Listeners
    listenToCollection('quickLinks', lists.links, 'link');
    listenToCollection('tasks', lists.tasks, 'text');
    listenToCollection('plans', lists.plans, 'text');
    listenToCollection('ytLinks', lists.yt, 'yt');

  </script>
</body>
</html>
